# CourseLingo 术语表 · ETH Computer Architecture
# 格式见平台仓库 docs/pipeline-spec.md。术语一致率由 validate.py 校验。

[[term]]
key = "ISA"
zh = "指令集架构"
en = "Instruction Set Architecture"
note = "软件与硬件的契约：规定有哪些指令、寄存器与寻址方式，不规定怎么实现"

[[term]]
key = "microarchitecture"
zh = "微架构"
en = "microarchitecture"
note = "ISA 的具体实现方式：流水线、乱序、缓存层次都属于这一层"

[[term]]
key = "pipeline"
zh = "流水线"
en = "pipeline"
note = "把一条指令的执行切成若干级、各级并行处理不同指令"

[[term]]
key = "hazard"
zh = "冒险"
en = "hazard"
note = "流水线里后一条指令需要前一条还没写回的结果时产生的冲突"

[[term]]
key = "cache"
zh = "缓存"
en = "cache"
note = "利用局部性把常用数据放在离处理器更近的地方"

[[term]]
key = "combinational logic"
zh = "组合逻辑"
en = "combinational logic"
note = "输出只由当前输入决定，与历史无关"

[[term]]
key = "transformation hierarchy"
zh = "转换层次"
en = "transformation hierarchy"
note = "从一个问题到电子流动之间的各层：算法、程序/语言、ISA、微架构、逻辑、器件"

[[term]]
key = "abstraction"
zh = "抽象"
en = "abstraction"
note = "上一层只需要知道下一层的接口，不需要知道它怎么实现"

[[term]]
key = "cross-layer"
zh = "跨层优化"
en = "cross-layer optimization"
note = "把不同层的决定放在一起考虑，而不是各层各优化各的"

[[term]]
key = "DRAM"
zh = "动态随机存储器"
en = "DRAM"
note = "主内存用的存储器件：一个电容存一位，需要定期刷新"

[[term]]
key = "latency"
zh = "延迟"
en = "latency"
note = "一次操作从发起到完成要等多久"

[[term]]
key = "bandwidth"
zh = "带宽"
en = "bandwidth"
note = "单位时间内能搬多少数据"

[[term]]
key = "memory wall"
zh = "内存墙"
en = "memory wall"
note = "处理器算得越来越快，访存延迟与带宽却没跟上，性能被卡在内存这一侧"

[[term]]
key = "data movement"
zh = "数据搬运"
en = "data movement"
note = "把数据从存储搬到计算单元（或反向）的动作，本身也要花时间和能量"

[[term]]
key = "processing in memory"
zh = "内存内计算"
en = "processing in memory"
note = "把一部分计算放进内存芯片或内存附近，省掉来回搬运"

[[term]]
key = "accelerator"
zh = "加速器"
en = "accelerator"
note = "为某一类计算专门做的硬件，用特化换能效"

[[term]]
key = "energy efficiency"
zh = "能效"
en = "energy efficiency"
note = "完成同样一份工作消耗多少能量，通常按每次操作的能量算"

[[term]]
key = "Moore's Law"
zh = "摩尔定律"
en = "Moore's Law"
note = "单位面积晶体管数约每两年翻一番；它描述的是集成度趋势，不是性能保证"

[[term]]
key = "RowHammer"
zh = "行锤"
en = "RowHammer"
note = "反复激活同一行 DRAM 会让相邻行漏电，导致相邻行的位翻转"

[[term]]
key = "TPU"
zh = "张量处理单元"
en = "TPU"
note = "Google 为神经网络推理与训练做的专用加速器，核心是脉动阵列"

[[term]]
key = "refresh"
zh = "刷新"
en = "refresh"
note = "DRAM 电容会漏电，必须周期性地读出来再写回去，否则数据丢失"

[[term]]
key = "CPU"
zh = "中央处理器"
en = "CPU"
note = "执行通用指令流的处理器；与 GPU、FPGA 这类加速器相对"

[[term]]
key = "memory controller"
zh = "内存控制器"
en = "memory controller"
note = "夹在处理器与内存颗粒之间的部件：负责把访存请求排成内存能接受的顺序，并决定谁先被服务"

[[term]]
key = "QoS"
zh = "服务质量"
en = "QoS"
note = "Quality of Service：对「每个使用者至少能拿到多少」给出可检验的承诺，而不是只看平均值"

[[term]]
key = "heterogeneous memory"
zh = "异构内存"
en = "heterogeneous memory"
note = "把几种特性不同的内存拼在一个系统里，再按数据的性质分别放置"

[[term]]
key = "speculation"
zh = "推测执行"
en = "speculation"
note = "处理器在还没确认该不该执行时先执行，事后回滚；Meltdown/Spectre 就出在这里"

# ---- 第 9 讲（Lecture 8a）新增：刻画与片上纠错 ----

[[term]]
key = "retention-time"
zh = "保持时间"
en = "retention time"
note = "一个存储单元在不再补电的情况下，还能被正确读出的最长时间"

[[term]]
key = "retention-failure"
zh = "保持时间失败"
en = "retention failure"
note = "单元漏电到读不出来，属于时间与温度引起的错误，和访问模式无关"

[[term]]
key = "retention-time-profiling"
zh = "保持时间刻画"
en = "retention time profiling"
note = "把每个存储单元的保持时间测出来、再给它们分类的过程；本页行文里简称为刻画"

[[term]]
key = "data-pattern-dependence"
zh = "数据模式依赖"
en = "data pattern dependence"
note = "同一个单元的保持时间会随它自己和邻居存的值变化，所以「这一行的保持时间」不是一个固定的数"

[[term]]
key = "variable-retention-time"
zh = "可变保持时间"
en = "variable retention time"
note = "同一个单元会在几个保持时间状态之间随机切换，只能靠观测发现，推断不出来"

[[term]]
key = "reach-profiling"
zh = "触及式刻画"
en = "reach profiling"
note = "把刷新间隔调得更长或温度调得更高去刻画，让容易失败的单元先暴露出来；代价是假阳性"

[[term]]
key = "refresh-rate"
zh = "刷新频率"
en = "refresh rate"
note = "单位时间内对同一行做多少次刷新；频率越低越省性能与能量，但越容易丢数据"

[[term]]
key = "false-positive"
zh = "假阳性"
en = "false positive"
note = "被判定为有问题、但真实运行条件下从不失败；不伤正确性，但要多付代价"

[[term]]
key = "bloom-filter"
zh = "布隆过滤器"
en = "Bloom filter"
note = "用很少的位表示集合成员：查询快、不会溢出、没有假阴性，但可能有假阳性"

[[term]]
key = "ecc"
zh = "纠错码"
en = "error correcting code"
note = "通常缩写为 ECC：在数据里附加校验位，读到错误时能自动纠正其中一部分"

[[term]]
key = "on-die-ecc"
zh = "片上纠错"
en = "on-die ECC"
note = "纠错逻辑做在 DRAM 芯片内部；它会在外部观察到错误之前就把错误修掉"

[[term]]
key = "scrubbing"
zh = "巡检"
en = "scrubbing"
note = "定期把内存里的数据读出来检查、必要时写回，在错误积累成不可纠正之前修掉它"

[[term]]
key = "energy-delay-product"
zh = "能耗延迟积"
en = "energy delay product"
note = "把能耗与延迟相乘得到的一个综合指标，用来比较方案在两个方向上的总收益"

[[term]]
key = "row-buffer"
zh = "行缓冲"
en = "row buffer"
note = "存储体里被激活那一行的暂存区；访问落在它上面就是行命中，落在别的行上要先预充电再激活"

[[term]]
key = "row-hit"
zh = "行命中"
en = "row hit"
note = "请求要访问的行已经在行缓冲里打开，只需一条读或写命令"

[[term]]
key = "memory-scheduling"
zh = "内存调度"
en = "memory scheduling"
note = "在多个待处理访存请求之间决定先后顺序；这个顺序最终要落到 DRAM 命令这一级"

[[term]]
key = "reinforcement-learning"
zh = "强化学习"
en = "reinforcement learning"
note = "智能体在状态里选动作、按收到的奖励更新估计，目标是最大化长期累计回报"

# ---- 第 11 讲（Lecture 9: Memory Latency II）新增：延迟为什么长、怎么拆 ----

[[term]]
key = "subarray"
zh = "子阵列"
en = "subarray"
note = "DRAM 存储体里更小的一块单元阵列；每个子阵列有自己的本地行缓冲，访问延迟主要花在子阵列这一段"

[[term]]
key = "sense-amplifier"
zh = "读出放大器"
en = "sense amplifier"
note = "把位线上微弱的电荷差放大成 0 或 1 的电路；课内页面也常简写成「感放器」"

[[term]]
key = "bitline"
zh = "位线"
en = "bitline"
note = "把一列单元的电荷引到读出放大器的那条长线；线越长电容越大，充放电越慢，延迟与功耗一起上去"

[[term]]
key = "timing-parameter"
zh = "时序参数"
en = "timing parameter"
note = "DRAM 规范里规定的那几个等待时间，例如激活到可读的 tRCD、激活到可预充电的 tRAS、预充电的 tRP"

[[term]]
key = "timing-margin"
zh = "时序裕量"
en = "timing margin"
note = "参数按最坏情况取，常见情况下用不到的那部分等待时间；本讲大部分工作都在拆这份裕量"

[[term]]
key = "physical-unclonable-function"
zh = "物理不可克隆函数"
en = "physical unclonable function"
note = "用制造过程中不可复制的物理差异当器件指纹：同一颗器件每次测出来一样，不同器件彼此不同"

[[term]]
key = "true-random-number-generator"
zh = "真随机数发生器"
en = "true random number generator"
note = "从物理过程里采样熵来产生随机数，而不是用算法算出一串看起来随机的数列"

# ---- 第 12 讲（Lecture 10: Processing using Memory / UPMEM）新增：一条真实 PIM 内存条的构成与度量 ----

[[term]]
key = "DPU"
zh = "DRAM 处理单元"
en = "DRAM Processing Unit"
note = "UPMEM 放进 DRAM 颗粒里的那个小处理器；本页行文里照源讲义简写成 DPU"

[[term]]
key = "tasklet"
zh = "任务线程"
en = "tasklet"
note = "跑在一个 DPU 上的软件线程；一个 DPU 里可以同时跑多个，源的建议是至少 11 个"

[[term]]
key = "MRAM"
zh = "主内存"
en = "MRAM"
note = "UPMEM 术语里指挂在 DPU 旁边的那些 DRAM bank（Main RAM）；一颗 PIM 芯片里有 8 个 64 MB 的 bank"

[[term]]
key = "WRAM"
zh = "工作内存"
en = "WRAM"
note = "DPU 自己的便签内存（Working RAM）：容量很小、延迟低，访问带宽与访问模式无关"

[[term]]
key = "operational-intensity"
zh = "算术强度"
en = "operational intensity"
note = "每从内存搬运一个字节做多少次算术运算，单位 OP/B；用来划出访存受限与算力受限两块区域"

[[term]]
key = "fine-grained-multithreading"
zh = "细粒度多线程"
en = "fine-grained multithreading"
note = "每个周期换一个线程取指，使同一线程的两条指令不会同时在流水线里，用别的线程盖住相关延迟"

[[term]]
key = "strong-scaling"
zh = "强扩展"
en = "strong scaling"
note = "问题规模固定、只增加处理器数量时，执行时间怎么变"

[[term]]
key = "weak-scaling"
zh = "弱扩展"
en = "weak scaling"
note = "每个处理器分到的问题规模固定、处理器数量与数据一起增加时，执行时间怎么变"
