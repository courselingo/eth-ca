<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-8-title fig-memory-latency-8-desc">
  <title id="fig-memory-latency-8-title">近段可以当成硬件管理的缓存</title>
  <desc id="fig-memory-latency-8-desc">于是近段就成了一块由内存控制器自己管的缓存：热数据留在近段，冷数据放到远段；但这样带来两个必须解决的问题。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">近段可以当成硬件管理的缓存</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">把近段当缓存用，带来两个问题</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题一</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">怎么在两段之间高效搬一行</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题二</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">怎么高效地管理这块缓存</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这两个问题引出了后面的 LISA 与一系列缓存管理方案</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">也就是说，微架构改动会连带出一整套系统问题</text>
</svg>
