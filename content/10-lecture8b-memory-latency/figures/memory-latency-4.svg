<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-4-title fig-memory-latency-4-desc">
  <title id="fig-memory-latency-4-title">延迟为什么长：两个来源</title>
  <desc id="fig-memory-latency-4-desc">讲义把长延迟归到两条上：一是 DRAM 微架构的设计目标是容量与面积、不是延迟；二是延迟参数按「一刀切」的最坏情况定，于是留下大量不必要的余量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">延迟为什么长：两个来源</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">讲义给的两条根源</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">来源一 设计目标</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">每位成本优先，延迟不是目标</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">来源二 一刀切</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">按最坏条件与最坏器件定参数</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义在这一页直接下了结论：很多延迟是不必要的</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">后面全部内容都是对这两条的进攻</text>
</svg>
