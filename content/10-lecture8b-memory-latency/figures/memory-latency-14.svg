<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-14-title fig-memory-latency-14-desc">
  <title id="fig-memory-latency-14-title">同一条思路还能用在电压、安全与刷新上</title>
  <desc id="fig-memory-latency-14-desc">讲义在最后把这条「按实际情况取值」的思路推广到别处：降低电压换能耗但要控制性能损失；延迟的变异性本身可以用来做物理不可克隆函数与真随机数；而刷新也能被部分推迟或与访问并行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一条思路还能用在电压、安全与刷新上</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一条思路的三种延伸</text>
  <rect x="25" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="137.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">电压</text>
  <text x="137.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">降电压换能耗，控制性能损失</text>
  <rect x="278" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="390.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">安全</text>
  <text x="390.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">用延迟差异做指纹与随机数</text>
  <rect x="531" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="643.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">刷新</text>
  <text x="643.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">近期访问过的行可以少刷新</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义的两句总结是：延迟是可以降下来的，而主存需要智能控制器</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它给的原则里，最常出现的一条是「按比最坏情况更好的情况来设计」</text>
</svg>
