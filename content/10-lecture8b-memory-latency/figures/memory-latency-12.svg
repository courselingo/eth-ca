<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-12-title fig-memory-latency-12-desc">
  <title id="fig-memory-latency-12-title">按当下情况取值：自适应延迟 DRAM</title>
  <desc id="fig-memory-latency-12-desc">自适应延迟 DRAM 的做法是：既然最坏情况很少发生，那就按当前的温度与当前这块模块去定时序参数。讲义给的实测是读取延迟降三成多、写入降五成多。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">按当下情况取值：自适应延迟 DRAM</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">按当前温度与当前模块定参数</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">依据什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">当前温度、当前模块的特性</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">实测收益</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">读延迟约降三成、写约降五成</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义给的一组数字是在 55 摄氏度下测 115 块内存条</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一条同时也降低了能耗</text>
</svg>
