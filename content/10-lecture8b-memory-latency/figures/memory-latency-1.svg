<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-1-title fig-memory-latency-1-desc">
  <title id="fig-memory-latency-1-title">这一讲站在四个大方向里的一个上</title>
  <desc id="fig-memory-latency-1-desc">讲义把计算机体系结构当前的四个关键方向并列，其中一个是「根本上低延迟、可预测的架构」；这一讲讲的就是这一条。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲站在四个大方向里的一个上</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">四个关键方向之一</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">这一讲</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">把内存延迟真正降下来</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">不是绕开它</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">而是减少它本身</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义把「低延迟」与「安全」「能效」「以内存为中心」并列</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">说明在它看来这不是一个可以交给缓存去糊过去的问题</text>
</svg>
