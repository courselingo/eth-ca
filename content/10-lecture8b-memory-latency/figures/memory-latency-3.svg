<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 810 244.0" width="810" height="244.0"
     role="img" aria-labelledby="fig-memory-latency-3-title fig-memory-latency-3-desc">
  <title id="fig-memory-latency-3-title">传统做法是「容忍」，不是「降低」</title>
  <desc id="fig-memory-latency-3-desc">讲义回顾了四类经典手段：缓存、预取、多线程、乱序执行。它们的共同点是让处理器不去等，而不是让内存变快。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="810" height="244.0" fill="#ffffff"/>

  <text x="407.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">传统做法是「容忍」，不是「降低」</text>
  <rect x="25" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="110.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">缓存</text>
  <text x="110.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">靠局部性回避</text>
  <rect x="223" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">预取</text>
  <text x="308.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">规则访存才好用</text>
  <rect x="421" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">多线程</text>
  <text x="506.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">要有别的线程可跑</text>
  <rect x="619" y="70" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="704.0" y="99.7" font-size="15" fill="#b45309" text-anchor="middle">乱序执行</text>
  <text x="704.0" y="117.7" font-size="12" fill="#b45309" text-anchor="middle">硬件开销很大</text>
  <rect x="25" y="166" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="195.7" font-size="15" fill="#6b21a8" text-anchor="middle">四类手段都是「不去等」，而延迟本身没有变</text>
  <text x="385.0" y="213.7" font-size="12" fill="#6b21a8" text-anchor="middle">讲义由此转向：能不能真的把它降下来</text>
</svg>
