<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-memory-latency-11-title fig-memory-latency-11-desc">
  <title id="fig-memory-latency-11-title">另一个来源：保守的时序余量</title>
  <desc id="fig-memory-latency-11-desc">讲义指出延迟参数是按最坏情况定的：最坏的温度、最坏的器件。理由是量产良率要求必须覆盖工艺变异，于是常见情况下留下了很大的余量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">另一个来源：保守的时序余量</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">时序参数按最坏情况定，常见情况就留下余量</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">最坏的温度</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">讲义举的意思是最高温那一档</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">最坏的器件</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">电荷最少的那个单元</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">而常见情况下，一个单元能存的电荷比最坏情况多得多</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">电荷多就意味着可以更快地感知与恢复</text>
</svg>
