<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 338" width="486" height="338"
     role="img" aria-labelledby="fig-l6-3-title fig-l6-3-desc">
  <title id="fig-l6-3-title">同一件事在四层上各是一类问题</title>
  <desc id="fig-l6-3-desc">器件层是电学耦合，逻辑与微架构层是翻转的位，系统软件层是页边界被跨过，应用层是别人的数据被改。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="486" height="338" fill="#ffffff"/>

  <text x="243" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一件事，在四层上各是一类问题</text>

  <rect x="23" y="64" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">器件层：相邻单元的电学耦合</text>

  <path d="M243,111 L243,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="440" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="243" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">逻辑与微架构层：一个位被翻转</text>

  <path d="M243,181 L243,193" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="204" width="440" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="243" y="229.2" font-size="12" fill="#6b21a8" text-anchor="middle">系统软件层：页的边界被跨过（4 KB 页对 8 KB 行）</text>

  <path d="M243,251 L243,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="274" width="440" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="243" y="299.2" font-size="12" fill="#9d174d" text-anchor="middle">应用层：别的程序的数据被改写</text>
</svg>
