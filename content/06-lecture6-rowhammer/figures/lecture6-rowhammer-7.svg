<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 268" width="486" height="268"
     role="img" aria-labelledby="fig-l6-7-title fig-l6-7-desc">
  <title id="fig-l6-7-title">多方锤击把检测表撑满，从而绕过 TRR</title>
  <desc id="fig-l6-7-desc">芯片里用于识别攻击行的表容量有限；同时锤很多行会把表撑满，攻击行不再被识别，位翻转照样发生。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="486" height="268" fill="#ffffff"/>

  <text x="243" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多方锤击：把检测表撑满</text>

  <rect x="23" y="64" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">芯片里识别攻击行的表：容量有限</text>

  <path d="M243,111 L243,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="440" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="243" y="159.2" font-size="12" fill="#9d174d" text-anchor="middle">同时锤很多行：表被撑满</text>

  <path d="M243,181 L243,193" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="204" width="440" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="243" y="229.2" font-size="12" fill="#b45309" text-anchor="middle">攻击行不再被识别，位翻转照样发生</text>
</svg>
