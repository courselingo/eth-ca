<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 140" width="612" height="140"
     role="img" aria-labelledby="fig-l6-1-title fig-l6-1-desc">
  <title id="fig-l6-1-title">一个简单的器件层现象怎么变成安全漏洞</title>
  <desc id="fig-l6-1-desc">器件层的单元间耦合，让系统层的内存保护失效，最后落到应用层：别人的数据被改。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="140" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个简单的器件层现象，怎么变成安全漏洞</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">器件层</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">单元间耦合</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">系统层</text>
  <text x="306" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">内存保护失效</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">应用层</text>
  <text x="504" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">别人的数据被改</text>

  <path d="M198,91 L210,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M396,91 L408,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
