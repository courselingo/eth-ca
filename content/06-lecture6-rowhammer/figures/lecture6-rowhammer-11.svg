<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 268" width="608" height="268"
     role="img" aria-labelledby="fig-l6-11-title fig-l6-11-desc">
  <title id="fig-l6-11-title">桥梁的类比：关键在能不能现场修</title>
  <desc id="fig-l6-11-desc">五个桥梁失效的例子跨越 1940 到 2022 年；类比的重点是能不能在现场打补丁，能修的可以继续用，不能修的只能重建。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="608" height="268" fill="#ffffff"/>

  <text x="304" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">桥梁的类比：关键在能不能现场修</text>

  <rect x="23" y="64" width="562" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="304" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">五个结构失效的例子，跨越 1940 到 2022 年</text>

  <rect x="23" y="134" width="90" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">1940</text>

  <rect x="141" y="134" width="90" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="186" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">1994</text>

  <rect x="259" y="134" width="90" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="304" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">2007</text>

  <rect x="377" y="134" width="90" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="422" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">2018</text>

  <rect x="495" y="134" width="90" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">2022</text>

  <rect x="23" y="204" width="562" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="304" y="229.2" font-size="12" fill="#166534" text-anchor="middle">能不能在现场打补丁，决定了它还能不能用</text>
</svg>
