<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327.5" width="760" height="327.5"
     role="img" aria-labelledby="fig-lecture15-memory-contention-3-title fig-lecture15-memory-contention-3-desc">
  <title id="fig-lecture15-memory-contention-3-title">MCP 的两条关键原则</title>
  <desc id="fig-lecture15-memory-contention-3-desc">上排两格是两条原则：按内存强度分开，因为高强度应用会在共享通道上拖慢低强度应用；按行缓冲局部性分开，因为局部性高的应用会占住行缓冲、让别人频繁冲突。下面三条分别是现状（两个应用的页面交错落在同一通道里，请求互相干扰）、分区之后的效果（各走各的通道，干扰消失），以及这条路的起点（现代系统有多个通道，数据怎么映射是一个此前没被用起来的自由度）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="327.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">MCP 的两条关键原则</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">原则一 按内存强度分开</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">高强度应用会在共享通道上拖慢低强度应用</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">原则二 按行缓冲局部性分开</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">局部性高的应用会占住行缓冲，让别人频繁冲突</text>
  <rect x="25" y="141.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="161.85" font-size="11" fill="#1e293b" text-anchor="middle">现状：两个应用的页面交错落在同一通道里，请求互相干扰（p131）</text>
  <rect x="25" y="202.5" width="710" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="224.7" font-size="12" fill="#166534" text-anchor="middle">分区之后：各走各的通道，两个应用之间的请求干扰消失（p132）</text>
  <rect x="25" y="266.5" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="288.7" font-size="12" fill="#1e40af" text-anchor="middle">起点：现代系统有多个通道，数据怎么映射是一个此前没被用起来的自由度（p130）</text>
</svg>
