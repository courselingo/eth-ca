<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327.5" width="760" height="327.5"
     role="img" aria-labelledby="fig-lecture15-memory-contention-5-title fig-lecture15-memory-contention-5-desc">
  <title id="fig-lecture15-memory-contention-5-title">FST 的回路：谁最慢，谁在拖慢它</title>
  <desc id="fig-lecture15-memory-contention-5-desc">上面一条是关键想法：在核这一侧管理干扰，不在共享资源那一侧。中间两格是两个组件：运行时不公平度评估（硬件，估计各应用减速并估计谁在拖慢谁）与动态请求限流（硬件或软件，调整每个核发请求的激进程度）。下面三格是每轮的三个动作：估计系统不公平度、找出最慢的应用、找出干扰它的应用。最下面一条是规则：若不公平度超过目标，就压低干扰者，同时抬高最慢者。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="327.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">FST 的回路：谁最慢，谁在拖慢它</text>
  <rect x="25" y="64" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">关键想法：在核这一侧管理干扰，不在共享资源那一侧（p150）</text>
  <rect x="25" y="128" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">组件一 运行时不公平度评估（硬件）</text>
  <text x="196.25" y="164.85" font-size="11" fill="#1e40af" text-anchor="middle">估计各应用减速，并估计谁在拖慢谁</text>
  <rect x="392.5" y="128" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">组件二 动态请求限流（硬件或软件）</text>
  <text x="563.75" y="164.85" font-size="11" fill="#1e40af" text-anchor="middle">调整每个核发请求的激进程度</text>
  <rect x="25" y="205.5" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="225.85" font-size="11" fill="#166534" text-anchor="middle">① 估计系统不公平度</text>
  <rect x="270" y="205.5" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="225.85" font-size="11" fill="#166534" text-anchor="middle">② 找出最慢的应用</text>
  <rect x="515" y="205.5" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="225.85" font-size="11" fill="#166534" text-anchor="middle">③ 找出干扰它的应用</text>
  <rect x="25" y="266.5" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="288.7" font-size="12" fill="#b45309" text-anchor="middle">若不公平度超过目标：压低干扰者，同时抬高最慢者（p152）</text>
</svg>
