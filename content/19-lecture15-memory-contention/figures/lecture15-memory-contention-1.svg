  <title id="fig-lecture15-memory-contention-1-title">本讲在三站里的位置与它的结构</title>
  <desc id="fig-lecture15-memory-contention-1-desc">上排三格是三条讲次的分工：第 13 讲讲控制器这个部件本身；第 18 讲讲干扰与调度器演化；第 19 讲（本讲）展开另外三种基本功与复杂度。中间四格是这一讲的结构：共享资源链与聪明资源的问题、数据映射（内存通道划分）、源限流（FST）、以及应用到核与 CPU 和 IO、可预测性能与总结。最下面一条说明讲义前 90 多页带 Recall: 或复习第 18 讲那条线，新内容从 p93 与 p115 起。</desc>

  <defs>
