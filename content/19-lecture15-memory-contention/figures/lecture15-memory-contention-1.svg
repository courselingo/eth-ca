  <text x="380" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">干扰与调度器演化</text>
  <rect x="515" y="64" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">第 19 讲（本讲）</text>
