<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 247" width="760" height="247"
     role="img" aria-labelledby="fig-lecture15-memory-contention-10-title fig-lecture15-memory-contention-10-desc">
  <title id="fig-lecture15-memory-contention-10-title">可预测性能的目标与五篇延伸阅读</title>
  <desc id="fig-lecture15-memory-contention-10-desc">上面一条是目标：系统里有 CPU、GPU、硬件加速器与 DMA 引擎这些异构主体，它们共享内存资源会互相干扰，要回答的是怎么分配资源既减少干扰又给出可预测性能。下面五格是五篇延伸阅读的方向：源限流、MISE 减速模型、ASM 减速模型、DASH 截止时间、解耦 DMA。最下面一条说它们分别负责估计、控制与隔离。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="247" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">可预测性能的目标与五篇延伸阅读</text>
  <rect x="25" y="64" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">目标：异构主体共享内存会互相干扰，怎么分配资源既减少干扰又给出可预测性能（p107）</text>
  <rect x="25" y="128" width="122" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="86" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">源限流</text>
  <rect x="172" y="128" width="122" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="233" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">MISE 减速模型</text>
  <rect x="319" y="128" width="122" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">ASM 减速模型</text>
  <rect x="466" y="128" width="122" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="527" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">DASH 截止时间</text>
  <rect x="613" y="128" width="122" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="674" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">解耦 DMA</text>
  <rect x="25" y="189" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="209.35" font-size="11" fill="#1e293b" text-anchor="middle">五篇延伸阅读分别负责估计、控制与隔离（p110 到 p114）</text>
</svg>
