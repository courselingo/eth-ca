<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 263.5" width="760" height="263.5"
     role="img" aria-labelledby="fig-lecture15-memory-contention-12-title fig-lecture15-memory-contention-12-desc">
  <title id="fig-lecture15-memory-contention-12-title">四种工具各自动什么</title>
  <desc id="fig-lecture15-memory-contention-12-desc">上排四格是四种基本功各自动的东西：请求调度动顺序、数据映射动空间、源限流动速率、线程调度动邻居。下面两条是这一讲的收束：四者动的是四样不同的东西，所以组合起来最强；而同一个线程可能同时被四者盯上，所以它们也会打架。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="263.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">四种工具各自动什么</text>
  <rect x="25" y="64" width="158.75" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104.375" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">请求调度</text>
  <text x="104.375" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">动的是顺序</text>
  <rect x="208.75" y="64" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="288.125" y="84.35" font-size="11" fill="#166534" text-anchor="middle">数据映射</text>
  <text x="288.125" y="100.85" font-size="11" fill="#166534" text-anchor="middle">动的是空间</text>
  <rect x="392.5" y="64" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="471.875" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">源限流</text>
  <text x="471.875" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">动的是速率</text>
  <rect x="576.25" y="64" width="158.75" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="655.625" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">线程调度</text>
  <text x="655.625" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">动的是邻居</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="163.7" font-size="12" fill="#1e40af" text-anchor="middle">四者动的是四样不同的东西，所以组合起来最强</text>
  <rect x="25" y="205.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="225.85" font-size="11" fill="#1e293b" text-anchor="middle">而同一个线程可能同时被四者盯上，所以它们也会打架</text>
</svg>
