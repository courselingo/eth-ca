<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314"
     role="img" aria-labelledby="fig-lecture15-memory-contention-2-title fig-lecture15-memory-contention-2-desc">
  <title id="fig-lecture15-memory-contention-2-title">争用点很多，而聪明资源会互相矛盾</title>
  <desc id="fig-lecture15-memory-contention-2-desc">上排四格是共享资源链上的争用点：核、共享缓存、内存控制器、DRAM 存储体。下面三条分别是：每一个都可能是争用点，线程到达控制器之前已经在缓存与互连上互相干扰过；聪明资源的问题，也就是缓存、互连、内存的干扰控制机制各自独立设计、可能互相矛盾；以及想显式协调它们实现起来又很复杂。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="314" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">争用点很多，而聪明资源会互相矛盾</text>
  <rect x="25" y="64" width="158.75" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104.375" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">核</text>
  <rect x="208.75" y="64" width="158.75" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="288.125" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">共享缓存</text>
  <rect x="392.5" y="64" width="158.75" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="471.875" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">内存控制器</text>
  <rect x="576.25" y="64" width="158.75" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="655.625" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">DRAM 存储体</text>
  <rect x="25" y="125" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="147.2" font-size="12" fill="#1e40af" text-anchor="middle">每一个都可能是争用点：线程到达控制器之前，已经在缓存与互连上互相干扰过（p148）</text>
  <rect x="25" y="189" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="211.2" font-size="12" fill="#b45309" text-anchor="middle">聪明资源的问题：缓存、互连、内存的干扰控制机制各自独立设计，可能互相矛盾（p149）</text>
  <rect x="25" y="253" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="275.2" font-size="12" fill="#b45309" text-anchor="middle">而想显式协调它们，实现起来又很复杂（p149）</text>
</svg>
