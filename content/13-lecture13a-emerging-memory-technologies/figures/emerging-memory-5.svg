<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-5-title fig-emerging-memory-5-desc">
  <title id="fig-emerging-memory-5-title">但底下是一堆不一样的设备</title>
  <desc id="fig-emerging-memory-5-desc">持久内存对外给出一整片持久地址空间，可它可能由很多种设备拼成：从又快又小的易失内存，到又慢又大的硬盘或闪存，中间还夹着各种非易失内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">但底下是一堆不一样的设备</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一片地址空间，底下是异构的一串设备</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">好放的时候</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">扬长避短，性能与能耗都受益</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">要看的性质</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">局部性，以及数据要不要持久</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">所以统一接口并没有消掉异构，只是把它藏到了接口后面</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而「把哪份数据放在哪种设备上」就成了一个新的问题</text>
</svg>
