<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-4-title fig-emerging-memory-4-desc">
  <title id="fig-emerging-memory-4-title">一个统一的接口要管什么</title>
  <desc id="fig-emerging-memory-4-desc">讲义这一步的价值在于它把「合层」落到一个具体的东西上：给程序一个统一的接口，让它用普通的读写指令就能访问持久数据，而不必区分易失与持久。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个统一的接口要管什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">统一接口：用普通读写访问持久数据</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">过去</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">程序要自己区分易失与持久</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">目标</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一个指针就能指到持久数据</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一步把「合层」从口号变成了一个可以实现的抽象</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而抽象一旦立起来，下面的设备就可以是多种多样的</text>
</svg>
