<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-9-title fig-emerging-memory-9-desc">
  <title id="fig-emerging-memory-9-title">现有的解法与它们的代价</title>
  <desc id="fig-emerging-memory-9-desc">讲义把当时的解法归为「显式接口」这一类：程序员用原子块把一段更新包起来，系统保证这段要么都生效要么都不生效。它的代价是必须改写代码。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">现有的解法与它们的代价</text>
  <rect x="25" y="70" width="712" height="42" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="381.0" y="95.9" font-size="14" fill="#b45309" text-anchor="middle">显式接口：用原子块圈出更新</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">拿到什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一段更新要么都生效要么都不生效</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">付出什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">要改写代码，还要自己划清易失与持久</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义说这一类做法限制了非易失内存的普及</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">因为它把负担压在了程序员身上，而改写存量代码的成本很高</text>
</svg>
