<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-7-title fig-emerging-memory-7-desc">
  <title id="fig-emerging-memory-7-title">第一件已经落地的事：持久内存产品</title>
  <desc id="fig-emerging-memory-7-desc">讲义举了 2019 年的两件真实产品：一件是非易失的主存模块，基于三维交叉点技术；另一件是把处理器放进内存条里的处理在内存引擎。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第一件已经落地的事：持久内存产品</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">两件 2019 年的真实产品</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">非易失主存</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">基于三维交叉点技术</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">处理在内存引擎</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">内存条上带一批小处理器</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">后者按讲义的描述是标准内存条形态，单条 8GB 配 128 个处理器</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">[[term:processing in memory]] 从概念走到了可以买到的硬件</text>
</svg>
