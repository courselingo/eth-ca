<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-10-title fig-emerging-memory-10-desc">
  <title id="fig-emerging-memory-10-title">另一条路：让系统透明地做检查点</title>
  <desc id="fig-emerging-memory-10-desc">讲义的方案叫 ThyNVM：不去要求程序员改写代码，而是周期性地把状态做成检查点，崩了就从上一个检查点恢复。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">另一条路：让系统透明地做检查点</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">周期性检查点：崩了退回上一个点</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">关键想法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">周期做检查点，崩了就回退</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">要解决什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">检查点的延迟与元数据开销</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">它的做法是分多个粒度做检查点、让检查点与执行重叠、并适应两种内存的特性</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">讲义报的结果是与「零开销一致性的理想内存」相差在 4.9% 以内</text>
</svg>
