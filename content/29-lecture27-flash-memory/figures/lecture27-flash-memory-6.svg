<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415.5" width="760" height="415.5"
     role="img" aria-labelledby="fig-lecture27-flash-memory-6-title fig-lecture27-flash-memory-6-desc">
  <title id="fig-lecture27-flash-memory-6-title">两类可预测的错误：阈值电压分布与编程干扰</title>
  <desc id="fig-lecture27-flash-memory-6-desc">上排两格是两个模型：阈值电压分布可以按高斯加白噪声建模到约 95%；随擦写次数的畸变可建模为指数函数、准确率超过 95%。中间一条是分布的走向：随擦写次数增加整体右移并变宽。下面两排是编程干扰：来源是邻居电压经寄生电容耦合改变、把受害单元电压往右推；传统模型按耦合电容加权求和，既不准确又需要知道电容；物理结论是正上方邻居最强、紧邻对角第二强、更远的邻居也有影响、受害单元自己的电压起负向作用。最下面一条是新模型的精度 96.8%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="415.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两类可预测的错误：阈值电压分布与编程干扰</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">阈值电压分布</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">高斯加白噪声，准确率约 95%</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">随擦写次数的畸变</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">可建模为指数函数，准确率超过 95%</text>
  <rect x="25" y="141.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="161.85" font-size="11" fill="#1e293b" text-anchor="middle">分布随擦写次数增加会整体右移，同时变得更宽（p66）</text>
  <rect x="25" y="202.5" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="222.85" font-size="11" fill="#b45309" text-anchor="middle">编程干扰的来源</text>
  <text x="196.25" y="239.35" font-size="11" fill="#b45309" text-anchor="middle">邻居电压因寄生电容耦合改变，把受害单元电压往右推</text>
  <rect x="392.5" y="202.5" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="222.85" font-size="11" fill="#b45309" text-anchor="middle">传统模型</text>
  <text x="563.75" y="239.35" font-size="11" fill="#b45309" text-anchor="middle">按耦合电容加权求和：不准确，而且需要知道电容</text>
  <rect x="25" y="280" width="220" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="308.6" font-size="11" fill="#166534" text-anchor="middle">正上方邻居干扰最强</text>
  <rect x="270" y="280" width="220" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="308.6" font-size="11" fill="#166534" text-anchor="middle">紧邻对角第二强</text>
  <rect x="515" y="280" width="220" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="300.35" font-size="11" fill="#166534" text-anchor="middle">更远的邻居也有影响</text>
  <text x="625" y="316.85" font-size="11" fill="#166534" text-anchor="middle">受害单元自己的电压有负向影响</text>
  <rect x="25" y="357.5" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="377.85" font-size="11" fill="#6b21a8" text-anchor="middle">新模型用实测特征做线性回归，精度 96.8%（2Y 纳米芯片，用读重试特性测出）</text>
</svg>
