<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326.5" width="760" height="326.5"
     role="img" aria-labelledby="fig-lecture27-flash-memory-10-title fig-lecture27-flash-memory-10-desc">
  <title id="fig-lecture27-flash-memory-10-title">3D 闪存的三条错误特征与三个缓解机制</title>
  <desc id="fig-lecture27-flash-memory-10-desc">上排三格是三条刻画结论：层间工艺差异带来 21 倍错误率差别；编程后 3 小时错误率涨 10 倍；保持干扰与邻居状态相关，平面闪存里没有被观察到过。下面两排四格是三个机制与合计效果：层差异感知读为每层学一个偏移、每颗芯片用层数乘二字节、平均降 43%；层交错 RAID 把差层与好层编到同一组、开销低于 0.8%、最坏情况降 66.9%；保持模型感知读在线学保持损失模型、用写入与读取时间戳、用 800 KB、平均降 51.9%；合起来把寿命提升 1.85 倍或把纠错开销降低 78.9%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="326.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">3D 闪存的三条错误特征与三个缓解机制</text>
  <rect x="25" y="64" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">层间工艺差异</text>
  <text x="135" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">错误率相差 21 倍</text>
  <rect x="270" y="64" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">早期保持损失</text>
  <text x="380" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">编程后 3 小时错误率涨 10 倍</text>
  <rect x="515" y="64" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">保持干扰</text>
  <text x="625" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">与邻居状态相关，平面闪存里没见过</text>
  <rect x="25" y="141.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="161.85" font-size="11" fill="#166534" text-anchor="middle">层差异感知读</text>
  <text x="196.25" y="178.35" font-size="11" fill="#166534" text-anchor="middle">每层学一个偏移，每颗芯片层数乘 2 字节；平均降 43%</text>
  <rect x="392.5" y="141.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="161.85" font-size="11" fill="#166534" text-anchor="middle">层交错 RAID</text>
  <text x="563.75" y="178.35" font-size="11" fill="#166534" text-anchor="middle">差层与好层编一组；开销低于 0.8%；最坏情况降 66.9%</text>
  <rect x="25" y="219" width="342.5" height="82.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="239.35" font-size="11" fill="#1e40af" text-anchor="middle">保持模型感知读</text>
  <text x="196.25" y="255.85" font-size="11" fill="#1e40af" text-anchor="middle">在线学保持损失模型</text>
  <text x="196.25" y="272.35" font-size="11" fill="#1e40af" text-anchor="middle">用写入与读取时间戳，用 800 KB</text>
  <text x="196.25" y="288.85" font-size="11" fill="#1e40af" text-anchor="middle">平均降 51.9%</text>
  <rect x="392.5" y="219" width="342.5" height="82.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.75" y="255.85" font-size="11" fill="#6b21a8" text-anchor="middle">合起来</text>
  <text x="563.75" y="272.35" font-size="11" fill="#6b21a8" text-anchor="middle">寿命 1.85 倍，或纠错开销降低 78.9%</text>
</svg>
