<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368"
     role="img" aria-labelledby="fig-lecture27-flash-memory-8-title fig-lecture27-flash-memory-8-desc">
  <title id="fig-lecture27-flash-memory-8-title">读干扰：弱编程效应、通过电压调优与失败后恢复</title>
  <desc id="fig-lecture27-flash-memory-8-desc">上排两格是机制（读别的页时加的高通过电压带来弱编程效应，改掉未读页的值）与两条结论（调低通过电压能大幅减少读干扰；有些单元更容易受影响）。中间一条是取舍：纠错能力按高保持时间预留，闲置的那部分随保持时间变长而减少，于是可以把通过电压调到闲置能力允许的程度。下面一排三格是调优的三个步骤，最后一排三格是两个数字与代价：寿命提升 21%、错误数最多降 36%、512 GB 盘需要 128 KB 存储与每天 24.34 秒开销。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="368" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读干扰：弱编程效应、通过电压调优与失败后恢复</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">机制</text>
  <text x="196.25" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">读别的页时加的高通过电压带来弱编程效应，改掉未读页的值</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">两条结论</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">调低通过电压能大幅减少读干扰；有些单元更容易受影响</text>
  <rect x="25" y="141.5" width="710" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="160" font-size="10" fill="#1e40af" text-anchor="middle">取舍：纠错能力按高保持时间预留，而闲置的那部分随保持时间变长而减少；把通过电压调低到闲置能力允许的程度（p140、p141）</text>
  <rect x="25" y="199.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="219.85" font-size="11" fill="#1e40af" text-anchor="middle">步骤一</text>
  <text x="135" y="236.35" font-size="11" fill="#1e40af" text-anchor="middle">估出闲置的纠错能力</text>
  <rect x="270" y="199.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="219.85" font-size="11" fill="#1e40af" text-anchor="middle">步骤二</text>
  <text x="380" y="236.35" font-size="11" fill="#1e40af" text-anchor="middle">激进降到读错误超出能力</text>
  <rect x="515" y="199.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="219.85" font-size="11" fill="#1e40af" text-anchor="middle">步骤三</text>
  <text x="625" y="236.35" font-size="11" fill="#1e40af" text-anchor="middle">逐步加回直到刚好低于能力</text>
  <rect x="25" y="277" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="305.6" font-size="11" fill="#166534" text-anchor="middle">通过电压调优</text>
  <text x="135" y="322.1" font-size="11" fill="#166534" text-anchor="middle">寿命提升 21%</text>
  <rect x="270" y="277" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="305.6" font-size="11" fill="#166534" text-anchor="middle">恢复机制</text>
  <text x="380" y="322.1" font-size="11" fill="#166534" text-anchor="middle">错误数最多降 36%</text>
  <rect x="515" y="277" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="297.35" font-size="11" fill="#166534" text-anchor="middle">代价</text>
  <text x="625" y="313.85" font-size="11" fill="#166534" text-anchor="middle">512 GB 盘 128 KB 存储</text>
  <text x="625" y="330.35" font-size="11" fill="#166534" text-anchor="middle">每天 24.34 秒</text>
</svg>
