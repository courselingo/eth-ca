<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13 786 364" width="786" height="364"
     role="img" aria-labelledby="fig-lecture20-interconnects-8-title fig-lecture20-interconnects-8-desc">
  <title id="fig-lecture20-interconnects-8-title">多级对数网络：用多层开关换掉 O(N²)</title>
  <desc id="fig-lecture20-interconnects-8-desc">上面一格是多级对数网络的形状与代价：它是间接网络，在端点之间放多层开关，成本 O(N log N)，延迟 O(log N)，变体包括 omega、butterfly、benes 与 banyan。中间两格是电路交换与包交换的差别。下面三格是三种具体的多级网络：Delta、Omega 与 Butterfly。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13" width="786" height="364" fill="#ffffff"/>

  <text x="395" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多级对数网络：用多层开关换掉 O(N²)</text>

  <rect x="25" y="70" width="740" height="72" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="395" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">形状：间接网络，端点之间放多层开关（p34）</text>
  <text x="395" y="110.2" font-size="12" fill="#1e40af" text-anchor="middle">成本 O(N log N)，延迟 O(log N)；变体包括 omega、butterfly、benes 与 banyan</text>
  <text x="395" y="128.2" font-size="12" fill="#1e40af" text-anchor="middle">它比交叉开关限制并发收发对，但比交叉开关便宜</text>
  <rect x="25" y="167" width="340" height="72" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195" y="189.2" font-size="12" fill="#b45309" text-anchor="middle">电路交换（p36）</text>
  <text x="195" y="207.2" font-size="12" fill="#b45309" text-anchor="middle">发送前先把整条源到目的的路径配置好</text>
  <text x="195" y="225.2" font-size="12" fill="#b45309" text-anchor="middle">路径建立之后不需要缓冲</text>
  <rect x="395" y="167" width="340" height="72" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565" y="189.2" font-size="12" fill="#b45309" text-anchor="middle">包交换（p37）</text>
  <text x="565" y="207.2" font-size="12" fill="#b45309" text-anchor="middle">包在路由器之间一跳一跳地走</text>
  <text x="565" y="225.2" font-size="12" fill="#b45309" text-anchor="middle">能不能走取决于下一级开关与缓冲</text>
  <rect x="25" y="264" width="228" height="90" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="139" y="286.2" font-size="12" fill="#6b21a8" text-anchor="middle">Delta 网络</text>
  <text x="139" y="304.2" font-size="12" fill="#6b21a8" text-anchor="middle">每对源与目的之间只有一条路径</text>
  <text x="139" y="322.2" font-size="12" fill="#6b21a8" text-anchor="middle">每一级的路由器都不同</text>
  <text x="139" y="340.2" font-size="12" fill="#6b21a8" text-anchor="middle">Patel，ISCA 1979 提出替代交叉开关</text>
  <rect x="281" y="264" width="228" height="90" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395" y="286.2" font-size="12" fill="#6b21a8" text-anchor="middle">Omega 网络</text>
  <text x="395" y="304.2" font-size="12" fill="#6b21a8" text-anchor="middle">同样只有单一路径，但所有级都一样</text>
  <text x="395" y="322.2" font-size="12" fill="#6b21a8" text-anchor="middle">被用在 NYU 的 Ultracomputer 上</text>
  <text x="395" y="340.2" font-size="12" fill="#6b21a8" text-anchor="middle">Gottlieb 等，1983；还能合并操作</text>
  <rect x="537" y="264" width="228" height="90" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="651" y="286.2" font-size="12" fill="#6b21a8" text-anchor="middle">Butterfly</text>
  <text x="651" y="304.2" font-size="12" fill="#6b21a8" text-anchor="middle">与 omega 等价，也是间接网络</text>
  <text x="651" y="322.2" font-size="12" fill="#6b21a8" text-anchor="middle">被用在 BBN 的 Butterfly 上</text>
  <text x="651" y="340.2" font-size="12" fill="#6b21a8" text-anchor="middle">冲突会造成 tree saturation</text>
</svg>
