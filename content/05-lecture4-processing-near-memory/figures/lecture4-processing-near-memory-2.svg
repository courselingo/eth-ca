<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 264" width="574" height="264"
     role="img" aria-labelledby="fig-l4-2-title fig-l4-2-desc">
  <title id="fig-l4-2-title">Tesseract 的三组结果</title>
  <desc id="fig-l4-2-desc">三组并列的结果：五个图算法上相对 DDR3 乱序核加速超过 13 倍；叠加两种优化后，Tesseract-LP 再快 56%、Tesseract-LP-MTP 再快 25%；系统能量降到八分之一以下。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="574" height="264" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Tesseract 的三组结果</text>

  <rect x="23" y="64" width="528" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="287" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">五个图算法：相对 DDR3 乱序核（OoO）&gt;13 倍</text>

  <rect x="23" y="132" width="528" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="287" y="157.2" font-size="12" fill="#6b21a8" text-anchor="middle">叠加两种优化：Tesseract-LP +56% 与 Tesseract-LP-MTP +25%</text>

  <rect x="23" y="200" width="528" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="287" y="225.2" font-size="12" fill="#166534" text-anchor="middle">系统能量：降到八分之一以下</text>
</svg>
