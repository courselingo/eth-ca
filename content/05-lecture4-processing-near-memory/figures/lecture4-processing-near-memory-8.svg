<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 222" width="566" height="222"
     role="img" aria-labelledby="fig-l4-8-title fig-l4-8-desc">
  <title id="fig-l4-8-title">IMPICA 与 VBI：两个贴近程序员的问题</title>
  <desc id="fig-l4-8-desc">IMPICA 把地址翻译与访存解耦、页表放在逻辑层；VBI 用虚拟块与内存控制器里的翻译层取代每个进程一张页表。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="222" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两件更贴近程序员的工作</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">IMPICA：地址翻译与访存解耦，页表放进逻辑层</text>
  <text x="283" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">指针追踪 1.2–1.9 倍、数据库吞吐 +16%、能量 -6% 到 -41%</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#166534" text-anchor="middle">VBI：用虚拟块与内存控制器里的翻译层</text>
  <text x="283" y="186.2" font-size="12" fill="#166534" text-anchor="middle">取代「每个进程一张页表 + 操作系统管理」的老结构</text>
</svg>
