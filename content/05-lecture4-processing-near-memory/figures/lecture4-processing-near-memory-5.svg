<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 210" width="606" height="210"
     role="img" aria-labelledby="fig-l4-5-title fig-l4-5-desc">
  <title id="fig-l4-5-title">PEI 的两条设计决定与结果</title>
  <desc id="fig-l4-5-desc">每条 PIM 操作都是一条只碰一个缓存块的普通指令，执行位置由硬件动态决定；大输入集平均加速 47%、小输入集 32%、能量降低 25%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="606" height="210" fill="#ffffff"/>

  <text x="303" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">PEI：让 PIM 几乎不动系统</text>

  <rect x="23" y="64" width="240" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="143" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">决定一：像普通指令</text>
  <text x="143" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">一致、虚拟地址、只碰一个块</text>

  <rect x="291" y="64" width="240" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="411" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">决定二：动态选位置</text>
  <text x="411" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">由局部性与预测器决定</text>

  <path d="M143,123 L143,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M411,123 L411,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="560" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="303" y="171.2" font-size="12" fill="#166534" text-anchor="middle">结果：大输入平均 +47%、小输入 +32%、能量 -25%</text>
</svg>
