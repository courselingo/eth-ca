<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="650" height="140"
     role="img" aria-labelledby="fig-l4-10-title fig-l4-10-desc">
  <title id="fig-l4-10-title">四类已经从近内存计算里拿到收益的应用</title>
  <desc id="fig-l4-10-desc">基因组读段过滤、近似字符串匹配、气候模板计算与时间序列分析，都不是把通用程序搬过去，而是为内存侧算力重新设计。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="650" height="140" fill="#ffffff"/>

  <text x="325" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">四类已经在真实问题上拿到收益的应用</text>

  <rect x="23" y="64" width="130" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="88" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">GRIM-Filter</text>
  <text x="88" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">基因组过滤</text>

  <rect x="181" y="64" width="130" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="246" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">GenASM</text>
  <text x="246" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">近似匹配</text>

  <rect x="339" y="64" width="130" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="404" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">NERO</text>
  <text x="404" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">气候模板</text>

  <rect x="497" y="64" width="130" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="562" y="86.2" font-size="12" fill="#166534" text-anchor="middle">NATSA</text>
  <text x="562" y="104.2" font-size="12" fill="#166534" text-anchor="middle">时间序列</text>
</svg>
