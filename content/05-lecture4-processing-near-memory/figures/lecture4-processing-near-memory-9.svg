<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 140" width="658" height="140"
     role="img" aria-labelledby="fig-l4-9-title fig-l4-9-desc">
  <title id="fig-l4-9-title">五件公开的仿真与实验基础设施</title>
  <desc id="fig-l4-9-desc">DAMOV 选负载、Ramulator 支持 PIM 仿真、NAPEL 预测性能、SoftMC 在真芯片上做实验、MQSim 把研究推到 SSD。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="658" height="140" fill="#ffffff"/>

  <text x="329" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五件公开的基础设施</text>

  <rect x="23" y="64" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="73" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">DAMOV</text>
  <text x="73" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">选负载</text>

  <rect x="151" y="64" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="201" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">Ramulator</text>
  <text x="201" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">加 PIM 仿真</text>

  <rect x="279" y="64" width="100" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="329" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">NAPEL</text>
  <text x="329" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">预测性能</text>

  <rect x="407" y="64" width="100" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="457" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">SoftMC</text>
  <text x="457" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">真芯片实验</text>

  <rect x="535" y="64" width="100" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="585" y="86.2" font-size="12" fill="#166534" text-anchor="middle">MQSim</text>
  <text x="585" y="104.2" font-size="12" fill="#166534" text-anchor="middle">推到 SSD</text>
</svg>
