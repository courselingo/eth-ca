<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 167" width="612" height="167"
     role="img" aria-labelledby="fig-l4-4-title fig-l4-4-desc">
  <title id="fig-l4-4-title">指针追踪是一条串行的依赖链</title>
  <desc id="fig-l4-4-desc">每一次取数都要用上一次的结果算出地址，线程再多也藏不住这条串行的等待。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="167" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">指针追踪：线程再多也藏不住这条链</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">取节点 A</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">算出 B 的地址</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">取节点 B</text>
  <text x="306" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">算出 C 的地址</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">取节点 C</text>
  <text x="504" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">还得等 C 回来</text>

  <path d="M198,91 L210,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M396,91 L408,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="306" y="142" font-size="12" fill="#64748b" text-anchor="middle">收益不来自带宽，而来自把串行等待搬到离数据更近的地方</text>
</svg>
