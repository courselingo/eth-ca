<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 653 234" width="653" height="234"
     role="img" aria-labelledby="fig-l4-7-title fig-l4-7-desc">
  <title id="fig-l4-7-title">SynCron 的开销与理想零开销同步只差一点点</title>
  <desc id="fig-l4-7-desc">横条统一按占理想零开销同步的百分比画：上行理想是 100% 参照，SynCron 的性能开销只占它的 9.5%、能量开销只占 6.2%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="653" height="234" fill="#ffffff"/>

  <text x="390" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">SynCron：同步可以几乎不花钱</text>

  <text x="23" y="79.2" font-size="12" fill="#1e293b" text-anchor="start">理想零开销（参照）</text>
  <rect x="190" y="64" width="400" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="602" y="79.2" font-size="12" fill="#64748b" text-anchor="start">100%</text>

  <text x="23" y="127.2" font-size="12" fill="#1e293b" text-anchor="start">SynCron 性能开销</text>
  <rect x="190" y="112" width="38" height="22" rx="4" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="127.2" font-size="12" fill="#64748b" text-anchor="start">9.5%</text>

  <text x="23" y="175.2" font-size="12" fill="#1e293b" text-anchor="start">SynCron 能量开销</text>
  <rect x="190" y="160" width="25" height="22" rx="4" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="227" y="175.2" font-size="12" fill="#64748b" text-anchor="start">6.2%</text>

  <text x="23" y="209" font-size="11" fill="#64748b" text-anchor="start">横条＝该项相对理想零开销同步的百分比：上行的 100% 是参照，下面两条是开销占比，越短越好</text>
</svg>
