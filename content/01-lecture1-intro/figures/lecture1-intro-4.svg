<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 304" width="574" height="304"
     role="img" aria-labelledby="fig-l1-4-title fig-l1-4-desc">
  <title id="fig-l1-4-title">只优化一层时，损失落在层与层之间</title>
  <desc id="fig-l1-4-desc">上层与下层各自按自己的方便做选择，中间那段损失没有人认领；跨层取同一种假设才能消掉它。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="304" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">只优化一层，损失无人认领</text>

  <rect x="23" y="64" width="250" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="148" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">上层决定数据怎么排</text>
  <text x="148" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">按自己的方便来</text>

  <rect x="301" y="64" width="250" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="426" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">下层决定数据怎么取</text>
  <text x="426" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">也按自己的方便来</text>

  <path d="M148,123 L148,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,123 L426,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="528" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="287" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle">中间那段损失没有任何一层认领</text>
  <text x="287" y="186.2" font-size="12" fill="#9d174d" text-anchor="middle">它只出现在最终的时间与能量账单上</text>

  <path d="M148,205 L148,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,205 L426,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="228" width="250" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="148" y="250.2" font-size="12" fill="#166534" text-anchor="middle">跨层一起看：口径一致</text>
  <text x="148" y="268.2" font-size="12" fill="#166534" text-anchor="middle">上下对同一件事同一种假设</text>

  <rect x="301" y="228" width="250" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="426" y="250.2" font-size="12" fill="#166534" text-anchor="middle">损失被认领</text>
  <text x="426" y="268.2" font-size="12" fill="#166534" text-anchor="middle">才有可能被消掉</text>
</svg>
