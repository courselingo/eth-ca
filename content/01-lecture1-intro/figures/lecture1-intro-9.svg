<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 304" width="574" height="304"
     role="img" aria-labelledby="fig-l1-9-title fig-l1-9-desc">
  <title id="fig-l1-9-title">先例与原则的区别</title>
  <desc id="fig-l1-9-desc">照抄先例只能解释这一代机器，理解原则才能推出新设计，而判据本身要先写清楚。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="304" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">学的是原则，而不是先例</text>

  <rect x="23" y="64" width="250" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="148" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">先例：这一代机器这么做</text>
  <text x="148" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">换个平台就不灵</text>

  <rect x="301" y="64" width="250" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="426" y="86.2" font-size="12" fill="#166534" text-anchor="middle">原则：跨平台成立的规律</text>
  <text x="426" y="104.2" font-size="12" fill="#166534" text-anchor="middle">能推出新做法</text>

  <path d="M148,123 L148,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,123 L426,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="250" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="148" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle">背下做法：这一代能用</text>
  <text x="148" y="186.2" font-size="12" fill="#9d174d" text-anchor="middle">下一代就过期</text>

  <rect x="301" y="146" width="250" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="426" y="168.2" font-size="12" fill="#166534" text-anchor="middle">理解原因：知道为什么</text>
  <text x="426" y="186.2" font-size="12" fill="#166534" text-anchor="middle">才推得出新设计</text>

  <path d="M148,205 L148,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,205 L426,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="228" width="528" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="287" y="250.2" font-size="12" fill="#b45309" text-anchor="middle">判据先写清：功能、可靠性、成本、可扩展性</text>
  <text x="287" y="268.2" font-size="12" fill="#b45309" text-anchor="middle">再加舒适度与美观，然后才有好坏可言</text>
</svg>
