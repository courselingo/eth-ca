<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 167" width="716" height="167"
     role="img" aria-labelledby="fig-l1-1-title fig-l1-1-desc">
  <title id="fig-l1-1-title">从问题到电子之间的五层转换</title>
  <desc id="fig-l1-1-desc">问题、算法、程序语言、ISA、微架构依次排开，每一层只看得见自己那一格，损失落在层与层之间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="716" height="167" fill="#ffffff"/>

  <text x="358" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从问题到电子：中间隔着五层转换</text>

  <rect x="23" y="64" width="110" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="78" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">问题</text>
  <text x="78" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">要算什么</text>

  <rect x="163" y="64" width="110" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="218" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">算法</text>
  <text x="218" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">怎么算</text>

  <rect x="303" y="64" width="110" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="358" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">程序/语言</text>
  <text x="358" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">写成代码</text>

  <rect x="443" y="64" width="110" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="498" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">ISA</text>
  <text x="498" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">软硬件契约</text>

  <rect x="583" y="64" width="110" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="638" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">微架构</text>
  <text x="638" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">怎么实现</text>

  <path d="M138,91 L152,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M278,91 L292,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M418,91 L432,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M558,91 L572,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="358" y="142" font-size="12" fill="#64748b" text-anchor="middle">每一层只看得见自己那一格，损失落在层与层之间</text>
</svg>
