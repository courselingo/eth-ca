<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 167" width="882" height="167"
     role="img" aria-labelledby="fig-l1-1-title fig-l1-1-desc">
  <title id="fig-l1-1-title">从问题到电子之间的七层转换</title>
  <desc id="fig-l1-1-desc">按源讲义转换层次图：问题、算法、程序语言、系统软件与运行时、ISA、微架构、逻辑电路、器件与电子共八格，七段箭头就是七次转换。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="882" height="167" fill="#ffffff"/>

  <text x="441" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从问题到电子：中间隔着七层转换</text>

  <rect x="23" y="64" width="80" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="63" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">问题</text>
  <text x="63" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">要算什么</text>

  <rect x="131" y="64" width="80" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="171" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">算法</text>
  <text x="171" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">怎么算</text>

  <rect x="239" y="64" width="80" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="279" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">程序/语言</text>
  <text x="279" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">写成代码</text>

  <rect x="347" y="64" width="80" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="387" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">系统软件</text>
  <text x="387" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">运行时</text>

  <rect x="455" y="64" width="80" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="495" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">ISA</text>
  <text x="495" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">软硬件契约</text>

  <rect x="563" y="64" width="80" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="603" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">微架构</text>
  <text x="603" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">怎么实现</text>

  <rect x="671" y="64" width="80" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="711" y="86.2" font-size="12" fill="#166534" text-anchor="middle">逻辑电路</text>
  <text x="711" y="104.2" font-size="12" fill="#166534" text-anchor="middle">门与线</text>

  <rect x="779" y="64" width="80" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="819" y="86.2" font-size="12" fill="#166534" text-anchor="middle">器件与电子</text>
  <text x="819" y="104.2" font-size="12" fill="#166534" text-anchor="middle">电荷在动</text>

  <path d="M108,91 L120,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M216,91 L228,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M324,91 L336,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M432,91 L444,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540,91 L552,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M648,91 L660,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M756,91 L768,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="441" y="142" font-size="12" fill="#64748b" text-anchor="middle">每一层只看得见自己那一格，损失落在层与层之间</text>
</svg>
