<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 167" width="856" height="167"
     role="img" aria-labelledby="fig-l1-1-title fig-l1-1-desc">
  <title id="fig-l1-1-title">从问题到电子之间的六层转换</title>
  <desc id="fig-l1-1-desc">问题、算法、程序语言、ISA、微架构、逻辑电路、器件与电子依次排开，六段箭头就是六次转换，每一层只看得见自己那一格。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="856" height="167" fill="#ffffff"/>

  <text x="428" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从问题到电子：中间隔着六层转换</text>

  <rect x="23" y="64" width="90" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">问题</text>
  <text x="68" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">要算什么</text>

  <rect x="143" y="64" width="90" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="188" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">算法</text>
  <text x="188" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">怎么算</text>

  <rect x="263" y="64" width="90" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="308" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">程序/语言</text>
  <text x="308" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">写成代码</text>

  <rect x="383" y="64" width="90" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="428" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">ISA</text>
  <text x="428" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">软硬件契约</text>

  <rect x="503" y="64" width="90" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="548" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">微架构</text>
  <text x="548" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">怎么实现</text>

  <rect x="623" y="64" width="90" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="668" y="86.2" font-size="12" fill="#166534" text-anchor="middle">逻辑电路</text>
  <text x="668" y="104.2" font-size="12" fill="#166534" text-anchor="middle">门与线</text>

  <rect x="743" y="64" width="90" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="788" y="86.2" font-size="12" fill="#166534" text-anchor="middle">器件与电子</text>
  <text x="788" y="104.2" font-size="12" fill="#166534" text-anchor="middle">电荷在动</text>

  <path d="M118,91 L132,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M238,91 L252,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M358,91 L372,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M478,91 L492,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M598,91 L612,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M718,91 L732,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="428" y="142" font-size="12" fill="#64748b" text-anchor="middle">每一层只看得见自己那一格，损失落在层与层之间</text>
</svg>
