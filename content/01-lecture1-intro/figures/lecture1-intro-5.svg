<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 206" width="730" height="206"
     role="img" aria-labelledby="fig-l1-5-title fig-l1-5-desc">
  <title id="fig-l1-5-title">四个平台，四种目标函数</title>
  <desc id="fig-l1-5-desc">手机、自动驾驶、数据中心与基因测序追求的目标各不相同，同一份设计在这四个平台上未必都是优化。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="730" height="206" fill="#ffffff"/>

  <text x="365" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同样是计算平台，目标函数完全不同</text>

  <rect x="23" y="64" width="150" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="98" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">手机</text>

  <rect x="201" y="64" width="150" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="276" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">自动驾驶</text>

  <rect x="379" y="64" width="150" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="454" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">数据中心</text>

  <rect x="557" y="64" width="150" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="632" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">基因测序</text>

  <path d="M98,111 L98,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M276,111 L276,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M454,111 L454,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M632,111 L632,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="150" height="50" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="98" y="154.6" font-size="11" fill="#166534" text-anchor="middle">电池撑一天</text>
  <text x="98" y="171.1" font-size="11" fill="#166534" text-anchor="middle">成本要低</text>

  <rect x="201" y="134" width="150" height="50" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="276" y="154.6" font-size="11" fill="#166534" text-anchor="middle">延迟足够低</text>
  <text x="276" y="171.1" font-size="11" fill="#166534" text-anchor="middle">两颗芯片冗余</text>

  <rect x="379" y="134" width="150" height="50" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="454" y="154.6" font-size="11" fill="#166534" text-anchor="middle">每块钱的吞吐</text>
  <text x="454" y="171.1" font-size="11" fill="#166534" text-anchor="middle">还要省电</text>

  <rect x="557" y="134" width="150" height="50" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="632" y="154.6" font-size="11" fill="#166534" text-anchor="middle">一个算法</text>
  <text x="632" y="171.1" font-size="11" fill="#166534" text-anchor="middle">做到极低能耗</text>
</svg>
