<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 292" width="606" height="292"
     role="img" aria-labelledby="fig-l1-2-title fig-l1-2-desc">
  <title id="fig-l1-2-title">ISA 是契约，微架构是实现</title>
  <desc id="fig-l1-2-desc">软件只通过 ISA 与硬件打交道，硬件只要满足这份契约，实现方式可以自由更换。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="606" height="292" fill="#ffffff"/>

  <text x="303" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">ISA 是契约，微架构是实现</text>

  <rect x="23" y="64" width="560" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="303" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">软件这一侧：算法、程序、语言</text>
  <text x="303" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">它只通过 ISA 跟硬件打交道</text>

  <path d="M289,123 L289,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M317,141 L317,129" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M289,193 L289,205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M317,211 L317,199" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="560" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="303" y="171.2" font-size="12" fill="#b45309" text-anchor="middle">ISA：有哪些指令、几个寄存器，怎么寻址</text>

  <rect x="23" y="216" width="560" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="303" y="238.2" font-size="12" fill="#1e40af" text-anchor="middle">硬件这一侧：微架构、逻辑电路、器件</text>
  <text x="303" y="256.2" font-size="12" fill="#1e40af" text-anchor="middle">接口不变，实现可以随便换</text>
</svg>
