<svg xmlns="http://www.w3.org/2000/svg" viewBox="87 0 596 350" width="596" height="350"
     role="img" aria-labelledby="fig-l1-11-title fig-l1-11-desc">
  <title id="fig-l1-11-title">刷新在器件层必需，代价由系统付</title>
  <desc id="fig-l1-11-desc">从核到共享缓存、内存控制器再到 DRAM 颗粒，器件层必须做的刷新占了 DRAM 能量的 15% 到 47%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="87" y="0" width="596" height="350" fill="#ffffff"/>

  <text x="385" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">刷新是器件层的必需，代价是系统级的</text>

  <rect x="110" y="64" width="260" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">核 0 与核 1：各自算</text>

  <path d="M240,111 L240,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="134" width="260" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="159.2" font-size="12" fill="#1e40af" text-anchor="middle">共享三级缓存</text>

  <path d="M240,181 L240,193" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="204" width="260" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="229.2" font-size="12" fill="#1e40af" text-anchor="middle">内存控制器</text>

  <path d="M240,251 L240,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="274" width="260" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="296.2" font-size="12" fill="#b45309" text-anchor="middle">DRAM 颗粒：电容会漏电</text>
  <text x="240" y="314.2" font-size="12" fill="#b45309" text-anchor="middle">必须定期读出再写回</text>

  <rect x="400" y="274" width="260" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="530" y="296.2" font-size="12" fill="#9d174d" text-anchor="middle">刷新占 DRAM 能量</text>
  <text x="530" y="314.2" font-size="12" fill="#9d174d" text-anchor="middle">15% 到 47%</text>
</svg>
