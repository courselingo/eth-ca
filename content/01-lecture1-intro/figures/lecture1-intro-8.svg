<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 308" width="418" height="308"
     role="img" aria-labelledby="fig-l1-8-title fig-l1-8-desc">
  <title id="fig-l1-8-title">内存内计算的两条路</title>
  <desc id="fig-l1-8-desc">路一把计算单元搬到内存芯片里，路二直接用内存阵列本身做运算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="418" height="308" fill="#ffffff"/>

  <text x="209" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">内存内计算的两条路</text>

  <rect x="23" y="56" width="372" height="101" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="33" y="70" font-size="11" fill="#64748b" text-anchor="start">路一：把计算搬到内存旁边</text>

  <rect x="40" y="86" width="140" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="108.2" font-size="12" fill="#1e40af" text-anchor="middle">CPU</text>
  <text x="110" y="126.2" font-size="12" fill="#1e40af" text-anchor="middle">要算数据</text>

  <path d="M185,113 L197,113" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="208" y="86" width="170" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="293" y="108.2" font-size="12" fill="#166534" text-anchor="middle">内存芯片</text>
  <text x="293" y="126.2" font-size="12" fill="#166534" text-anchor="middle">计算单元就在它里面</text>

  <rect x="23" y="185" width="372" height="101" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="33" y="199" font-size="11" fill="#64748b" text-anchor="start">路二：直接用内存阵列来算</text>

  <rect x="40" y="215" width="140" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="237.2" font-size="12" fill="#1e40af" text-anchor="middle">CPU</text>
  <text x="110" y="255.2" font-size="12" fill="#1e40af" text-anchor="middle">要算数据</text>

  <path d="M185,242 L197,242" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="208" y="215" width="170" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="293" y="237.2" font-size="12" fill="#6b21a8" text-anchor="middle">内存阵列</text>
  <text x="293" y="255.2" font-size="12" fill="#6b21a8" text-anchor="middle">阵列自己就能算</text>
</svg>
