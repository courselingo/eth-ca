<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 0 449 268" width="449" height="268"
     role="img" aria-labelledby="fig-l1-10-title fig-l1-10-desc">
  <title id="fig-l1-10-title">抽象挡住下面，出问题时必须跨过界面</title>
  <desc id="fig-l1-10-desc">代码、ISA 与晶体管之间隔着抽象，平时不必知道底下发生了什么，出问题时却必须跨过界面去看。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="32" y="0" width="449" height="268" fill="#ffffff"/>

  <text x="192.75" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">抽象让你看不见底下</text>

  <rect x="110" y="64" width="220" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">程序里的一行代码</text>

  <path d="M220,111 L220,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="134" width="220" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="220" y="159.2" font-size="12" fill="#6b21a8" text-anchor="middle">ISA：有哪些指令</text>

  <path d="M220,181 L220,193" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="204" width="220" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="229.2" font-size="12" fill="#b45309" text-anchor="middle">微架构里的晶体管</text>

  <path d="M105,225 C 40,215 40,95 99,82" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="350" y="155" font-size="12" fill="#1e293b" text-anchor="start">出问题时要跨过界面</text>
</svg>
