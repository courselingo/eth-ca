<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-12-title fig-simd-gpu-12-desc">
  <title id="fig-simd-gpu-12-title">warp：让两者对上的那个东西</title>
  <desc id="fig-simd-gpu-12-desc">一组执行同一条指令、但数据不同的线程被动态地编成一个 warp，硬件就把它们当成一条 SIMD 指令来跑。而 warp 之间用细粒度多线程轮换，一个周期换一个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">warp：让两者对上的那个东西</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">warp 是「一束线程」，硬件把它当一条 SIMD 指令</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">warp 里</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">所有线程跑同一条指令，数据不同</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">warp 之间</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">细粒度多线程轮换，掩盖延迟</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">细粒度多线程的规则很干脆：让同一个线程的两条指令不同时在流水线里</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是不需要依赖检查，也不需要分支预测逻辑，代价是多份线程上下文</text>
</svg>
