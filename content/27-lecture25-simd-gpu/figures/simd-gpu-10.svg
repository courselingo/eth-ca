<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-10-title fig-simd-gpu-10-desc">
  <title id="fig-simd-gpu-10-title">而现代处理器把它做成了指令集里的一小块</title>
  <desc id="fig-simd-gpu-10-desc">向量机器后来没有留在通用处理器里，而它的一部分想法以另一副面孔回来了：指令集里的单指令多数据扩展。一条指令同时对若干份较短的数据做同一个运算。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而现代处理器把它做成了指令集里的一小块</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">SIMD 扩展：一条指令对几份短数据做同一个运算</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它借用了什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一条指令做多份活这个基本想法</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">它丢掉了什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">整台机器为向量而设计这件事</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">常见用途是图形，讲义举的是把四份八位数据一起相加</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">为了让八位之间不进位，运算单元本身要改</text>
</svg>
