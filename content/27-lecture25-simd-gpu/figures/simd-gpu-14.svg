<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-14-title fig-simd-gpu-14-desc">
  <title id="fig-simd-gpu-14-title">代价是控制流分歧，而它其实是老问题换了个名字</title>
  <desc id="fig-simd-gpu-14-desc">一个 warp 里的线程如果分支到不同的路径，SIMD 流水线就没法一次都做完，只能把路径一条条地走。讲义提醒读者：这与前面的条件执行是同一件事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">代价是控制流分歧，而它其实是老问题换了个名字</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">warp 内部分支到不同路径，只能一条条走</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">它叫什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">分支分歧；一个 warp 里的路径串行化</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">而它其实就是</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">前面那个掩码执行，同一个问题的另一种形态</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义专门跨了十几页把这两件事指认为同一件</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">认出来之后，向量机器那边积累的办法就可以搬过来用</text>
</svg>
