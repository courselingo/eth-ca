<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-6-title fig-simd-gpu-6-desc">
  <title id="fig-simd-gpu-6-title">它的好处，来自「向量内部没有依赖」</title>
  <desc id="fig-simd-gpu-6-desc">讲义把优势归到一条根上：向量内部的元素之间没有依赖，所以可以做得非常深、非常宽，而不会付深流水线通常要付的代价。另外每条指令本身产生很多工作，取指与控制开销被摊薄。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它的好处，来自「向量内部没有依赖」</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">向量内部无依赖，所以深流水线不必付代价</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">拿到什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">流水线可以很深，控制逻辑还很简单</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">还有一笔</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">取指与控制开销被很多份数据摊薄</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「摊薄」这一条解释了它为什么能耗效率好</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">一条指令做很多份活，那么为一条指令付出的固定成本就被摊到很多份上</text>
</svg>
