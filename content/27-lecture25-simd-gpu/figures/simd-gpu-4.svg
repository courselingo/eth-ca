<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-4-title fig-simd-gpu-4-desc">
  <title id="fig-simd-gpu-4-title">两种做法：用空间，还是用时间</title>
  <desc id="fig-simd-gpu-4-desc">讲义给了一个很好用的对偶。阵列处理器用不同的执行单元在同一时刻处理不同元素，也就是用空间；向量处理器用同一个执行单元在连续的时刻处理不同元素，也就是用时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种做法：用空间，还是用时间</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一件事，用空间做还是用时间做</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">阵列处理器</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">多个单元同一时刻，各做一份</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">向量处理器</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一个单元连续几个时刻，各做一份</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个对偶的价值在于它说明两件事可以互相替代</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是同一套数据并行的想法可以落在很不一样的硬件上</text>
</svg>
