<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-7-title fig-simd-gpu-7-desc">
  <title id="fig-simd-gpu-7-title">它的代价有两条，而且很硬</title>
  <desc id="fig-simd-gpu-7-desc">第一条是它只对规则的并行有效：如果并行是不规则的（讲义举的是在链表里找一个关键字），向量操作会非常低效。第二条是访存带宽很容易成为瓶颈。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它的代价有两条，而且很硬</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">只对规则并行有效，而且带宽容易卡住</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">第一条</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">并行不规则的代码用不上它</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">第二条</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">计算与访存不匹配、或者数据没摆对</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第二条那两个原因都指向同一件事：数据怎么摆</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以向量机器的大量篇幅用在了存储体与地址映射上</text>
</svg>
