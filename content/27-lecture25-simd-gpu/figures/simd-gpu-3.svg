<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-3-title fig-simd-gpu-3-desc">
  <title id="fig-simd-gpu-3-title">先把四种机器摆开</title>
  <desc id="fig-simd-gpu-3-desc">讲义用了那套经典分类：一条指令一份数据、一条指令多份数据、多条指令一份数据、以及多条指令多份数据。而这一讲关心的那一格，里面又可以分成阵列处理器与向量处理器两种。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">先把四种机器摆开</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">四种机器，以及其中那一格里的两种</text>
  <rect x="25" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="137.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">一条对一份</text>
  <text x="137.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">最普通的顺序机器</text>
  <rect x="278" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="390.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">一条对多份</text>
  <text x="390.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">阵列与向量处理器</text>
  <rect x="531" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="643.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">多条对一份</text>
  <text x="643.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">最接近的是脉动阵列</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第三格很少见，但讲义指出它有一个具体的近似物</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">把分类法当真去问「哪些格是空的」，本身就能发现问题</text>
</svg>
