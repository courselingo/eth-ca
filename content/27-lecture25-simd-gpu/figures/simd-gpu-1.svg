<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-1-title fig-simd-gpu-1-desc">
  <title id="fig-simd-gpu-1-title">起点：同一件活，作用在很多份数据上</title>
  <desc id="fig-simd-gpu-1-desc">讲义把这类并行叫数据并行：并发来自「对不同的数据做同一个操作」。它举的例子是两个向量的点积，并把它与另外两类并行区分开。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">起点：同一件活，作用在很多份数据上</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">数据并行：同一个操作，很多份数据</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">对照数据流</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">并发来自不同的操作同时做</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">对照线程并行</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">并发来自不同的控制流同时跑</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">三种并行的来源不同，所以它们适合的机器也不同</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲讲的是第一种所对应的机器</text>
</svg>
