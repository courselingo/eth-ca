<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-8-title fig-simd-gpu-8-desc">
  <title id="fig-simd-gpu-8-title">为什么「数据怎么摆」这么要紧：存储体</title>
  <desc id="fig-simd-gpu-8-desc">内存被分成若干可以独立访问的存储体，它们共用地址与数据总线以省引脚。一个周期可以启动并完成一次访问，所以只要若干次访问落在不同存储体上，就能同时进行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么「数据怎么摆」这么要紧：存储体</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">多个存储体，共用总线，各能独立访问</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">向量访存怎么算地址</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">后一个地址等于前一个加步长</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">什么时候能满速</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">步长为一、且元素交错分布、且存储体够多</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">三个条件缺一不可，而第二个是这里最容易出事的地方</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">如果步长与存储体数不互质，访问就会成串地撞在同一个体上</text>
</svg>
