<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-simd-gpu-5-title fig-simd-gpu-5-desc">
  <title id="fig-simd-gpu-5-title">向量处理器长什么样：向量寄存器加深流水线</title>
  <desc id="fig-simd-gpu-5-desc">它需要能装下向量的寄存器，以及一组控制寄存器（长度、步长、掩码）。而运算单元走深流水线，每个流水级处理一个不同的元素。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">向量处理器长什么样：向量寄存器加深流水线</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">向量寄存器、三个控制寄存器、深流水线</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">数据寄存器</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每个装若干份数据，不是一份</text>
  <rect x="393" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">控制寄存器</text>
  <text x="563.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">长度、步长、掩码</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">掩码那一个值得先记住，它后面会以另一个名字再出现一次</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">深流水线是它的常态，而不是它的优化</text>
</svg>
