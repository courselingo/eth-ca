<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 167" width="612" height="167"
     role="img" aria-labelledby="fig-l2b-1-title fig-l2b-1-desc">
  <title id="fig-l2b-1-title">课程目标的三块：懂原理、会实现、能取舍</title>
  <desc id="fig-l2b-1-desc">课程的两条目标合起来要求三件事：懂原理、亲手实现一个模拟器、在多个设计之间做取舍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="612" height="167" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">课程目标落在三件事上</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">懂原理</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">为什么这样设计</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">会实现</text>
  <text x="306" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">亲手写一个模拟器</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#166534" text-anchor="middle">能取舍</text>
  <text x="504" y="104.2" font-size="12" fill="#166534" text-anchor="middle">在两个方案间选</text>

  <text x="306" y="142" font-size="12" fill="#64748b" text-anchor="middle">只会原理做不出东西，只会实现说不清为什么</text>
</svg>
