<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 234" width="646" height="234"
     role="img" aria-labelledby="fig-l2b-3-title fig-l2b-3-desc">
  <title id="fig-l2b-3-title">评估权重：Lab 50%、期末 30%、作业 20%</title>
  <desc id="fig-l2b-3-desc">横条按百分比直接画：动手的 Lab 占一半，期末笔试占三成，平时作业占两成，合计 100%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="646" height="234" fill="#ffffff"/>

  <text x="390" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">评估：Lab 50%、期末 30%、作业 20%</text>

  <text x="23" y="79.2" font-size="12" fill="#1e293b" text-anchor="start">动手的 Lab</text>
  <rect x="190" y="64" width="400" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="602" y="79.2" font-size="12" fill="#64748b" text-anchor="start">50%</text>

  <text x="23" y="127.2" font-size="12" fill="#1e293b" text-anchor="start">期末笔试 180 分钟</text>
  <rect x="190" y="112" width="240" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="442" y="127.2" font-size="12" fill="#64748b" text-anchor="start">30%</text>

  <text x="23" y="175.2" font-size="12" fill="#1e293b" text-anchor="start">平时作业</text>
  <rect x="190" y="160" width="160" height="22" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="362" y="175.2" font-size="12" fill="#64748b" text-anchor="start">20%</text>

  <text x="23" y="209" font-size="11" fill="#64748b" text-anchor="start">2022 年秋季学期的比例；三段合计 100%，另有额外加分机会</text>
</svg>
