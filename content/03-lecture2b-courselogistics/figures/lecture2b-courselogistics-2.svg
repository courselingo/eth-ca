<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 167" width="612" height="167"
     role="img" aria-labelledby="fig-l2b-2-title fig-l2b-2-desc">
  <title id="fig-l2b-2-title">懂硬件的软件人与懂软件的硬件人都通向更好的系统</title>
  <desc id="fig-l2b-2-desc">两侧的人各自从一边进入，箭头都指向中间那格：两边都懂才能设计出更好的计算系统。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="612" height="167" fill="#ffffff"/>

  <text x="306" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">硬件和软件，缺一边都不够</text>

  <rect x="23" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="108" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">懂硬件的软件人</text>
  <text x="108" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">知道代码会变成什么</text>

  <rect x="221" y="64" width="170" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="306" y="86.2" font-size="12" fill="#166534" text-anchor="middle">更好的计算系统</text>
  <text x="306" y="104.2" font-size="12" fill="#166534" text-anchor="middle">两边都懂才做得出</text>

  <rect x="419" y="64" width="170" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="504" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">懂软件的硬件人</text>
  <text x="504" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">知道上面真正要什么</text>

  <path d="M198,91 L210,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M414,91 L402,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="306" y="142" font-size="12" fill="#64748b" text-anchor="middle">接住两边的是 ISA 这层接口</text>
</svg>
