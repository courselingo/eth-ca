<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 140" width="626" height="140"
     role="img" aria-labelledby="fig-l3-8-title fig-l3-8-desc">
  <title id="fig-l3-8-title">SIMDRAM：把任意运算翻译成内存里的微操作</title>
  <desc id="fig-l3-8-desc">数据垂直摆放、以多数函数与取反为积木、生成并优化微操作序列、最后交给硬件执行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="626" height="140" fill="#ffffff"/>

  <text x="313" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">SIMDRAM：把任意运算翻译成微操作</text>

  <rect x="23" y="64" width="124" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">垂直摆数据</text>
  <text x="85" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">一列放一个比特</text>

  <rect x="175" y="64" width="124" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="237" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">多数函数</text>
  <text x="237" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">配上取反</text>

  <rect x="327" y="64" width="124" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="389" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">生成并优化</text>
  <text x="389" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">微操作序列</text>

  <rect x="479" y="64" width="124" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="541" y="86.2" font-size="12" fill="#166534" text-anchor="middle">硬件执行</text>
  <text x="541" y="104.2" font-size="12" fill="#166534" text-anchor="middle">按自定义时序</text>

  <path d="M152,91 L164,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M304,91 L316,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M456,91 L468,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
