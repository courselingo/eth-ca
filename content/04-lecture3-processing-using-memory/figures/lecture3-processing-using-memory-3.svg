<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 268" width="566" height="268"
     role="img" aria-labelledby="fig-l3-3-title fig-l3-3-desc">
  <title id="fig-l3-3-title">两股力把设计挤在中间</title>
  <desc id="fig-l3-3-desc">应用与系统从上往下拉，器件与电路从下往上推，设计者被挤在中间，必须同时满足两边的诉求。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="566" height="268" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两股力把设计挤在中间</text>

  <rect x="23" y="64" width="520" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">应用与系统：数据密集、访存与能量都是瓶颈</text>

  <path d="M283,111 L283,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M283,199 L283,187" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="520" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="283" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">设计被挤在中间：接口、编程模型、算法都要跟着改</text>

  <rect x="23" y="204" width="520" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="283" y="229.2" font-size="12" fill="#6b21a8" text-anchor="middle">器件与电路：缩放变难，需要更多智能来管理</text>
</svg>
