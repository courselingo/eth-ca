<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 268" width="546" height="268"
     role="img" aria-labelledby="fig-l3-7-title fig-l3-7-desc">
  <title id="fig-l3-7-title">同时激活三行，位线上得到的是多数函数</title>
  <desc id="fig-l3-7-desc">三条行的电荷在位线上叠加，结果等于三取二为真；把其中一行换成全零行，多数函数就退化成按位与。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="546" height="268" fill="#ffffff"/>

  <text x="273" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同时激活三行 = 多数函数</text>

  <rect x="23" y="64" width="140" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="93" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">行 A</text>

  <rect x="191" y="64" width="140" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="261" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">行 B</text>

  <rect x="359" y="64" width="140" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="429" y="89.2" font-size="12" fill="#6b21a8" text-anchor="middle">行 C</text>

  <path d="M93,111 L93,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M261,111 L261,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M429,111 L429,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="500" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="273" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">位线电压 = AB + BC + AC，也就是三取二为真</text>

  <rect x="23" y="204" width="500" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="273" y="229.2" font-size="12" fill="#166534" text-anchor="middle">把一行换成全零行，多数函数就退化成按位与</text>
</svg>
