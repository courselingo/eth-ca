<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 225" width="586" height="225"
     role="img" aria-labelledby="fig-l3-5-title fig-l3-5-desc">
  <title id="fig-l3-5-title">RowClone：连续两次激活把数据留在内存内部</title>
  <desc id="fig-l3-5-desc">源行的数据先进行缓冲，再被写进目标行；数据没有出内存，也不需要额外硬件。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="586" height="225" fill="#ffffff"/>

  <text x="293" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">RowClone：两次激活，数据不出内存</text>

  <rect x="23" y="64" width="540" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="293" y="89.2" font-size="12" fill="#b45309" text-anchor="middle">DRAM 的读＝激活一行送进行缓冲，写＝把行缓冲写回被激活的行</text>

  <rect x="23" y="134" width="120" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="83" y="159.2" font-size="12" fill="#1e40af" text-anchor="middle">源行</text>

  <rect x="171" y="134" width="180" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="261" y="159.2" font-size="12" fill="#6b21a8" text-anchor="middle">行缓冲（感应放大器）</text>

  <rect x="379" y="134" width="120" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="439" y="159.2" font-size="12" fill="#166534" text-anchor="middle">目标行</text>

  <path d="M148,155 L160,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M356,155 L368,155" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="293" y="200" font-size="12" fill="#64748b" text-anchor="middle">同子阵列内：延迟降 11.6 倍、能量降 74 倍</text>
</svg>
