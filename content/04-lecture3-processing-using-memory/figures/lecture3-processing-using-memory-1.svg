<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 280" width="642" height="280"
     role="img" aria-labelledby="fig-l3-1-title fig-l3-1-desc">
  <title id="fig-l3-1-title">处理器为中心的系统为什么失衡</title>
  <desc id="fig-l3-1-desc">系统里只有计算被认真优化，存储、互连与搬运都基本没被优化，结果是能耗高、性能低、系统复杂。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="642" height="280" fill="#ffffff"/>

  <text x="321" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">处理器为中心的系统为什么失衡</text>

  <rect x="23" y="64" width="596" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="321" y="89.2" font-size="12" fill="#b45309" text-anchor="middle">被认真优化的部分：计算</text>

  <path d="M113,111 L113,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M321,111 L321,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M529,111 L529,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="113" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">存储</text>
  <text x="113" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">基本是笨的</text>

  <rect x="231" y="134" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="321" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">通信与互连</text>
  <text x="321" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">又长又费电</text>

  <rect x="439" y="134" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="529" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">数据搬运</text>
  <text x="529" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">量大且必须出芯片</text>

  <path d="M113,193 L113,205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M321,193 L321,205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M529,193 L529,205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="216" width="596" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="321" y="241.2" font-size="12" fill="#9d174d" text-anchor="middle">结果：能量效率低、性能低、系统复杂</text>
</svg>
