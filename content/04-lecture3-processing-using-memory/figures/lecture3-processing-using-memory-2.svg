<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 268" width="486" height="268"
     role="img" aria-labelledby="fig-l3-2-title fig-l3-2-desc">
  <title id="fig-l3-2-title">三条测量指向同一件事：搬比算贵</title>
  <desc id="fig-l3-2-desc">网页浏览场景数据搬运占系统能量 41%；搬运一次数据约等于 115 次加法；消费级设备负载里 62.7% 的系统能量花在搬运上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="486" height="268" fill="#ffffff"/>

  <text x="243" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条测量指向同一件事</text>

  <rect x="23" y="64" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">网页浏览：搬运占系统能量 41%</text>

  <rect x="23" y="134" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="159.2" font-size="12" fill="#1e40af" text-anchor="middle">搬一次数据 ≈ 115 次加法操作</text>

  <rect x="23" y="204" width="440" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="243" y="229.2" font-size="12" fill="#9d174d" text-anchor="middle">消费级设备：62.7% 的系统能量</text>
</svg>
