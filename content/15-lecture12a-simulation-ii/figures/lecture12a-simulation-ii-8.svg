<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327.5" width="760" height="327.5"
     role="img" aria-labelledby="fig-lecture12a-simulation-ii-8-title fig-lecture12a-simulation-ii-8-desc">
  <title id="fig-lecture12a-simulation-ii-8-title">评估一个想法的五种方法，以及仿真的用途与风险</title>
  <desc id="fig-lecture12a-simulation-ii-8-desc">上排五格是五种评估手段：理论证明、解析建模或估算、仿真（抽象度与精度可以不同）、用真实系统做原型（例如 FPGA）、真实实现。下面三条是仿真对建筑师的意义（评估与理解还不存在的系统、探索很多梦想、给梦想做现实检查、判断哪个梦想更好）、同一页的警告（仿真也让人有办法用一个假的梦想把自己骗过去），以及第 48 页的预测与现实对照。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="327.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">评估一个想法的五种方法，以及仿真的用途与风险</text>
  <rect x="25" y="64" width="122" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="86" y="92.6" font-size="11" fill="#1e40af" text-anchor="middle">理论证明</text>
  <rect x="172" y="64" width="122" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="233" y="92.6" font-size="11" fill="#1e40af" text-anchor="middle">解析建模或估算</text>
  <rect x="319" y="64" width="122" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">仿真</text>
  <text x="380" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">抽象度与精度可不同</text>
  <rect x="466" y="64" width="122" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="527" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">真实系统做原型</text>
  <text x="527" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">例如 FPGA</text>
  <rect x="613" y="64" width="122" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="674" y="92.6" font-size="11" fill="#1e40af" text-anchor="middle">真实实现</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="163.7" font-size="12" fill="#166534" text-anchor="middle">仿真让人评估和理解还不存在的系统：探索很多梦想、给梦想做一次现实检查、判断哪个梦想更好</text>
  <rect x="25" y="205.5" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="227.7" font-size="12" fill="#b45309" text-anchor="middle">同一页的警告：仿真也让人有办法用一个假的梦想把自己骗过去</text>
  <rect x="25" y="269.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="289.85" font-size="11" fill="#1e293b" text-anchor="middle">第 48 页的预测与现实对照，就是把这句话落到实处</text>
</svg>
