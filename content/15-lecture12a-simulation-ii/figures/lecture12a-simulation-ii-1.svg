<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280"
     role="img" aria-labelledby="fig-lecture12a-simulation-ii-1-title fig-lecture12a-simulation-ii-1-desc">
  <title id="fig-lecture12a-simulation-ii-1-title">本讲的路线：一个模拟器、两项研究、其它模拟器、同一套方法用在别处</title>
  <desc id="fig-lecture12a-simulation-ii-1-desc">上排四格是这一讲的四段：一个模拟器（Ramulator）、两项研究（115 应用乘 9 类型与 BlockHammer）、其它模拟器（gem5、MQSim、DAMOV 等）、别的领域（疫情建模与预测）。最下面一条说最后六页带 Recall: 记号，讲仿真的目标、三个度量、高层模拟与渐进细化，它们对应本课程清单里的第 14 讲 Simulation I，本仓库已经有那一页。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">本讲的路线：一个模拟器、两项研究、其它模拟器、同一套方法用在别处</text>
  <rect x="25" y="64" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">副标题写的是「以内存为焦点」；推进顺序是四段</text>
  <rect x="25" y="128" width="158.75" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104.375" y="148.35" font-size="11" fill="#1e40af" text-anchor="middle">一个模拟器</text>
  <text x="104.375" y="164.85" font-size="11" fill="#1e40af" text-anchor="middle">Ramulator</text>
  <rect x="208.75" y="128" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="288.125" y="148.35" font-size="11" fill="#166534" text-anchor="middle">两项研究</text>
  <text x="288.125" y="164.85" font-size="11" fill="#166534" text-anchor="middle">115 应用 × 9 类型</text>
  <rect x="392.5" y="128" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="471.875" y="148.35" font-size="11" fill="#b45309" text-anchor="middle">其它模拟器</text>
  <text x="471.875" y="164.85" font-size="11" fill="#b45309" text-anchor="middle">gem5、MQSim、DAMOV 等</text>
  <rect x="576.25" y="128" width="158.75" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="655.625" y="148.35" font-size="11" fill="#6b21a8" text-anchor="middle">别的领域</text>
  <text x="655.625" y="164.85" font-size="11" fill="#6b21a8" text-anchor="middle">疫情建模与预测</text>
  <rect x="25" y="205.5" width="710" height="49.5" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="225.85" font-size="11" fill="#1e293b" text-anchor="middle">最后六页带 Recall: 记号，讲仿真的目标、三个度量、高层模拟与渐进细化</text>
  <text x="380" y="242.35" font-size="11" fill="#1e293b" text-anchor="middle">它们对应本课程清单里的第 14 讲 Simulation I，那一页在本仓库里还没有产出</text>
