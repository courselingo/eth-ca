<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330.5" width="760" height="330.5"
     role="img" aria-labelledby="fig-lecture19-cache-coherence-7-title fig-lecture19-cache-coherence-7-desc">
  <title id="fig-lecture19-cache-coherence-7-title">监听总线与目录：两种实现路径各自要付什么</title>
  <desc id="fig-lecture19-cache-coherence-7-desc">上排两格是讲义第 29 页分出的两类做法：监听总线把串行化集中在一个点上、靠互相看，目录把串行化点按块分散、靠显式请求。下面三条依次是监听对总线与小规模的依赖、监听这一侧的得失，以及目录这一侧的得失。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="330.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">监听总线与目录：两种实现路径各自要付什么</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="196.25" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">监听总线</text>
  <text x="196.25" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">串行化集中在一个点上，靠互相看</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.75" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">目录</text>
  <text x="563.75" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">串行化点按块分散，靠显式请求</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="163.7" font-size="12" fill="#1e40af" text-anchor="middle">监听靠广播，所以共用一条总线时很好做，适合小规模（p36）</text>
  <rect x="25" y="205.5" width="710" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="227.7" font-size="12" fill="#166534" text-anchor="middle">监听的好处：缺失延迟短、全局串行化容易、实现简单；代价是依赖广播，不可扩展（p56）</text>
  <rect x="25" y="269.5" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="291.7" font-size="12" fill="#b45309" text-anchor="middle">目录的好处：不广播，可扩展；代价是间接一次、要存共享者集合、协议更复杂（p56）</text>
</svg>
