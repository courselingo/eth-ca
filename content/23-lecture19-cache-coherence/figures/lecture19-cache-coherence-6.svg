<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324.5" width="760" height="324.5"
     role="img" aria-labelledby="fig-lecture19-cache-coherence-6-title fig-lecture19-cache-coherence-6-desc">
  <title id="fig-lecture19-cache-coherence-6-title">更新还是作废：两条路各自的好处与代价</title>
  <desc id="fig-lecture19-cache-coherence-6-desc">上排两格是讲义第 26 页给出的两条路：更新协议把更新推给所有副本，作废协议只留本地一份再改它。中间两格是各自的好处，下面两格是各自的代价。最下面一条是讲义第 28 页给出的两个关键变量：写的频率与共享的方式。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="324.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">更新还是作废：两条路各自的好处与代价</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="196.25" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">更新协议</text>
  <text x="196.25" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">把更新推给所有副本</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.75" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">作废协议</text>
  <text x="563.75" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">只留本地一份，再改它</text>
  <rect x="25" y="141.5" width="342.5" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="161.85" font-size="11" fill="#166534" text-anchor="middle">好处：共享者集合固定、更新不频繁时，省掉作废再取回</text>
  <rect x="392.5" y="141.5" width="342.5" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="161.85" font-size="11" fill="#166534" text-anchor="middle">好处：作废后拿到独占权；只有继续读的核留着一份</text>
  <rect x="25" y="202.5" width="342.5" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="222.85" font-size="11" fill="#b45309" text-anchor="middle">代价：反复写而中间没人读，更新全白做；总线会堵</text>
  <rect x="392.5" y="202.5" width="342.5" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="222.85" font-size="11" fill="#b45309" text-anchor="middle">代价：写争抢很凶就乒乓往返</text>
  <rect x="25" y="263.5" width="710" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="285.7" font-size="12" fill="#1e40af" text-anchor="middle">讲义说判断的关键是两个变量：写的频率，与共享的方式（p28）</text>
</svg>
