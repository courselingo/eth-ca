<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330.5" width="760" height="330.5"
     role="img" aria-labelledby="fig-lecture19-cache-coherence-4-title fig-lecture19-cache-coherence-4-desc">
  <title id="fig-lecture19-cache-coherence-4-title">谁来负责：软件一侧的几种做法，与硬件一侧的一个想法</title>
  <desc id="fig-lecture19-cache-coherence-4-desc">上排两格是讲义第 21 页摊开的两种责任归属：软件这一侧有页面级一致性、不可缓存与三条刷缓存指令，硬件这一侧的想法是某个核写 A 时把 A 的副本全部作废。下面三条依次是三条刷缓存指令、被讲义直接写成非解法的那个做法，以及第 23 页给出的得失：微架构设计者省事，普通程序员要开始操心硬件缓存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="330.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">谁来负责：软件一侧的几种做法，与硬件一侧的一个想法</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="196.25" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">软件这一侧</text>
  <text x="196.25" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">页面级、不可缓存、刷缓存指令</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.75" y="84.35" font-size="11" fill="#6b21a8" text-anchor="middle">硬件这一侧</text>
  <text x="563.75" y="100.85" font-size="11" fill="#6b21a8" text-anchor="middle">别人写就把 A 的副本全作废</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="163.7" font-size="12" fill="#1e40af" text-anchor="middle">三条刷缓存指令：FLUSH-LOCAL A、FLUSH-GLOBAL A、FLUSH-CACHE X（p21）</text>
  <rect x="25" y="205.5" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="227.7" font-size="12" fill="#b45309" text-anchor="middle">「把共享的锁与数据标成不可缓存」被讲义直接写成非解法（p21）</text>
  <rect x="25" y="269.5" width="710" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="291.7" font-size="12" fill="#166534" text-anchor="middle">好处是微架构设计者省事；代价是普通程序员要开始操心硬件缓存（p23）</text>
</svg>
