<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266.5" width="760" height="266.5"
     role="img" aria-labelledby="fig-lecture19-cache-coherence-2-title fig-lecture19-cache-coherence-2-desc">
  <title id="fig-lecture19-cache-coherence-2-title">同一地址那一侧：第 22 讲管全部地址的全局顺序，这一讲管同一地址的本地顺序</title>
  <desc id="fig-lecture19-cache-coherence-2-desc">上面一条是第 22 讲留下的那句话：容忍那一档的代价之一是顺序不再唯一。中间两格是讲义第 13 页并排写下的两句定义：一致性管全部内存地址的全局顺序，缓存一致性管同一个内存地址的本地顺序。下面一条说明这一讲展开的是右边那一半。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="266.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一地址那一侧：第 22 讲管全部地址的全局顺序，这一讲管同一地址的本地顺序</text>
  <rect x="25" y="64" width="710" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">第 22 讲留下的那句话：容忍那一档的代价之一，是顺序不再唯一</text>
  <rect x="25" y="128" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="196.25" y="148.35" font-size="11" fill="#6b21a8" text-anchor="middle">一致性</text>
  <text x="196.25" y="164.85" font-size="11" fill="#6b21a8" text-anchor="middle">全部地址的全局顺序（p13）</text>
  <rect x="392.5" y="128" width="342.5" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="563.75" y="148.35" font-size="11" fill="#6b21a8" text-anchor="middle">缓存一致性</text>
  <text x="563.75" y="164.85" font-size="11" fill="#6b21a8" text-anchor="middle">同一个地址的本地顺序（p13）</text>
  <rect x="25" y="205.5" width="710" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="227.7" font-size="12" fill="#1e40af" text-anchor="middle">这一讲展开的是右边那一半：同一个地址的两份副本，值对不对得上</text>
</svg>
