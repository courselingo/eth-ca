<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 292" width="566" height="292"
     role="img" aria-labelledby="fig-l7a-2-title fig-l7a-2-desc">
  <title id="fig-l7a-2-title">做防御难在两条</title>
  <desc id="fig-l7a-2-desc">内存控制器只看得到总线地址、看不到芯片内部的物理行映射；而脆弱性还在恶化，最弱单元已经只需 4800 次激活。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="292" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">做防御难在两条</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">挑战一：控制器只看到总线地址</text>
  <text x="283" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">物理行映射在芯片内部，它不知道谁和谁相邻</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle">挑战二：脆弱性还在恶化</text>
  <text x="283" y="186.2" font-size="12" fill="#9d174d" text-anchor="middle">最弱的单元已经只需 4800 次激活就翻转</text>

  <rect x="23" y="228" width="520" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="253.2" font-size="12" fill="#166534" text-anchor="middle">目标：不改芯片、不靠内部知识，也要挡得住</text>
</svg>
