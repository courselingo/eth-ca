<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 211" width="546" height="211"
     role="img" aria-labelledby="fig-l7a-9-title fig-l7a-9-desc">
  <title id="fig-l7a-9-title">三条线指向同一个要求</title>
  <desc id="fig-l7a-9-desc">刷新讲可靠性的代价，近内存计算讲搬运的代价，安全讲同一个器件现象可以被利用；三条线各自有一条箭头指向下面的共同要求，那个要求就是内存侧要有判断能力。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="546" height="211" fill="#ffffff"/>

  <text x="273" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条线指向同一个要求</text>

  <rect x="23" y="64" width="150" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="98" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">第二讲：刷新</text>
  <text x="98" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">可靠性的代价</text>

  <rect x="198" y="64" width="150" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="273" y="86.2" font-size="12" fill="#6b21a8" text-anchor="middle">第四、五讲：近内存</text>
  <text x="273" y="104.2" font-size="12" fill="#6b21a8" text-anchor="middle">搬运的代价</text>

  <rect x="373" y="64" width="150" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="448" y="86.2" font-size="12" fill="#9d174d" text-anchor="middle">本讲：安全</text>
  <text x="448" y="104.2" font-size="12" fill="#9d174d" text-anchor="middle">器件现象可被利用</text>

  <path d="M98,123 L98,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M273,123 L273,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M448,123 L448,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="500" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="273" y="171.2" font-size="12" fill="#166534" text-anchor="middle">共同要求：内存侧要有判断能力</text>
</svg>
