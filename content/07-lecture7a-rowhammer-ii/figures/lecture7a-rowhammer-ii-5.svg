<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 302" width="566" height="302"
     role="img" aria-labelledby="fig-l7a-5-title fig-l7a-5-desc">
  <title id="fig-l7a-5-title">阈值是一个范围，不是一个数</title>
  <desc id="fig-l7a-5-desc">换一组条件，诱发翻转所需的激活次数就不同；让攻击行保持激活更久可以把最小激活次数降低 36%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="566" height="302" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">阈值是一个范围，不是一个数</text>

  <rect x="23" y="64" width="520" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="88.2" font-size="12" fill="#1e40af" text-anchor="middle">同样的行锤攻击，换一组条件</text>
  <text x="283" y="106.2" font-size="12" fill="#1e40af" text-anchor="middle">诱发翻转所需的激活次数就变了</text>

  <path d="M283,127 L283,141" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="152" width="520" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="283" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">让攻击行保持激活的时间更长</text>
  <text x="283" y="194.2" font-size="12" fill="#b45309" text-anchor="middle">最小激活次数降低 36%</text>

  <rect x="23" y="238" width="520" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="263.2" font-size="12" fill="#9d174d" text-anchor="middle">只认死一个阈值的防御，就有被绕过的空间</text>
</svg>
