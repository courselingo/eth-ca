<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 304" width="566" height="304"
     role="img" aria-labelledby="fig-l7a-6-title fig-l7a-6-desc">
  <title id="fig-l7a-6-title">降低字线电压：脆弱性反而下降</title>
  <desc id="fig-l7a-6-desc">272 颗真实芯片上，降低字线电压使位错误率下降 15.2%（最多 66.9%），诱发首次翻转需多激活 7.4%（最多 85.8%）；代价是行激活延迟变大与保持时间变短。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="304" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">降低字线电压：脆弱性反而下降</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#166534" text-anchor="middle">位错误率下降 15.2%</text>
  <text x="283" y="104.2" font-size="12" fill="#166534" text-anchor="middle">最多下降 66.9%（272 颗真实芯片）</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#166534" text-anchor="middle">诱发第一次翻转需要多激活 7.4%</text>
  <text x="283" y="186.2" font-size="12" fill="#166534" text-anchor="middle">最多多 85.8%</text>

  <rect x="23" y="228" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="283" y="250.2" font-size="12" fill="#9d174d" text-anchor="middle">代价：24% 的芯片要加最多 24ns 激活延迟</text>
  <text x="283" y="268.2" font-size="12" fill="#9d174d" text-anchor="middle">20% 的芯片要补保持时间（对 16.4% 的行加倍刷新）</text>
</svg>
