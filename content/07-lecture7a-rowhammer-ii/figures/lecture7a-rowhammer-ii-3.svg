<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 210" width="574" height="210"
     role="img" aria-labelledby="fig-l7a-3-title fig-l7a-3-desc">
  <title id="fig-l7a-3-title">BlockHammer 的两个部件</title>
  <desc id="fig-l7a-3-desc">RowBlocker 用布隆过滤器追踪激活率、把高频行拉黑并延迟其激活；AttackThrottler 按行锤可能性指数识别攻击线程并压缩它的在飞请求配额。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="574" height="210" fill="#ffffff"/>

  <text x="287" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">BlockHammer 的两个部件</text>

  <rect x="23" y="64" width="250" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="148" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">RowBlocker：管住激活速率</text>

  <rect x="301" y="64" width="250" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="426" y="89.2" font-size="12" fill="#6b21a8" text-anchor="middle">AttackThrottler：管住攻击的代价</text>

  <path d="M148,111 L148,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M426,111 L426,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="250" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="148" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">布隆过滤器追踪每行激活率</text>
  <text x="148" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">拉黑高频行并延迟其激活</text>

  <rect x="301" y="134" width="250" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="426" y="156.2" font-size="12" fill="#6b21a8" text-anchor="middle">用行锤可能性指数找攻击线程</text>
  <text x="426" y="174.2" font-size="12" fill="#6b21a8" text-anchor="middle">指数越高，在飞请求配额越小</text>
</svg>
