<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288"
     role="img" aria-labelledby="fig-l9-3-title fig-l9-3-desc">
  <title id="fig-l9-3-title">行缓冲移动：一行数据在两个子阵列之间搬家</title>
  <desc id="fig-l9-3-desc">三步分别是激活源行、两个子阵列之间电荷共享、目的子阵列把结果放大；下面一行给出这条通路的数字：4 KB 数据 8 ns 搬完，折合 500 GB/s，是 DDR4-2400 单通道带宽的 26 倍，代价是芯片面积的 0.8%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="288" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">行缓冲移动：一行数据在两个子阵列之间搬家</text>

  <rect x="22" y="64" width="206" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">第一步：激活源行</text>
  <text x="125" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">整行进到行缓冲</text>

  <path d="M233,91 L246,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="257" y="64" width="206" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="86.2" font-size="12" fill="#b45309" text-anchor="middle">第二步：电荷共享</text>
  <text x="360" y="104.2" font-size="12" fill="#b45309" text-anchor="middle">两个子阵列之间</text>

  <path d="M468,91 L481,91" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="492" y="64" width="206" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="595" y="86.2" font-size="12" fill="#166534" text-anchor="middle">第三步：放大并写入</text>
  <text x="595" y="104.2" font-size="12" fill="#166534" text-anchor="middle">落在目的子阵列</text>

  <rect x="22" y="146" width="676" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="168.2" font-size="12" fill="#1e40af" text-anchor="middle">4 KB 数据 8 ns 搬完，折合 500 GB/s</text>
  <text x="360" y="186.2" font-size="12" fill="#1e40af" text-anchor="middle">是 DDR4-2400 单通道带宽的 26 倍</text>

  <path d="M360,205 L360,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="228" width="676" height="36" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="360" y="250.2" font-size="12" fill="#9d174d" text-anchor="middle">代价：占芯片面积的 0.8%（第 9、11 页）</text>
</svg>
