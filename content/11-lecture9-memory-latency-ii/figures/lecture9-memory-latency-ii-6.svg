<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302"
     role="img" aria-labelledby="fig-l9-6-title fig-l9-6-desc">
  <title id="fig-l9-6-title">按温度与模块取值：多套参数里选一套</title>
  <desc id="fig-l9-6-desc">自适应延迟 DRAM 的两个部件：厂商为每块 DIMM 给出多套按时温分档的时序参数，系统监视 DRAM 温度挑当前的一套用；结果是 55 摄氏度下读延迟降 32.7%、写延迟降 55.1%，测的是 115 块 DIMM。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="302" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">按温度与模块取值：多套参数里选一套</text>

  <rect x="22" y="60" width="676" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">部件一：厂商给出多套时序参数</text>
  <text x="360" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">每套对应一个温度档，都在该温度下可靠</text>

  <path d="M360,119 L360,131" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="142" width="676" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="164.2" font-size="12" fill="#b45309" text-anchor="middle">部件二：系统监视 DRAM 温度</text>
  <text x="360" y="182.2" font-size="12" fill="#b45309" text-anchor="middle">挑当前温度对应的那一套参数用</text>

  <path d="M360,201 L360,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="224" width="676" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="246.2" font-size="12" fill="#166534" text-anchor="middle">结果：55 摄氏度下读延迟降 32.7%</text>
  <text x="360" y="264.2" font-size="12" fill="#166534" text-anchor="middle">写延迟降 55.1%，测的是 115 块 DIMM</text>
</svg>
