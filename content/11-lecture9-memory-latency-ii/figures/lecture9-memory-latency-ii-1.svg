<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304"
     role="img" aria-labelledby="fig-l9-1-title fig-l9-1-desc">
  <title id="fig-l9-1-title">两条理由，加上一张被重复六次的清单</title>
  <desc id="fig-l9-1-desc">左列是第 4 页的两条理由：设计目标是容量与面积，以及延迟参数一刀切；右列是后者展开成的五条「所有」，下面两行说明这张清单在第 4、44、75、93、105、164 页出现 6 次，每拆掉一条就有一批工作。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="304" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两条理由，加上一张被重复六次的清单</text>

  <rect x="22" y="60" width="326" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="185" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">理由一：设计目标是容量与面积</text>
  <text x="185" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">不是为延迟设计</text>

  <rect x="373" y="60" width="325" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="535.5" y="82.2" font-size="12" fill="#6b21a8" text-anchor="middle">理由二：延迟参数一刀切</text>
  <text x="535.5" y="100.2" font-size="12" fill="#6b21a8" text-anchor="middle">一个数管所有情况</text>

  <rect x="22" y="146" width="676" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="32" y="160" font-size="11" fill="#64748b" text-anchor="start">理由二展开成五条（第 4 页）</text>

  <rect x="40" y="176" width="108" height="36" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="94" y="198.2" font-size="12" fill="#6b21a8" text-anchor="middle">所有温度</text>

  <rect x="173" y="176" width="108" height="36" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="227" y="198.2" font-size="12" fill="#6b21a8" text-anchor="middle">所有芯片</text>

  <rect x="306" y="176" width="108" height="36" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="360" y="198.2" font-size="12" fill="#6b21a8" text-anchor="middle">芯片所有部位</text>

  <rect x="439" y="176" width="108" height="36" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="493" y="198.2" font-size="12" fill="#6b21a8" text-anchor="middle">所有供电电压</text>

  <rect x="572" y="176" width="108" height="36" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="626" y="198.2" font-size="12" fill="#6b21a8" text-anchor="middle">所有应用数据</text>

  <text x="360" y="258" font-size="12" fill="#1e293b" text-anchor="middle">这份清单在第 4、44、75、93、105、164 页出现 6 次</text>
  <text x="360" y="278" font-size="12" fill="#1e293b" text-anchor="middle">每拆掉一条，就有一批工作</text>
</svg>
