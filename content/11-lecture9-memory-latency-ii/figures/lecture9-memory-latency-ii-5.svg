<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356"
     role="img" aria-labelledby="fig-l9-5-title fig-l9-5-desc">
  <title id="fig-l9-5-title">同一批微结构工作的另外三件</title>
  <desc id="fig-l9-5-desc">三行分别是 CROW、CLR-DRAM 与 SALP：CROW 把拷贝一行做成一条命令，换来 20% 加速、22% 少能量，代价是 0.5% 面积、1.6% 容量与 11.3 KiB 控制器存储；CLR-DRAM 让一行在最大容量与高性能之间切，tRCD 降 60.1%、tRAS 降 64.2%、tRP 降 46.4%、tWR 降 35.2%，性能提升 18.6%、能量降 29.7%、刷新能量降 66.1%；SALP 减少子阵列共享的全局结构，换来性能 17%、能量 19%，面积代价 0.15%，而独立 bank 要 36%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="356" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一批微结构工作的另外三件</text>

  <rect x="22" y="60" width="355" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="199.5" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">CROW：把拷贝一行做成一条命令</text>
  <text x="199.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">用专用拷贝解码器，不再反复激活</text>
  <text x="199.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle">还顺带能当缓存、能防行锤</text>

  <rect x="402" y="60" width="296" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="550" y="82.2" font-size="12" fill="#166534" text-anchor="middle">20% 加速，22% 少能量</text>
  <text x="550" y="100.2" font-size="12" fill="#166534" text-anchor="middle">0.5% 面积，1.6% 容量</text>
  <text x="550" y="118.2" font-size="12" fill="#166534" text-anchor="middle">11.3 KiB 控制器存储</text>

  <rect x="22" y="160" width="355" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="199.5" y="182.2" font-size="12" fill="#1e40af" text-anchor="middle">CLR-DRAM：一行在两种模式间切换</text>
  <text x="199.5" y="200.2" font-size="12" fill="#1e40af" text-anchor="middle">改单元与感放器之间的连接方式</text>
  <text x="199.5" y="218.2" font-size="12" fill="#1e40af" text-anchor="middle">性能 +18.6%，能量 -29.7%</text>

  <rect x="402" y="160" width="296" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="550" y="182.2" font-size="12" fill="#166534" text-anchor="middle">tRCD -60.1%，tRAS -64.2%</text>
  <text x="550" y="200.2" font-size="12" fill="#166534" text-anchor="middle">tRP -46.4%，tWR -35.2%</text>
  <text x="550" y="218.2" font-size="12" fill="#166534" text-anchor="middle">刷新能量 -66.1%</text>

  <rect x="22" y="260" width="355" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="199.5" y="282.2" font-size="12" fill="#1e40af" text-anchor="middle">SALP：少共享全局结构</text>
  <text x="199.5" y="300.2" font-size="12" fill="#1e40af" text-anchor="middle">本地锁存器替代全局锁存器</text>
  <text x="199.5" y="318.2" font-size="12" fill="#1e40af" text-anchor="middle">性能 +17%，能量 -19%</text>

  <rect x="402" y="260" width="296" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="550" y="282.2" font-size="12" fill="#166534" text-anchor="middle">面积代价 0.15%</text>
  <text x="550" y="300.2" font-size="12" fill="#166534" text-anchor="middle">独立 bank 的做法要 36%</text>
  <text x="550" y="318.2" font-size="12" fill="#166534" text-anchor="middle">距理想只差 3%</text>
</svg>
