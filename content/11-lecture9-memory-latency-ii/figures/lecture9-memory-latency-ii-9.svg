<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
     role="img" aria-labelledby="fig-l9-9-title fig-l9-9-desc">
  <title id="fig-l9-9-title">降电压的两条边界</title>
  <desc id="fig-l9-9-desc">左边是整个模块一起降电压，外围电路也跟着降、通道频率掉下来；右边只降 DRAM 阵列的电压，外围电路保持不动、通道频率不掉。用户给一个性能损失目标，Voltron 选出不违反目标的最低电压，并且只对出错的 bank 加大延迟。源给的省能量数字是 7.3% 与 3.2%，性能损失是 -1.6% 与 -1.8%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">降电压的两条边界</text>

  <rect x="22" y="60" width="326" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="185" y="82.2" font-size="12" fill="#9d174d" text-anchor="middle">整个模块一起降电压</text>
  <text x="185" y="100.2" font-size="12" fill="#9d174d" text-anchor="middle">外围电路也跟着降</text>
  <text x="185" y="118.2" font-size="12" fill="#9d174d" text-anchor="middle">通道频率掉下来</text>

  <rect x="373" y="60" width="325" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="535.5" y="82.2" font-size="12" fill="#166534" text-anchor="middle">只降 DRAM 阵列的电压</text>
  <text x="535.5" y="100.2" font-size="12" fill="#166534" text-anchor="middle">外围电路保持不动</text>
  <text x="535.5" y="118.2" font-size="12" fill="#166534" text-anchor="middle">通道频率不掉</text>

  <path d="M185,137 L185,149" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M536,137 L536,149" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="160" width="676" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="182.2" font-size="12" fill="#1e40af" text-anchor="middle">用户给一个性能损失目标</text>
  <text x="360" y="200.2" font-size="12" fill="#1e40af" text-anchor="middle">选出不违反目标的最低电压，只对出错的 bank 加延迟</text>

  <path d="M185,219 L185,231" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M536,219 L536,231" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="242" width="326" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="185" y="264.2" font-size="12" fill="#b45309" text-anchor="middle">源给的省能量数字</text>
  <text x="185" y="282.2" font-size="12" fill="#b45309" text-anchor="middle">7.3%（Voltron）与 3.2%</text>

  <rect x="373" y="242" width="325" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535.5" y="264.2" font-size="12" fill="#b45309" text-anchor="middle">源给的性能损失</text>
  <text x="535.5" y="282.2" font-size="12" fill="#b45309" text-anchor="middle">-1.6% 与 -1.8%</text>
</svg>
