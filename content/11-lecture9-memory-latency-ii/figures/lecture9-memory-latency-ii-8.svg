<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302"
     role="img" aria-labelledby="fig-l9-8-title fig-l9-8-desc">
  <title id="fig-l9-8-title">片内两种差异：按区域分档，与只刻画慢区</title>
  <desc id="fig-l9-8-desc">上面是 FLY-DRAM 的三档延迟 D1、D2、D3 对应 13、10、7.5 ns，tRCD 覆盖率分别是 12%、93%、99%，控制器只对没有慢单元的区域用更低延迟，源在这一页标了 17.6%、19.5%、19.7%、13.3% 四个数；下面是 DIVA 的两条腿：固有的慢区靠在线刻画找出，随机的慢单元交给纠错码接住。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="302" fill="#ffffff"/>

  <text x="360" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">片内两种差异：按区域分档，与只刻画慢区</text>

  <rect x="22" y="60" width="206" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">D1：13 ns</text>
  <text x="125" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">tRCD 覆盖 12%</text>

  <rect x="257" y="60" width="206" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">D2：10 ns</text>
  <text x="360" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">tRCD 覆盖 93%</text>

  <rect x="492" y="60" width="206" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="595" y="82.2" font-size="12" fill="#1e40af" text-anchor="middle">D3：7.5 ns</text>
  <text x="595" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle">tRCD 覆盖 99%</text>

  <rect x="22" y="142" width="676" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="164.2" font-size="12" fill="#b45309" text-anchor="middle">控制器对没有慢单元的区域用更低延迟</text>
  <text x="360" y="182.2" font-size="12" fill="#b45309" text-anchor="middle">源在第 80 页标了四个数：17.6%、19.5%、19.7%、13.3%</text>

  <rect x="22" y="224" width="326" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="185" y="246.2" font-size="12" fill="#6b21a8" text-anchor="middle">DIVA 一条腿：只刻画固有慢区</text>
  <text x="185" y="264.2" font-size="12" fill="#6b21a8" text-anchor="middle">慢来自到感放器、字线驱动器的距离</text>

  <rect x="373" y="224" width="325" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="535.5" y="246.2" font-size="12" fill="#6b21a8" text-anchor="middle">另一条腿：纠错码接住随机慢单元</text>
  <text x="535.5" y="264.2" font-size="12" fill="#6b21a8" text-anchor="middle">于是延迟可以降得更激进</text>
</svg>
