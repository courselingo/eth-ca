<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 777 312.0" width="777" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-4-title fig-memory-ordering-4-desc">
  <title id="fig-memory-ordering-4-title">三种处理器模型下，顺序从哪来</title>
  <desc id="fig-memory-ordering-4-desc">讲义对比了三种模型：单处理器由冯诺依曼模型给出顺序；数据流处理器只由数据依赖决定顺序；而多处理器里每个处理器内部有序，处理器之间则没有一个现成的答案。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="777" height="312.0" fill="#ffffff"/>

  <text x="390.5" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种处理器模型下，顺序从哪来</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">顺序的来源，三种模型各不同</text>
  <rect x="25" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="137.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">单处理器</text>
  <text x="137.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">程序顺序；乱序也要按序退休</text>
  <rect x="278" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">数据流</text>
  <text x="390.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">只由数据依赖决定</text>
  <rect x="531" y="138" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="643.5" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">多处理器</text>
  <text x="643.5" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">各核内有序，核间没有答案</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">单处理器那个模型值得留意：硬件可以乱序执行，但必须按序退休</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以「顺序」是一条契约，而不是硬件的实现细节</text>
</svg>
