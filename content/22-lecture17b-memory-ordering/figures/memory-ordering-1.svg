<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-1-title fig-memory-ordering-1-desc">
  <title id="fig-memory-ordering-1-title">这一讲的起点：性能与正确性是对立的</title>
  <desc id="fig-memory-ordering-1-desc">讲义开门见山地说，这两个指标在根本上是互相拉扯的：你总能用正确性去换性能。它举的两个例子是忘掉一把锁，以及让架构干脆不管操作的顺序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的起点：性能与正确性是对立的</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">性能与正确性在根本上对立</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">怎么用正确性换性能</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">忘掉一把关键锁；让架构不管顺序</text>
  <rect x="393" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">它会出现在哪</text>
  <text x="563.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">多处理器的两块基础支持</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">多处理器的基础支持里有两处这样的对立：内存序与缓存一致性</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲讲前一处</text>
</svg>
