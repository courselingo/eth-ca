<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-5-title fig-memory-ordering-5-desc">
  <title id="fig-memory-ordering-5-title">顺序为什么值得较真</title>
  <desc id="fig-memory-ordering-5-desc">讲义给了三条理由：调试需要可重复（同样的程序跑两次应当得到同样的顺序）、正确性可能受影响、以及强制严格顺序会给硬件实现性能手段添麻烦。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">顺序为什么值得较真</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">三条理由</text>
  <rect x="25" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="137.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">可重复</text>
  <text x="137.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">同样的执行应有同样的顺序</text>
  <rect x="278" y="138" width="225" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="390.5" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">正确性</text>
  <text x="390.5" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">不同视角看到不同顺序会出错</text>
  <rect x="531" y="138" width="225" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="643.5" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">性能开销</text>
  <text x="643.5" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">严格顺序会限制硬件手段</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">三条里第二条是这一讲真正要展开的</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">第一条与第三条是它的两个侧面：一个关乎能否重现问题，一个关乎要不要为此付出代价</text>
</svg>
