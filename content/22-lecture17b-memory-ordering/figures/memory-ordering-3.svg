<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-3-title fig-memory-ordering-3-desc">
  <title id="fig-memory-ordering-3-title">先分清两个容易混的东西</title>
  <desc id="fig-memory-ordering-3-desc">一致性管的是不同处理器对全部内存地址的操作之间的顺序；缓存一致性管的是不同处理器对同一个地址的操作之间的顺序。前者是全局的，后者是局部的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">先分清两个容易混的东西</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一致性是全局的，缓存一致性是局部的</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">一致性</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">不同处理器、全部地址的全局顺序</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">缓存一致性</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">不同处理器、同一个地址的顺序</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一讲讲前一个，下一个讲后一个</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">两者容易被混为一谈，因为名字里都有「一致」</text>
</svg>
