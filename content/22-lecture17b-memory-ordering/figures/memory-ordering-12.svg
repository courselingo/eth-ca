<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-12-title fig-memory-ordering-12-desc">
  <title id="fig-memory-ordering-12-title">顺序一致性的麻烦：太保守，而且挡路</title>
  <desc id="fig-memory-ordering-12-desc">讲义说它作为编程抽象很好，但有两个问题：顺序要求太保守，而且它会限制性能手段的发挥。它接着追问：全局顺序是否要求得太强了？</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">顺序一致性的麻烦：太保守，而且挡路</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">太保守，而且限制性能手段</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">哪些手段会破坏它</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">乱序执行让读互相错位；缓存让写一时看不见</text>
  <rect x="393" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">于是它开始追问</text>
  <text x="563.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">全局顺序是否太强？只要求写有序行不行</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">被点名的两个手段正好是上一讲归到「隐藏」与「容忍」里的东西</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以这一讲的放松方向，本质上是在问「那些手段能不能少受一点约束」</text>
</svg>
