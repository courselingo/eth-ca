<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-8-title fig-memory-ordering-8-desc">
  <title id="fig-memory-ordering-8-title">问题出在那个「先于」关系上</title>
  <desc id="fig-memory-ordering-8-desc">讲义把两个处理器的视角并排摆出来：对一个来说，置标志的写看起来发生在读之前；对另一个来说，顺序正好相反。于是「先于」这个关系在两个视角下不一致。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">问题出在那个「先于」关系上</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">同一个「先于」，两个视角各说各话</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">处理器一的视角</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">置标志看起来在读之前</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">处理器二的视角</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">读看起来在置标志之前</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是每一个都以为对方不在临界区里</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">错误不在任何一次单独的访存上，而在两次访存之间的关系上</text>
</svg>
