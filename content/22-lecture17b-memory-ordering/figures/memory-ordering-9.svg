<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-9-title fig-memory-ordering-9-desc">
  <title id="fig-memory-ordering-9-title">顺序一致性：一句话把顺序钉住</title>
  <desc id="fig-memory-ordering-9-desc">讲义引出顺序一致性：所有处理器看到的是同一个操作顺序。它给了两句精确的表述，一句说结果等同于某个串行顺序，另一句说每个处理器自己的操作在那个顺序里保持程序顺序。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">顺序一致性：一句话把顺序钉住</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">所有处理器看到同一个全局顺序</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">第一句</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">结果等同于所有操作排成某个串行顺序</text>
  <rect x="393" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">第二句</text>
  <text x="563.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">每个处理器自己的操作保持程序顺序</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两句话缺一不可：第一句给全局，第二句保住每个核内的直觉</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">讲义指出这是内存序模型，而且它是写在指令集里的</text>
</svg>
