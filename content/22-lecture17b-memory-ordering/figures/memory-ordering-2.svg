<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-2-title fig-memory-ordering-2-desc">
  <title id="fig-memory-ordering-2-title">而内存序正是「容忍」那一步的后果</title>
  <desc id="fig-memory-ordering-2-desc">上一讲把对付延迟的手段分成降低、隐藏、容忍三档。这一讲要说明的是：被归到容忍那一档的手段，代价之一就是顺序不再唯一。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而内存序正是「容忍」那一步的后果</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">容忍延迟的代价之一：顺序不再唯一</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">容忍那一档做了什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">乱序执行、多线程、提前跑</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">于是什么不再成立</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">所有处理器看到同一个顺序</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">乱序把读与写重新排列，缓存让写一时看不见，多线程让两件事同时发生</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">三样各自都只是「不去等」，合起来却动摇了「顺序唯一」这个前提</text>
</svg>
