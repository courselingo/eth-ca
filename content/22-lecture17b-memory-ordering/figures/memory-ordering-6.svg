<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-memory-ordering-6-title fig-memory-ordering-6-desc">
  <title id="fig-memory-ordering-6-title">一个看起来不可能出错的例子</title>
  <desc id="fig-memory-ordering-6-desc">两个处理器用一个标志位互斥地进入临界区。直观上，如果其中一个已经在临界区里，那它一定执行过那句置标志的写，所以另一个应当看到标志并停在外面。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个看起来不可能出错的例子</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">直观上，两个不可能同时进临界区</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">推理是这样的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">已进入 ⇒ 标志一定已置位</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">所以另一个应当</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">读到标志，停在外面</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个推理的每一步看起来都没有问题</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它用的前提是「先做的写，后做的读一定看得见」</text>
</svg>
