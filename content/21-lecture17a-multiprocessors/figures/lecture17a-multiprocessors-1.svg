<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" height="277"
     role="img" aria-labelledby="fig-lecture17a-multiprocessors-1-title fig-lecture17a-multiprocessors-1-desc">
  <title id="fig-lecture17a-multiprocessors-1-title">这一讲的位置与它的结构</title>
  <desc id="fig-lecture17a-multiprocessors-1-desc">上排两格是两条线的关系：内存线（第 18、19 讲）讲怎么让共享更快更公平；多处理器线（本讲）讲多个处理器一起跑时程序还对不对、快不快。中间四格是这一讲的四段：预取的收尾（runahead）、分类与三类并行、加速比的上限（Amdahl 与瓶颈）、任务分配与编程模型。最下面一条是三份必读读物与它们各自通向哪里：Amdahl 1967 属于这一讲，Lamport 1979 讲内存一致性，Papamarcos 与 Patel 1984 讲缓存一致性。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="277" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的位置与它的结构</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">内存线（第 18、19 讲）</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">怎么让共享更快、更公平</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">多处理器线（本讲）</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">多个处理器一起跑时还对不对、快不快</text>
  <rect x="25" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="104.375" y="161.85" font-size="11" fill="#166534" text-anchor="middle">一、预取的收尾</text>
  <text x="104.375" y="178.35" font-size="11" fill="#166534" text-anchor="middle">runahead</text>
  <rect x="208.75" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="288.125" y="161.85" font-size="11" fill="#166534" text-anchor="middle">二、分类与三类并行</text>
  <text x="288.125" y="178.35" font-size="11" fill="#166534" text-anchor="middle">Flynn、紧耦合与松耦合</text>
  <rect x="392.5" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="471.875" y="161.85" font-size="11" fill="#166534" text-anchor="middle">三、加速比的上限</text>
  <text x="471.875" y="178.35" font-size="11" fill="#166534" text-anchor="middle">Amdahl 与瓶颈</text>
  <rect x="576.25" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="655.625" y="161.85" font-size="11" fill="#166534" text-anchor="middle">四、任务分配与编程模型</text>
  <text x="655.625" y="178.35" font-size="11" fill="#166534" text-anchor="middle">静态动态、模型与硬件</text>
  <rect x="25" y="219" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">三份必读：Amdahl 1967（这一讲）、Lamport 1979（内存一致性）、Papamarcos 与 Patel 1984（缓存一致性）</text>
</svg>
