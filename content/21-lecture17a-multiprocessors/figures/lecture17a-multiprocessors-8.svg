<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" height="277"
     role="img" aria-labelledby="fig-lecture17a-multiprocessors-8-title fig-lecture17a-multiprocessors-8-desc">
  <title id="fig-lecture17a-multiprocessors-8-title">并行部分的四类瓶颈与三种关键路径</title>
  <desc id="fig-lecture17a-multiprocessors-8-desc">上排四格是并行部分的四类瓶颈：同步（锁、互斥、屏障同步）、通信（任务之间需要彼此的值）、负载不均（并行任务长度不同）、资源争用（共享硬件互相拖延）。下面三格是并行应用里的三种关键路径：被争用的临界区一次只能一个线程进入；屏障的最后一个到达者在关键路径上；流水线里最慢那一段的线程在关键路径上。最下面一条是 MySQL 的例子：把打开数据库表放进临界区之后，对称多核的加速比远低于非对称多核。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="277" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">并行部分的四类瓶颈与三种关键路径</text>
  <rect x="25" y="64" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="104.375" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">同步</text>
  <text x="104.375" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">锁、互斥、屏障同步</text>
  <rect x="208.75" y="64" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="288.125" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">通信</text>
  <text x="288.125" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">任务之间需要彼此的值</text>
  <rect x="392.5" y="64" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="471.875" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">负载不均</text>
  <text x="471.875" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">并行任务长度不同</text>
  <rect x="576.25" y="64" width="158.75" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="655.625" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">资源争用</text>
  <text x="655.625" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">共享硬件互相拖延</text>
  <rect x="25" y="141.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">临界区</text>
  <text x="135" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">一次只能一个线程进入</text>
  <rect x="270" y="141.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">屏障</text>
  <text x="380" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">最后一个到达者在关键路径上</text>
  <rect x="515" y="141.5" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">流水线</text>
  <text x="625" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">最慢那一段的线程在关键路径上</text>
  <rect x="25" y="219" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">MySQL 的例子：把打开数据库表放进临界区之后，对称多核的加速比远低于非对称多核（p97）</text>
</svg>
