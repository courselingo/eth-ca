<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280"
     role="img" aria-labelledby="fig-lecture17a-multiprocessors-7-title fig-lecture17a-multiprocessors-7-desc">
  <title id="fig-lecture17a-multiprocessors-7-title">同一个多项式：换串行算法就换加速比，以及三个度量</title>
  <desc id="fig-lecture17a-multiprocessors-7-desc">上排两格是例子本身与它的假设：要算 a4x⁴ 加 a3x³ 加 a2x² 加 a1x 加 a0；每个操作一个周期、没有通信开销、每个操作都可以放在不同的处理器上。中间一条是这一页的重点：重新看单处理器算法，用 Horner 1819 的方法改写之后串行操作数变了，于是同一个问题的并行加速比也跟着变。下面两格是超线性加速的两类来源（不公平的比较、缓存与内存效应）与三个传统度量（利用率 U、冗余度 R、效率 E 等于 U 除以 R）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个多项式：换串行算法就换加速比，以及三个度量</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">同一个多项式</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">a4x⁴ + a3x³ + a2x² + a1x + a0</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">假设：每个操作一个周期</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">无通信开销，每个操作可放不同处理器</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="163.7" font-size="12" fill="#b45309" text-anchor="middle">重新看单处理器算法：用 Horner 1819 的方法改写，串行操作数变了，加速比跟着变（p77）</text>
  <rect x="25" y="205.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="225.85" font-size="11" fill="#166534" text-anchor="middle">超线性加速的两个来源</text>
  <text x="196.25" y="242.35" font-size="11" fill="#166534" text-anchor="middle">不公平的比较；缓存与内存效应</text>
  <rect x="392.5" y="205.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="225.85" font-size="11" fill="#166534" text-anchor="middle">三个传统度量</text>
  <text x="563.75" y="242.35" font-size="11" fill="#166534" text-anchor="middle">U 利用率、R 冗余度、E 效率 = U ÷ R</text>
</svg>
