<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268"
     role="img" aria-labelledby="fig-lecture17a-multiprocessors-5-title fig-lecture17a-multiprocessors-5-desc">
  <title id="fig-lecture17a-multiprocessors-5-title">紧耦合的五个设计问题与编程一侧的五个问题</title>
  <desc id="fig-lecture17a-multiprocessors-5-desc">上排五格是硬件侧的设计问题：共享内存同步（锁、原子操作、屏障）、缓存一致性（私有缓存缓存了同一地址）、内存一致性（内存操作的顺序）、共享资源管理、通信（互连）。下面五格是编程一侧的问题：负载不均、同步（锁、屏障、流水线阶段、条件变量、信号量）、争用的避免与管理、最大化并行度、以及在优化性能的同时保证正确。最下面一条说明缓存一致性与内存一致性是这一讲只点名、后面几讲才展开的两个，并给出两份必读读物。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="268" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">紧耦合的五个设计问题与编程一侧的五个问题</text>
  <rect x="25" y="64" width="122" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="86" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">共享内存同步</text>
  <text x="86" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">锁、原子操作、屏障</text>
  <rect x="172" y="64" width="122" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="233" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">缓存一致性</text>
  <text x="233" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">私有缓存缓存同一地址</text>
  <rect x="319" y="64" width="122" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">内存一致性</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">内存操作的顺序</text>
  <rect x="466" y="64" width="122" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="527" y="90" font-size="10" fill="#1e40af" text-anchor="middle">共享资源管理</text>
  <rect x="613" y="64" width="122" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="674" y="90" font-size="10" fill="#1e40af" text-anchor="middle">通信：互连</text>
  <rect x="25" y="137" width="122" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="86" y="163" font-size="10" fill="#166534" text-anchor="middle">负载不均</text>
  <rect x="172" y="137" width="122" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="233" y="155.5" font-size="10" fill="#166534" text-anchor="middle">同步</text>
  <text x="233" y="170.5" font-size="10" fill="#166534" text-anchor="middle">锁、屏障、流水线阶段</text>
  <rect x="319" y="137" width="122" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="163" font-size="10" fill="#166534" text-anchor="middle">争用的避免与管理</text>
  <rect x="466" y="137" width="122" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="527" y="163" font-size="10" fill="#166534" text-anchor="middle">最大化并行度</text>
  <rect x="613" y="137" width="122" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="674" y="163" font-size="10" fill="#166534" text-anchor="middle">优化性能同时保证正确</text>
  <rect x="25" y="210" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="230.35" font-size="11" fill="#1e293b" text-anchor="middle">缓存一致性与内存一致性是这一讲只点名、后面几讲才展开的两个；必读是 Lamport 1979 与 Papamarcos 与 Patel 1984</text>
</svg>
