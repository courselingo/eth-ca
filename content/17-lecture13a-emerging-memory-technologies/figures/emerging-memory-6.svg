<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-6-title fig-emerging-memory-6-desc">
  <title id="fig-emerging-memory-6-title">合层能换来多少：讲义给的两组数</title>
  <desc id="fig-emerging-memory-6-desc">讲义用归一化的执行时间与能耗两组数据说明这套做法值多少：单层存储相对两层模型，执行时间约快五到二十四倍，能耗约省五到十六倍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">合层能换来多少：讲义给的两组数</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">单层存储相对两层模型的两组收益</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">执行时间</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">相对两层约快五到二十四倍</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">能耗</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">相对两层约省五到十六倍</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这两组数的对照对象里既有硬盘，也有已换成持久内存的两层做法</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以它量的是「消掉那层管理开销」值多少，而不是新器件本身快多少</text>
</svg>
