<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-1-title fig-emerging-memory-1-desc">
  <title id="fig-emerging-memory-1-title">新兴技术还能打开哪些别的机会</title>
  <desc id="fig-emerging-memory-1-desc">讲义先列了四类机会：把内存与存储合成一层、做超快的检查点与恢复、让系统更不容易丢数据、以及把计算与内存紧耦合起来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">新兴技术还能打开哪些别的机会</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">新兴内存打开的四类机会</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">系统层面</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">内存与存储合成一层、更不容易丢数据</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">应用与计算</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">超快检查点、计算与内存紧耦合</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一讲讲的是第一条，也就是合层</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而合层之所以值钱，是因为旧的两层模型本身就是瓶颈</text>
</svg>
