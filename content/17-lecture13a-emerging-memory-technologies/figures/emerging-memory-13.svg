<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-13-title fig-emerging-memory-13-desc">
  <title id="fig-emerging-memory-13-title">还留着哪些值得做的问题</title>
  <desc id="fig-emerging-memory-13-desc">讲义最后列了一串研究机会，并以一个「重新思考虚拟内存」的提议收尾：既然底层设备已经变了，那沿用了很多年的虚拟内存框架也值得重新设计。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">还留着哪些值得做的问题</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">留下来的研究机会</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">系统方向</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">内存与存储合层、混合内存、虚拟内存重做</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">可靠与安全</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">持久内存里的安全隐私、可靠性</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义用一个「虚拟块接口」的提议收尾，作为重做虚拟内存的一个方向</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而它给这一讲的落点是：器件在变，跟着要变的是一整条栈</text>
</svg>
