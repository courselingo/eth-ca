<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-8-title fig-emerging-memory-8-desc">
  <title id="fig-emerging-memory-8-title">挑战一：崩溃一致性</title>
  <desc id="fig-emerging-memory-8-desc">如果所有内存都是持久的，那么一次崩溃就可能把内存留在一个自相矛盾的状态里。讲义用一个双向链表插入做例子：改前驱与改后继是两步，中间崩掉就断链了。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">挑战一：崩溃一致性</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">所有内存都持久之后，崩溃会留下矛盾状态</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">例子</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">给双向链表插一个节点要改两处</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">崩在中间</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">链表就断了</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义把它收成一个范围问题：一致性到底该由谁负责</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">一端是全交给系统，另一端是全交给程序员，中间还有很多种分法</text>
</svg>
