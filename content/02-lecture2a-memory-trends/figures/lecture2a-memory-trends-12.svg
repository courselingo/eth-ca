<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 217" width="736" height="217"
     role="img" aria-labelledby="fig-l2a-12-title fig-l2a-12-desc">
  <title id="fig-l2a-12-title">内存调度器的研究谱系</title>
  <desc id="fig-l2a-12-desc">从 2007 年按停顿时间做公平的 STFM，一路到 2015 年给应用提供可预测性能的 MISE，目标从公平走到可预测。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="736" height="217" fill="#ffffff"/>

  <text x="368" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从公平到可预测：内存调度器的谱系</text>

  <rect x="23" y="64" width="90" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="84.6" font-size="11" fill="#1e40af" text-anchor="middle">STFM</text>
  <text x="68" y="101.1" font-size="11" fill="#1e40af" text-anchor="middle">停顿公平</text>

  <rect x="143" y="64" width="90" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="188" y="84.6" font-size="11" fill="#1e40af" text-anchor="middle">PAR-BS</text>
  <text x="188" y="101.1" font-size="11" fill="#1e40af" text-anchor="middle">并行加公平</text>

  <rect x="263" y="64" width="90" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="308" y="84.6" font-size="11" fill="#1e40af" text-anchor="middle">ATLAS</text>
  <text x="308" y="101.1" font-size="11" fill="#1e40af" text-anchor="middle">多控制器</text>

  <rect x="383" y="64" width="90" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="428" y="84.6" font-size="11" fill="#b45309" text-anchor="middle">TCM</text>
  <text x="428" y="101.1" font-size="11" fill="#b45309" text-anchor="middle">线程分组</text>

  <rect x="503" y="64" width="90" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548" y="84.6" font-size="11" fill="#b45309" text-anchor="middle">BLISS</text>
  <text x="548" y="101.1" font-size="11" fill="#b45309" text-anchor="middle">黑名单</text>

  <rect x="623" y="64" width="90" height="50" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="668" y="84.6" font-size="11" fill="#166534" text-anchor="middle">MISE</text>
  <text x="668" y="101.1" font-size="11" fill="#166534" text-anchor="middle">可预测</text>

  <path d="M68,119 L68,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M188,119 L188,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M308,119 L308,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M428,119 L428,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M548,119 L548,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M668,119 L668,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <path d="M23,164 L713,164" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="68" y="192" font-size="11" fill="#64748b" text-anchor="middle">2007</text>
  <text x="188" y="192" font-size="11" fill="#64748b" text-anchor="middle">2008</text>
  <text x="308" y="192" font-size="11" fill="#64748b" text-anchor="middle">2010</text>
  <text x="428" y="192" font-size="11" fill="#64748b" text-anchor="middle">2010</text>
  <text x="548" y="192" font-size="11" fill="#64748b" text-anchor="middle">2014</text>
  <text x="668" y="192" font-size="11" fill="#64748b" text-anchor="middle">2015</text>
