<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 210" width="642" height="210"
     role="img" aria-labelledby="fig-l2a-10-title fig-l2a-10-desc">
  <title id="fig-l2a-10-title">内存问题的三条应对路线</title>
  <desc id="fig-l2a-10-desc">修它、补上它、接受它三条路同时在走，源讲义强调它们需要软件、硬件与器件三方面合作。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="642" height="210" fill="#ffffff"/>

  <text x="321" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条路同时在走，而不是三选一</text>

  <rect x="23" y="64" width="596" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="321" y="89.2" font-size="12" fill="#b45309" text-anchor="middle">内存问题的三条应对路线</text>

  <path d="M113,111 L113,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M321,111 L321,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M529,111 L529,123" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="134" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="113" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">修它</text>
  <text x="113" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">让内存与控制器更聪明</text>

  <rect x="231" y="134" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="321" y="156.2" font-size="12" fill="#1e40af" text-anchor="middle">补上它</text>
  <text x="321" y="174.2" font-size="12" fill="#1e40af" text-anchor="middle">用别的技术替代一部分</text>

  <rect x="439" y="134" width="180" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="529" y="156.2" font-size="12" fill="#166534" text-anchor="middle">接受它</text>
  <text x="529" y="174.2" font-size="12" fill="#166534" text-anchor="middle">异构内存加智能映射</text>
</svg>
