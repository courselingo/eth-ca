<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 234" width="563" height="234"
     role="img" aria-labelledby="fig-l2a-4-title fig-l2a-4-desc">
  <title id="fig-l2a-4-title">十八年里容量与带宽涨了很多，延迟几乎没动</title>
  <desc id="fig-l2a-4-desc">横条按对数刻度：1999 到 2017 年 DRAM 容量涨 128 倍、带宽涨 20 倍，而延迟只从 1 变成 1.3 倍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="563" height="234" fill="#ffffff"/>

  <text x="300" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">容量与带宽涨了很多，延迟几乎没动</text>

  <text x="23" y="79.2" font-size="12" fill="#1e293b" text-anchor="start">容量</text>
  <rect x="100" y="64" width="400" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="512" y="79.2" font-size="12" fill="#64748b" text-anchor="start">128×</text>

  <text x="23" y="127.2" font-size="12" fill="#1e293b" text-anchor="start">带宽</text>
  <rect x="100" y="112" width="255" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="367" y="127.2" font-size="12" fill="#64748b" text-anchor="start">20×</text>

  <text x="23" y="175.2" font-size="12" fill="#1e293b" text-anchor="start">延迟</text>
  <rect x="100" y="160" width="41" height="22" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="153" y="175.2" font-size="12" fill="#64748b" text-anchor="start">1.3×</text>

  <text x="23" y="209" font-size="11" fill="#64748b" text-anchor="start">横条按对数刻度：等长的差距表示等比的倍数</text>
</svg>
