<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 222" width="432" height="222"
     role="img" aria-labelledby="fig-l2a-2-title fig-l2a-2-desc">
  <title id="fig-l2a-2-title">主存是多个主体共享的资源</title>
  <desc id="fig-l2a-2-desc">CPU、GPU 与 FPGA 各自按自己的节奏向同一份主存取数据，谁先被服务要由内存控制器决定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="432" height="222" fill="#ffffff"/>

  <text x="216" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主存是多个主体共享的资源</text>

  <rect x="23" y="64" width="110" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="78" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">CPU</text>
  <text x="78" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">按自己的节奏取数</text>

  <rect x="161" y="64" width="110" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="216" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">GPU</text>
  <text x="216" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">带宽需求很大</text>

  <rect x="299" y="64" width="110" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="354" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">FPGA</text>
  <text x="354" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">自己直连主存</text>

  <path d="M78,123 L78,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M216,123 L216,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M354,123 L354,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="146" width="386" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="216" y="168.2" font-size="12" fill="#b45309" text-anchor="middle">主存</text>
  <text x="216" y="186.2" font-size="12" fill="#b45309" text-anchor="middle">谁先被服务由内存控制器决定</text>
</svg>
