<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-prefetching-13-title fig-prefetching-13-desc">
  <title id="fig-prefetching-13-title">一个预取器不够，就上多个</title>
  <desc id="fig-prefetching-13-desc">混合预取器的想法是用多个预取器去覆盖多种访问模式：覆盖更全、可能更及时。代价是复杂度、带宽，以及预取器之间会互相干扰。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个预取器不够，就上多个</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">多个预取器一起上，以及与它同来的代价</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">好处</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">覆盖更全，及时性可能更好</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">代价</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">更复杂、更费带宽，而且彼此干扰</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">最后那条代价最麻烦：两个预取器各自的判断都合理，合起来却会互相污染</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以混合方案真正的难点不在「选哪几个」，而在「怎么管住它们」</text>
</svg>
