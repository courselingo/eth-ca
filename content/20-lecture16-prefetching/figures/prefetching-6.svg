<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-prefetching-6-title fig-prefetching-6-desc">
  <title id="fig-prefetching-6-title">步长按什么单位记：两种记法各有所长</title>
  <desc id="fig-prefetching-6-desc">一种是按指令记：每条访存指令各记一个步长。另一种是按内存区域记：在一个地址范围上记步长。后者能发现由多条指令共同造成的步长，也更容易跑到处理器前面去。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">步长按什么单位记：两种记法各有所长</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">按指令记，还是按内存区域记</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">按指令记</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">精度高，但要靠程序计数器找回</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">按内存区域记</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">能发现多指令造成的步长，更容易跑在前面</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">按区域记的代价是硬件开销：要监视的地址通常比指令多得多</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这也解释了为什么它出现得更晚：它的收益要靠开销换来</text>
</svg>
