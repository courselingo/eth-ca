<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-prefetching-12-title fig-prefetching-12-desc">
  <title id="fig-prefetching-12-title">另一条路：直接去看数据里有什么</title>
  <desc id="fig-prefetching-12-desc">内容导向预取针对的是指针：在一行数据里认出哪些值像指针，就为它们发预取。它的好处是不必记历史，因此连从未见过的指针也能提前取回来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">另一条路：直接去看数据里有什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">从数据内容里认出指针，为它们预取</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它的独到之处</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">不必记历史，首次出现的指针也能预取</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">它的粗糙之处</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">会把一行里所有指针都取一遍</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">后来提高效率的做法是让编译器给出提示，硬件只取可能有用的指针</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一条的分工很有意思：硬件拿不到的信息，软件本来就有</text>
</svg>
