<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-prefetching-7-title fig-prefetching-7-desc">
  <title id="fig-prefetching-7-title">把「流」做成一个缓冲区</title>
  <desc id="fig-prefetching-7-desc">流缓冲是另一个角度的做法：每个缓冲区装一条顺序预取过来的行；一次未命中时去查所有缓冲区，命中就弹出一项并把数据装进缓存，不命中就新开一条流。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把「流」做成一个缓冲区</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">流缓冲：每条流一个先进先出队列</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">未命中时做什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">查所有流的头部，命中就弹出</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">没命中时做什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">按最近最少用开一条新流</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个设计把「预热」和「命中」分开了：数据在缓冲区里等着被要用它的那次访问取走</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它也是把预取数据放在缓存之外这一支里最经典的一个方案</text>
</svg>
