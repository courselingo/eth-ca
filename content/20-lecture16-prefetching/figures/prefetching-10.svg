<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-prefetching-10-title fig-prefetching-10-desc">
  <title id="fig-prefetching-10-title">而三个指标不能靠固定档位解决</title>
  <desc id="fig-prefetching-10-desc">侵略性越强覆盖率越高、及时性越好，但准确率越低、带宽与污染越重。既然权衡随负载变，那么固定档位就必然在某些负载上过激、在另一些上过保守。于是有了反馈式限流。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而三个指标不能靠固定档位解决</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">用反馈把侵略性调成自适应</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">要一个可测的量</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">讲义用的是每千条退休指令的内存总线访问数</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">拿来做什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">据此收紧或放松预取</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">那个量之所以合适，是因为它把需求未命中也算进去了</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是它能同时反映预取带来的收益与被它挤出去的代价</text>
</svg>
