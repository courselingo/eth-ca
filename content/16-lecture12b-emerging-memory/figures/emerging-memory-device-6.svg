<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-6-title fig-emerging-memory-device-6-desc">
  <title id="fig-emerging-memory-device-6-title">它怎么被写进去</title>
  <desc id="fig-emerging-memory-device-6-desc">写有两种操作：置位用持续电流把单元加热到结晶温度以上，于是材料转为晶态；复位把单元加热到熔化温度以上再急冷，于是转为非晶态。读则是去感知电阻。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它怎么被写进去</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">置位靠慢热，复位靠熔化后急冷</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">置位</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">持续电流加热到结晶温度以上</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">复位</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">加热到熔化温度以上再急冷</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两个操作需要的电流差别很大，讲义给了量级</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这条差别是后面「写比读贵得多」的物理来源</text>
</svg>
