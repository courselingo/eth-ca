<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-11-title fig-emerging-memory-device-11-desc">
  <title id="fig-emerging-memory-device-11-title">一个反直觉的细节：读一个位比读另一个位贵</title>
  <desc id="fig-emerging-memory-device-11-desc">讲义观察到：在多位单元里，读某一种值的延迟与能耗明显低于另一种。原因是多位单元靠比较电阻落在那一段来判断值，而不同的段读起来的代价不同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个反直觉的细节：读一个位比读另一个位贵</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">多位单元里，两种值的读代价不对称</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">观察到什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">读某一个值的延迟与能耗更低</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">为什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">多位单元靠比较电阻落在哪一段</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条观察的价值在于它把一个「平均延迟」拆成了两个可区分的延迟</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">一旦能区分，就有可能按数据的值来安排访问顺序，从而省下平均延迟</text>
</svg>
