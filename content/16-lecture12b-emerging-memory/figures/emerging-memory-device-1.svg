<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-1-title fig-emerging-memory-device-1-desc">
  <title id="fig-emerging-memory-device-1-title">起点是电荷的极限，而出口有两条</title>
  <desc id="fig-emerging-memory-device-1-desc">讲义先把问题归到电荷本身：把电荷放进一个越来越小的单元、再可靠地读出它，变得越来越难。于是有两条出路，一条是改架构，一条是换器件。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">起点是电荷的极限，而出口有两条</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">电荷型内存的极限，与两条出路</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">问题的根</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">单元变小，放电荷与读电荷都变难</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">两条出路</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">改架构，或者换器件</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这两条路是可以并行的，而不是二选一</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">讲义把改架构放在前面，说明它认为这条路更现实</text>
</svg>
