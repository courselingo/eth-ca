<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-8-title fig-emerging-memory-device-8-desc">
  <title id="fig-emerging-memory-device-8-title">但代价也很硬</title>
  <desc id="fig-emerging-memory-device-8-desc">讲义把代价列成四条：延迟比 DRAM 高（写尤其高）、动态能耗高、寿命低（一个单元写入约一亿次就坏）、以及可靠性问题（电阻会漂移）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">但代价也很硬</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">四条代价</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">延迟与能耗</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">读高约四倍、写高一个量级</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">寿命与可靠性</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">写入约一亿次即坏，且电阻漂移</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">把优势和代价并排看，就能看出这一讲后面的走向</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">四条代价里，寿命与写入能耗都指向同一件事：少写</text>
</svg>
