<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-7-title fig-emerging-memory-device-7-desc">
  <title id="fig-emerging-memory-device-7-title">它的好处：可继续缩小、能存多值、不用刷新</title>
  <desc id="fig-emerging-memory-device-7-desc">讲义列了三条优势：比 DRAM 与闪存更容易继续缩小（因为它靠电流脉冲，而脉冲随特征尺寸线性缩小）；因为电阻范围大，一个单元能存多个位；以及非易失，因此不需要刷新、空闲功耗低。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它的好处：可继续缩小、能存多值、不用刷新</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">三条优势</text>
  <rect x="25" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="137.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">可继续缩小</text>
  <text x="137.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">脉冲随特征尺寸线性缩小</text>
  <rect x="278" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="390.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">能存多值</text>
  <text x="390.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">电阻范围大，一位以上每单元</text>
  <rect x="531" y="138" width="225" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="643.5" y="167.7" font-size="15" fill="#166534" text-anchor="middle">不用刷新</text>
  <text x="643.5" y="185.7" font-size="12" fill="#166534" text-anchor="middle">非易失，空闲功耗低</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义给了当时的预期尺寸与已经做出来的原型尺寸</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">三条优势合起来，是它被拿来当主存候选的全部理由</text>
</svg>
