<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-5-title fig-emerging-memory-device-5-desc">
  <title id="fig-emerging-memory-device-5-title">相变内存是什么</title>
  <desc id="fig-emerging-memory-device-5-desc">相变材料有两个态：非晶态电阻高，晶态电阻低。两个态可以可靠且快速地来回切换，于是可以用高阻表示一个值、低阻表示另一个值。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">相变内存是什么</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">相变材料的两个态，对应两个电阻</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">非晶态</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">电阻高，记作 0</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">晶态</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">电阻低，记作 1</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">把值编码在电阻上，而不是编码在电荷量上</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一步是整讲里所有性质差异的来源</text>
</svg>
