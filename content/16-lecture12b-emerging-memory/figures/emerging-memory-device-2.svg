<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-2-title fig-emerging-memory-device-2-desc">
  <title id="fig-emerging-memory-device-2-title">出路一：不换器件，改架构</title>
  <desc id="fig-emerging-memory-device-2-desc">第一条路是在现有器件上改：以内存为中心设计系统、改内存的架构与接口、把浪费管起来。它列出的要紧事项里，第一条是「在低成本下拿到可靠性」，也就是容量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">出路一：不换器件，改架构</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">在现有器件上改架构</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">改什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">系统设计、内存架构与接口、浪费管理</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">要解决什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">低成本下的可靠性、能耗、延迟、带宽</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这条路讲义已经在前面的讲次里示范过（例如按行定制的刷新）</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它的好处是不必等新器件成熟，代价是收益有上限</text>
</svg>
