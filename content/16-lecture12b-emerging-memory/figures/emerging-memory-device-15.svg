<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 886 312.0" width="886" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-15-title fig-emerging-memory-device-15-desc">
  <title id="fig-emerging-memory-device-15-title">同一个器件还能做别的事</title>
  <desc id="fig-emerging-memory-device-15-desc">讲义在最后把视线从「当内存用」移开：这类器件还能做内存内计算。一是用普通 DRAM 的模拟特性做批量位运算，二是在新兴器件的交叉阵列上直接做点积。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="886" height="312.0" fill="#ffffff"/>

  <text x="445.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个器件还能做别的事</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">除了当内存，还能当计算部件</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">在普通 DRAM 上</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">激活多行做批量位运算，数十倍提升</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">在交叉阵列上</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">用基尔霍夫定律直接算点积</text>
  <rect x="25" y="234" width="840" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="445.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">后一条把「计算放进内存」从搬数据变成了用物理定律算数</text>
  <text x="445.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">讲义随后转入合层那条线，那部分在本仓库的下一篇里展开</text>
</svg>
