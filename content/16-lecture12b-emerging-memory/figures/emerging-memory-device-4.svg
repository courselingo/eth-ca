<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-emerging-memory-device-4-title fig-emerging-memory-device-4-desc">
  <title id="fig-emerging-memory-device-4-title">两类内存读写的东西根本不同</title>
  <desc id="fig-emerging-memory-device-4-desc">电荷型写的是电荷、读的是电压；电阻型写的是电流脉冲、读的是电阻。这个差别决定了后面所有的性质差异，也决定了「换器件」不是换个零件那么轻。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两类内存读写的东西根本不同</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">写什么、读什么，两类根本不同</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">电荷型</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">写电荷，读电压</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">电阻型</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">打电流脉冲，读电阻</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">所以换器件意味着整套外围电路与感知方式都要跟着换</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这也解释了为什么这类替换在历史上比预期慢得多</text>
</svg>
