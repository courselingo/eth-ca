<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 293.5" width="760" height="293.5"
     role="img" aria-labelledby="fig-lecture21-on-chip-networks-1-title fig-lecture21-on-chip-networks-1-desc">
  <title id="fig-lecture21-on-chip-networks-1-title">片上与片外：同一套原理，不同的约束</title>
  <desc id="fig-lecture21-on-chip-networks-1-desc">上排两格是片内的好处（没有引脚约束、布线丰富又低功耗，于是带宽可以很高、全局协调也更简单）与片外的成本位置（通道、引脚、连接器与线缆）。中间两格是片内的约束（二维基板限制拓扑、能耗与功耗是核心关切、逻辑面积与金属层限制布线）与片内的成本位置（存储与开关，因为线本身充裕，于是走「很多宽通道、更少缓冲」）。下面三格是三个物理与负载上的差别：片内距离短所以延迟低但 RC 线每 1 到 2 毫米要插中继器、片内的负载是多核的缓存与内存流量、片外的负载是跨芯片的大规模并行流量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="293.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">片上与片外：同一套原理，不同的约束</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="84.35" font-size="11" fill="#166534" text-anchor="middle">片内：没有引脚约束、布线丰富又低功耗</text>
  <text x="196.25" y="100.85" font-size="11" fill="#166534" text-anchor="middle">于是带宽可以很高，全局协调也更简单</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e293b" text-anchor="middle">片外：成本是通道、引脚、连接器与线缆</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e293b" text-anchor="middle">（第 24 讲的那套约束）</text>
  <rect x="25" y="141.5" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="161.85" font-size="11" fill="#b45309" text-anchor="middle">片内的约束：二维基板限制拓扑</text>
  <text x="196.25" y="178.35" font-size="11" fill="#b45309" text-anchor="middle">能耗与功耗是核心关切，逻辑面积与金属层限制布线</text>
  <rect x="392.5" y="141.5" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">片内的成本是存储与开关</text>
  <text x="563.75" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">线本身充裕，于是走「很多宽通道、更少缓冲」</text>
  <rect x="25" y="219" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="239.35" font-size="11" fill="#6b21a8" text-anchor="middle">物理：片内距离短所以延迟低</text>
  <text x="135" y="255.85" font-size="11" fill="#6b21a8" text-anchor="middle">RC 线每 1 到 2 毫米要插中继器</text>
  <rect x="270" y="219" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="247.6" font-size="11" fill="#6b21a8" text-anchor="middle">负载：片内是多核的缓存与内存流量</text>
  <rect x="515" y="219" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="247.6" font-size="11" fill="#6b21a8" text-anchor="middle">负载：片外是跨芯片的大规模并行流量</text>
</svg>
