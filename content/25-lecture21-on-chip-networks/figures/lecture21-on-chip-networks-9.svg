<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338"
     role="img" aria-labelledby="fig-lecture21-on-chip-networks-9-title fig-lecture21-on-chip-networks-9-desc">
  <title id="fig-lecture21-on-chip-networks-9-title">拥塞控制：HAT 与把片上网络当网络来研究</title>
  <desc id="fig-lecture21-on-chip-networks-9-desc">上排两格是 HAT 的问题（包争用造成拥塞，于是性能下降）与两条观察（应用对网络延迟的敏感度不同；必须按应用分别限流）。中间两格是做法（按应用做源端限流，并按网络负载调整限流比例）与结果（在性能与能效上都优于当时的源限流策略）。下面两条是另一条路线的结论：拥塞限制效率与可扩展性、核的自限流防止了拥塞崩溃、片上拥塞控制需要应用感知；以及那条路线给出的 27% 系统吞吐提升与扩展到 4096 核。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="338" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">拥塞控制：HAT 与把片上网络当网络来研究</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">HAT 的问题</text>
  <text x="196.25" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">包争用造成拥塞，于是性能下降</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">两条观察</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">应用对网络延迟的敏感度不同；必须按应用分别限流</text>
  <rect x="25" y="141.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="161.85" font-size="11" fill="#166534" text-anchor="middle">HAT 的做法</text>
  <text x="196.25" y="178.35" font-size="11" fill="#166534" text-anchor="middle">按应用做源端限流，并按网络负载调整限流比例</text>
  <rect x="392.5" y="141.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="161.85" font-size="11" fill="#166534" text-anchor="middle">结果</text>
  <text x="563.75" y="178.35" font-size="11" fill="#166534" text-anchor="middle">在性能与能效上都优于当时的源限流策略</text>
  <rect x="25" y="219" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="239.35" font-size="11" fill="#1e40af" text-anchor="middle">把片上网络当网络来研究：拥塞限制效率与可扩展性；核的自限流防止了拥塞崩溃；片上拥塞控制需要应用感知</text>
  <rect x="25" y="280" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="300.35" font-size="11" fill="#6b21a8" text-anchor="middle">那条路线的结果：系统吞吐提升 27%，并把 CMP 有效扩展到 4096 核</text>
</svg>
