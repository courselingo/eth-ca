<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327.5" width="760" height="327.5"
     role="img" aria-labelledby="fig-lecture13b-memory-controllers-ii-13-title fig-lecture13b-memory-controllers-ii-13-desc">
  <title id="fig-lecture13b-memory-controllers-ii-13-title">总结：没有单一最好的手段</title>
  <desc id="fig-lecture13b-memory-controllers-ii-13-desc">上排两格是两类立场：聪明资源（服务质量感知的内存调度）与笨资源（源限流与通道划分）。中间一条是讲义给的三条判断：两类做法都能有效减少干扰、没有对所有工作负载都最好的单一做法、组合起来最有力。下面两条是它自己列出的缺口（预取感知、控制器协同设计、缓存与互连的干扰、写读调度、为减少干扰的 DRAM 设计、内存内计算里的干扰与服务质量）与未来方向（异构 SoC 的服务质量、技术组合、用机器学习管理资源、真实原型）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="327.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">总结：没有单一最好的手段</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="84.35" font-size="11" fill="#166534" text-anchor="middle">聪明资源</text>
  <text x="196.25" y="100.85" font-size="11" fill="#166534" text-anchor="middle">服务质量感知的内存调度</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">笨资源</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">源限流与通道划分</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="163.7" font-size="12" fill="#1e40af" text-anchor="middle">三条判断：两类做法都能有效减少干扰；没有对所有工作负载都最好的单一做法；组合起来最有力</text>
  <rect x="25" y="205.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="225.85" font-size="11" fill="#1e293b" text-anchor="middle">没讲的：预取感知、控制器协同设计、缓存与互连的干扰、写读调度、为减少干扰的 DRAM 设计、PIM 里的干扰与 QoS</text>
  <rect x="25" y="266.5" width="710" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="288.7" font-size="12" fill="#6b21a8" text-anchor="middle">未来：异构 SoC 的服务质量、技术组合、用机器学习管理资源、真实原型</text>
</svg>
