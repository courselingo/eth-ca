<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" height="277"
     role="img" aria-labelledby="fig-lecture13b-memory-controllers-ii-1-title fig-lecture13b-memory-controllers-ii-1-desc">
  <title id="fig-lecture13b-memory-controllers-ii-1-title">两讲的分工，以及这一讲的四段路线</title>
  <desc id="fig-lecture13b-memory-controllers-ii-1-desc">上排两格是两讲的分工：第 13 讲讲控制器本身（定时约束、调度、功耗与自优化），第 18 讲讲共享与干扰（谁先被服务、服务质量）。中间四格是这一讲的四段路线：共享的代价（争用、不可预测与攻击）、怎么控制（四种基本功与两类立场）、调度器演化（从 STFM 到 DASH）、以及其它手段与总结（映射、限流与线程调度）。最下面一条说讲义开头 p3 到 p14 是 Recall: 复习第 13 讲，p165 又重复了一次四种基本功的清单。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="277" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两讲的分工，以及这一讲的四段路线</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">第 13 讲（上一讲）</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">控制器本身：定时约束、调度、功耗、自优化</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">第 18 讲（这一讲）</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">共享与干扰：谁先被服务、服务质量</text>
  <rect x="25" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="104.375" y="161.85" font-size="11" fill="#166534" text-anchor="middle">一、共享的代价</text>
  <text x="104.375" y="178.35" font-size="11" fill="#166534" text-anchor="middle">争用、不可预测、攻击</text>
  <rect x="208.75" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="288.125" y="161.85" font-size="11" fill="#166534" text-anchor="middle">二、怎么控制</text>
  <text x="288.125" y="178.35" font-size="11" fill="#166534" text-anchor="middle">四种基本功、两类立场</text>
  <rect x="392.5" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="471.875" y="161.85" font-size="11" fill="#166534" text-anchor="middle">三、调度器演化</text>
  <text x="471.875" y="178.35" font-size="11" fill="#166534" text-anchor="middle">STFM 到 DASH</text>
  <rect x="576.25" y="141.5" width="158.75" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="655.625" y="161.85" font-size="11" fill="#166534" text-anchor="middle">四、其它手段与总结</text>
  <text x="655.625" y="178.35" font-size="11" fill="#166534" text-anchor="middle">映射、限流、线程调度</text>
  <rect x="25" y="219" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="239.35" font-size="11" fill="#6b21a8" text-anchor="middle">讲义开头 p3 到 p14 是 Recall: 复习第 13 讲；p165 又重复了一次四种基本功的清单</text>
</svg>
