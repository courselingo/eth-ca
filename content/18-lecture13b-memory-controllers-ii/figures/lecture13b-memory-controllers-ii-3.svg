<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 341" width="760" height="341"
     role="img" aria-labelledby="fig-lecture13b-memory-controllers-ii-3-title fig-lecture13b-memory-controllers-ii-3-desc">
  <title id="fig-lecture13b-memory-controllers-ii-3-title">STREAM 与 RANDOM：两种访问模式，两个被拖慢的倍数</title>
  <desc id="fig-lecture13b-memory-controllers-ii-3-desc">上排两格是两种访问模式：STREAM 顺序访问、行缓冲命中率 96%，RANDOM 随机访问、命中率 3%，两者同样内存密集。中间一条说明行 8 KB 除以缓存块 64 B 等于 128 个请求，拿到这一行的线程会把它们连着服务完。下面三格是结果：STREAM 被拖慢 1.18 倍、RANDOM 被拖慢 2.82 倍、网络化多核里的攻击可以把延迟放大到约 5000 倍。最后一条解释原因：FR-FCFS 行命中优先、然后最老的优先，它为吞吐设计，在多线程下不公平。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="341" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">STREAM 与 RANDOM：两种访问模式，两个被拖慢的倍数</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="84.35" font-size="11" fill="#166534" text-anchor="middle">STREAM：顺序访问</text>
  <text x="196.25" y="100.85" font-size="11" fill="#166534" text-anchor="middle">行缓冲命中率 96%，内存密集</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">RANDOM：随机访问</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">行缓冲命中率 3%，同样内存密集</text>
  <rect x="25" y="141.5" width="710" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="163.7" font-size="12" fill="#1e40af" text-anchor="middle">行 8 KB ÷ 缓存块 64 B = 128 个请求；拿到这一行的线程会把它们连着服务完</text>
  <rect x="25" y="205.5" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="234.1" font-size="11" fill="#6b21a8" text-anchor="middle">STREAM 被拖慢 1.18 倍</text>
  <rect x="270" y="205.5" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="234.1" font-size="11" fill="#6b21a8" text-anchor="middle">RANDOM 被拖慢 2.82 倍</text>
  <rect x="515" y="205.5" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="225.85" font-size="11" fill="#6b21a8" text-anchor="middle">网络化多核里的攻击：</text>
  <text x="625" y="242.35" font-size="11" fill="#6b21a8" text-anchor="middle">延迟约 5000 倍</text>
  <rect x="25" y="283" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="303.35" font-size="11" fill="#1e293b" text-anchor="middle">为什么：FR-FCFS 行命中优先、然后最老的优先；它为了吞吐，在多线程下不公平（p32）</text>
</svg>
