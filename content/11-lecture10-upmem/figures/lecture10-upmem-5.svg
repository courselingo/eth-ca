<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 373" width="700" height="373"
     role="img" aria-labelledby="fig-upmem-5-title fig-upmem-5-desc">
  <title id="fig-upmem-5-title">编程模型：把活分成两级</title>
  <desc id="fig-upmem-5-desc">第一行说向量加法把输入数组分给 DPU 再分给 tasklet；中间四个框是 DPU 0 到 DPU 3，每个带两个 tasklet；第三行是源给的 4 条编程建议；第四行是 dpu_alloc、dpu_load、dpu_launch 三个接口的分工。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="373" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">编程模型：把活分成两级</text>

  <rect x="23" y="56" width="654" height="54.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350.0" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">第一个例子是向量加法，它把输入数组分成两级</text>
  <text x="350.0" y="96.2" font-size="12" fill="#1e40af" text-anchor="middle">先分给 DPU，再分给 tasklet——跑在一个 DPU 上的软件线程</text>

  <rect x="23" y="136" width="142" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="94.0" y="158.2" font-size="12" fill="#b45309" text-anchor="middle">DPU 0</text>
  <text x="94.0" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">tasklet 0 · 1</text>

  <rect x="193" y="136" width="142" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="264.0" y="158.2" font-size="12" fill="#b45309" text-anchor="middle">DPU 1</text>
  <text x="264.0" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">tasklet 0 · 1</text>

  <rect x="363" y="136" width="142" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="434.0" y="158.2" font-size="12" fill="#b45309" text-anchor="middle">DPU 2</text>
  <text x="434.0" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">tasklet 0 · 1</text>

  <rect x="533" y="136" width="142" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="604.0" y="158.2" font-size="12" fill="#b45309" text-anchor="middle">DPU 3</text>
  <text x="604.0" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">tasklet 0 · 1</text>

  <rect x="23" y="216" width="654" height="54.0" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle">源给的编程建议数出来是 4 条</text>
  <text x="350.0" y="256.2" font-size="12" fill="#166534" text-anchor="middle">并行段尽量长、按独立数据块切、DPU 用得越多越好、每个 DPU 至少 11 个 tasklet</text>

  <rect x="23" y="296" width="654" height="54.0" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="350.0" y="318.2" font-size="12" fill="#6b21a8" text-anchor="middle">几个接口：dpu_alloc 分到一组 DPU，也就是一个 dpu_set</text>
  <text x="350.0" y="336.2" font-size="12" fill="#6b21a8" text-anchor="middle">dpu_load 往里装程序，dpu_launch 发射 kernel，可以同步也可以异步</text>
</svg>
