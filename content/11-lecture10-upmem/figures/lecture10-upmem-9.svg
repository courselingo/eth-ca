<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 417" width="700" height="417"
     role="img" aria-labelledby="fig-upmem-9-title fig-upmem-9-desc">
  <title id="fig-upmem-9-title">片上两种内存：WRAM 与 MRAM</title>
  <desc id="fig-upmem-9-desc">左边一块是 WRAM：持续带宽与访问模式无关，COPY 是 2800 MB/s、ADD 是 1680 MB/s；右边一块是 MRAM：延迟等于 α 加 β 乘传输大小，β 是 0.5 周期每字节，上限每周期 2 字节即 700 MB/s；下面两行说 COPY-DMA 接近上限、2556 个 DPU 约 1.6 TB/s，以及步长到 16 以上时细粒度更快，622.36 对 72.58 MB/s。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="417" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">片上两种内存：WRAM 与 MRAM</text>

  <rect x="23" y="56" width="313" height="178" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="33" y="70" font-size="11" fill="#64748b" text-anchor="start">WRAM：DPU 自己的便签内存</text>

  <rect x="38" y="84" width="283" height="54.0" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="179.5" y="106.2" font-size="12" fill="#1e40af" text-anchor="middle">持续带宽与访问模式无关</text>
  <text x="179.5" y="124.2" font-size="12" fill="#1e40af" text-anchor="middle">流式、带步长、随机都一样</text>

  <rect x="38" y="164" width="283" height="54.0" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="179.5" y="186.2" font-size="12" fill="#1e40af" text-anchor="middle">COPY 是 2800 MB/s</text>
  <text x="179.5" y="204.2" font-size="12" fill="#1e40af" text-anchor="middle">ADD 是 1680 MB/s，都在 11 个 tasklet 上</text>

  <rect x="364" y="56" width="313" height="178" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="374" y="70" font-size="11" fill="#64748b" text-anchor="start">MRAM：芯片里的 8 个 bank</text>

  <rect x="379" y="84" width="283" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520.5" y="106.2" font-size="12" fill="#b45309" text-anchor="middle">延迟 = α + β × 传输大小</text>
  <text x="520.5" y="124.2" font-size="12" fill="#b45309" text-anchor="middle">实测 β 是 0.5 周期每字节</text>

  <rect x="379" y="164" width="283" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520.5" y="186.2" font-size="12" fill="#b45309" text-anchor="middle">上限是每周期 2 字节</text>
  <text x="520.5" y="204.2" font-size="12" fill="#b45309" text-anchor="middle">350 MHz 上折合 700 MB/s</text>

  <rect x="23" y="260" width="654" height="54.0" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350.0" y="282.2" font-size="12" fill="#166534" text-anchor="middle">COPY-DMA 的持续带宽接近这个上限，2556 个 DPU 合起来约 1.6 TB/s</text>
  <text x="350.0" y="300.2" font-size="12" fill="#166534" text-anchor="middle">它只要两个 tasklet 就饱和，因为 DMA 引擎一次只做一个传输</text>

  <rect x="23" y="340" width="654" height="54.0" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="350.0" y="362.2" font-size="12" fill="#9d174d" text-anchor="middle">步长到 16 或更大时，细粒度反而比粗粒度快</text>
  <text x="350.0" y="380.2" font-size="12" fill="#9d174d" text-anchor="middle">粗粒度只用上最大持续带宽的十六分之一，622.36 MB/s，低于细粒度的 72.58 MB/s</text>
</svg>
