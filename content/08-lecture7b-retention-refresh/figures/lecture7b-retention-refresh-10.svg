<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 222" width="566" height="222"
     role="img" aria-labelledby="fig-l7b-10-title fig-l7b-10-desc">
  <title id="fig-l7b-10-title">同一个问题在闪存上</title>
  <desc id="fig-l7b-10-desc">闪存把电荷放进浮栅，同样会漏，于是错误类型里有专门的保持时间错误；补救方式也是定期刷新，读了就检查、必要时重写。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="566" height="222" fill="#ffffff"/>

  <text x="283" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个问题在闪存上</text>

  <rect x="23" y="64" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="283" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">闪存把电荷放进浮栅，同样会漏</text>
  <text x="283" y="104.2" font-size="12" fill="#1e40af" text-anchor="middle">所以错误类型里有专门的保持时间错误</text>

  <rect x="23" y="146" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="283" y="168.2" font-size="12" fill="#166534" text-anchor="middle">补救也是定期刷新：读了就检查，必要时重写</text>
  <text x="283" y="186.2" font-size="12" fill="#166534" text-anchor="middle">三维闪存同样要面对保持时间</text>
</svg>
