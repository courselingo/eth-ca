<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663 257" width="663" height="257"
     role="img" aria-labelledby="fig-l7b-3-title fig-l7b-3-desc">
  <title id="fig-l7b-3-title">保持时间分布很长：绝大多数行能撑很久</title>
  <desc id="fig-l7b-3-desc">横轴是保持时间，纵轴是行的数量；曲线是一条很长的尾，绝大多数行保持时间很长，只有极少数行必须频繁刷新。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="663" height="257" fill="#ffffff"/>

  <text x="331" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">保持时间分布：一条很长的尾</text>

  <path d="M23,80 L23,200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M23,200 L640,200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <path d="M23,200 C 110,199 190,192 260,158 C 330,124 380,90 450,86 C 540,82 600,140 640,200 Z"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>

  <text x="35" y="160" font-size="11" fill="#9d174d" text-anchor="start">极少数行：必须勤刷</text>
  <text x="450" y="150" font-size="11" fill="#166534" text-anchor="middle">绝大多数行：能撑很久</text>
  <text x="640" y="232" font-size="11" fill="#64748b" text-anchor="end">保持时间 →</text>
</svg>
