<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 338" width="486" height="338"
     role="img" aria-labelledby="fig-l7b-8-title fig-l7b-8-desc">
  <title id="fig-l7b-8-title">随机过程带来的三段含义</title>
  <desc id="fig-l7b-8-desc">只能靠观测发现；厂商给出的分布可能因为焊接高温而不准；未来可以用纠错码在线刻画，但要控制纠错开销。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="486" height="338" fill="#ffffff"/>

  <text x="243" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">随机过程带来的三段含义</text>

  <rect x="23" y="64" width="440" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="89.2" font-size="12" fill="#1e40af" text-anchor="middle">只能观测：不真的观察到，就判断不出来</text>

  <rect x="23" y="134" width="440" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="243" y="159.2" font-size="12" fill="#b45309" text-anchor="middle">厂商的分布可能不准：高温会诱发出这种变化</text>

  <rect x="23" y="204" width="440" height="42" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="243" y="229.2" font-size="12" fill="#6b21a8" text-anchor="middle">可以用纠错码在运行中持续刻画</text>

  <path d="M113,251 L113,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M243,251 L243,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M373,251 L373,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="23" y="274" width="440" height="42" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="243" y="299.2" font-size="12" fill="#9d174d" text-anchor="middle">前提：必须把纠错的开销控制住</text>
</svg>
