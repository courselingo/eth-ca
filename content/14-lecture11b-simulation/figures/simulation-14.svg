<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 876 312.0" width="876" height="312.0"
     role="img" aria-labelledby="fig-simulation-14-title fig-simulation-14-desc">
  <title id="fig-simulation-14-title">同一套方法，讲义搬到了另一个领域</title>
  <desc id="fig-simulation-14-desc">讲义最后把整讲的框架原样用在另一个问题上：怎么评估一项防疫措施的效果。它连页面的结构都沿用了，理由是这一套「怎么判断一个想法」的方法与领域无关。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="876" height="312.0" fill="#ffffff"/>

  <text x="440.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一套方法，讲义搬到了另一个领域</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">把同一套评估框架搬到另一个领域</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">沿用的是什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">五条评估路，以及三个指标的取舍</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">结果</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">用预测与实际结果对照来检验</text>
  <rect x="25" y="234" width="830" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="440.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义连「架构师会做梦」那一段都原样搬了过去，只换掉了领域名词</text>
  <text x="440.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一步是在说：方法论的适用范围不限于体系结构</text>
</svg>
