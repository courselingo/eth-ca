<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-simulation-1-title fig-simulation-1-desc">
  <title id="fig-simulation-1-title">这一讲要回答一个方法论问题</title>
  <desc id="fig-simulation-1-desc">讲义开头把它写成一句问句：我们怎么判断一个想法对目标指标有多大影响。这一讲讲的不是某个具体方案，而是给出判断本身该怎么做。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲要回答一个方法论问题</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">怎么判断一个想法对目标指标有多大影响</text>
  <rect x="25" y="138" width="340" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="195.0" y="167.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义问的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#6b21a8" text-anchor="middle">一个想法值不值得做</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它给的是</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一套判断的方法，而不是一个结论</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">前面几讲讲的是各种方案，这一讲退一步问：那些结论是怎么被验证的</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以它是方法论讲，读法要与前面不同</text>
</svg>
