<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-simulation-8-title fig-simulation-8-desc">
  <title id="fig-simulation-8-title">三者之间怎么换</title>
  <desc id="fig-simulation-8-desc">讲义把三者的作用分开说：速度与灵活性决定你多快能做出取舍，准确性决定你的取舍最后有多好、以及建仿真器要花多久，而灵活性还决定要花多少人力去改它。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三者之间怎么换</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">三个指标各自影响什么</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">速度与灵活性</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">决定你多快能做取舍</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">准确性</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">决定取舍有多好、仿真器多难建</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">注意准确性同时影响「结论的质量」与「建仿真器的成本」</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以它不是越高越好：追准确性本身也要花时间</text>
</svg>
