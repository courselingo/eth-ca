<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-simulation-9-title fig-simulation-9-desc">
  <title id="fig-simulation-9-title">高层仿真的取舍：换来什么、冒什么险</title>
  <desc id="fig-simulation-9-desc">讲义把高层仿真的做法写成一句话：把建模的抽象层次抬高，用放弃一部分准确性去换速度、灵活性与更短的开发时间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">高层仿真的取舍：换来什么、冒什么险</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">抬高层级，用准确性换速度与灵活性</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">好处</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">只要相对趋势对，不必抠绝对数字</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">风险</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">可能做出错误决定，而趋势对不对没人保证</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">风险那一条讲义是用问句写的：你怎么保证相对趋势是对的</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一问是整讲里最该记住的一句，因为它没有简单的答案</text>
</svg>
