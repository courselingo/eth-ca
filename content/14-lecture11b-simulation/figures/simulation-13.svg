<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-simulation-13-title fig-simulation-13-desc">
  <title id="fig-simulation-13-title">有人用它做出了结论，也有人写了自己的工具</title>
  <desc id="fig-simulation-13-desc">讲义列了一串用它做的研究，其中一件是做抗 RowHammer 的限流方案；它同时在控制器里实现、不改芯片、并且开源。讲义还列了一串别的仿真器，覆盖全系统、固态盘、硬盘、近存计算等。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">有人用它做出了结论，也有人写了自己的工具</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">同一套评估方法支撑起的各种工作</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">用它做的研究</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">含一件在控制器里实现的抗 RowHammer 方案</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">别的工具</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">全系统、固态盘、硬盘、近存计算各有一套</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义在这里给了一条务实的态度：也可以为自己的目的写一个</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这句话把「选工具」从找现成的变成了按目标设计</text>
</svg>
