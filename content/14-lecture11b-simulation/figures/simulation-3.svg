<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-simulation-3-title fig-simulation-3-desc">
  <title id="fig-simulation-3-title">其中一条已经有人真的做出来了</title>
  <desc id="fig-simulation-3-desc">讲义举了一个原型：用货架上买得到的 DRAM 芯片，端到端地做出内存内拷贝与真随机数生成。它的做法是故意违反 DRAM 的时序参数，去模仿那条拷贝命令的行为。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">其中一条已经有人真的做出来了</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">用现成芯片做出想验证的行为</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">靠什么做出来</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">故意违反时序参数，模仿目标命令</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">为什么值得这么做</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">比仿真更硬，比造芯片更便宜</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这类原型的价值在于它把「仿真说可行」变成了「真的跑起来了」</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而它的代价也很清楚：只能覆盖一小块功能，做不成通用实验平台</text>
</svg>
