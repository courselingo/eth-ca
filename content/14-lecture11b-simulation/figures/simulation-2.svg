<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-simulation-2-title fig-simulation-2-desc">
  <title id="fig-simulation-2-title">可以走的路不止一条</title>
  <desc id="fig-simulation-2-desc">讲义列出五条：理论证明、解析建模与估计、仿真（抽象层次与精度可以不同）、用真实系统做原型、以及真正实现出来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">可以走的路不止一条</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">评估一个想法的五条路</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">偏证明与模型</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">理论证明、解析建模与估计</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">偏实现与实测</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">仿真、原型、真正实现</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">五条路在保真度与代价上的位置不同，越靠下越可信也越贵</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲主要讲中间那一条，也就是仿真</text>
</svg>
