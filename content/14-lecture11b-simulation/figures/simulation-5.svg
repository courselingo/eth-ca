<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-simulation-5-title fig-simulation-5-desc">
  <title id="fig-simulation-5-title">仿真是什么：做梦与现实</title>
  <desc id="fig-simulation-5-desc">讲义把架构师比作会做梦的人，而仿真是他手上的关键工具：它让不存在的系统可以被评估，于是既能让很多个梦被探索，也能给梦做现实的检验。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">仿真是什么：做梦与现实</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">仿真让你能评估还不存在的东西</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">它给你什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">探索很多个梦，并判断哪个更好</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">它的风险</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">也能用假梦把自己骗过去</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">后面那句是这个比喻里最重要的一半</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它说明仿真的风险不在于不准，而在于不准却看不出来</text>
</svg>
