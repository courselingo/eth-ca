<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 381" width="760" height="381"
     role="img" aria-labelledby="fig-lecture11a-memory-controllers-4-title fig-lecture11a-memory-controllers-4-desc">
  <title id="fig-lecture11a-memory-controllers-4-title">控制器要同时守住四类要求</title>
  <desc id="fig-lecture11a-memory-controllers-4-desc">四行从上到下是控制器的四条职责：保证正确（刷新与定时）、在约束下服务请求（资源冲突与最小的写后读间隔，把请求翻译成命令序列）、缓冲并调度请求（为高性能与服务质量做重排序与管理）、管理功耗与温度（开关芯片与切换功耗状态）。每行左边是职责名，右边是它具体管什么。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="381" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">控制器要同时守住四类要求</text>
  <rect x="25" y="64" width="710" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="86.2" font-size="12" fill="#1e40af" text-anchor="middle">控制器要同时守住四类要求，只有第三类是关于性能的</text>
  <rect x="25" y="128" width="342.5" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle">保证正确</text>
  <rect x="392.5" y="128" width="342.5" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="149.85" font-size="11" fill="#1e293b" text-anchor="middle">刷新与定时</text>
  <rect x="25" y="192" width="342.5" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="214.2" font-size="12" fill="#1e40af" text-anchor="middle">在约束下服务请求</text>
  <rect x="392.5" y="192" width="342.5" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="213.85" font-size="11" fill="#1e293b" text-anchor="middle">资源冲突与最小的写后读间隔；把请求翻译成命令序列</text>
  <rect x="25" y="256" width="342.5" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="278.2" font-size="12" fill="#1e40af" text-anchor="middle">缓冲并调度请求</text>
  <rect x="392.5" y="256" width="342.5" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="277.85" font-size="11" fill="#1e293b" text-anchor="middle">为高性能与服务质量：重排序，管理行缓冲、存储体、rank、总线</text>
  <rect x="25" y="320" width="342.5" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="342.2" font-size="12" fill="#1e40af" text-anchor="middle">管理功耗与温度</text>
  <rect x="392.5" y="320" width="342.5" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="341.85" font-size="11" fill="#1e293b" text-anchor="middle">开关芯片、切换功耗状态</text>
</svg>
