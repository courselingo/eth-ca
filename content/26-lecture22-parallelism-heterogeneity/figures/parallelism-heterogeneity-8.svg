<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-8-title fig-parallelism-heterogeneity-8-desc">
  <title id="fig-parallelism-heterogeneity-8-title">多核那一面：想要 N 倍，拿到的是别的</title>
  <desc id="fig-parallelism-heterogeneity-8-desc">讲义把多核的处境说得很直接：我们想要 N 个核带来 N 倍性能，而实际拿到的是串行瓶颈加上并行部分里的各种瓶颈。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多核那一面：想要 N 倍，拿到的是别的</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">想要 N 倍，拿到串行瓶颈与并行瓶颈</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">串行那部分</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">阿姆达尔定律：串行比例封住了上限</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">并行那部分</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">同步开销、负载不均、资源争用</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义把并行部分不完美的三个原因列开了：同步、负载不均、资源争用</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">分开列的意义在于它们要用不同的办法治</text>
</svg>
