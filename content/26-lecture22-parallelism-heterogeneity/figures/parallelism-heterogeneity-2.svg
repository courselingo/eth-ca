<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-2-title fig-parallelism-heterogeneity-2-desc">
  <title id="fig-parallelism-heterogeneity-2-title">为什么要不对称：因为负载的需求差得很远</title>
  <desc id="fig-parallelism-heterogeneity-2-desc">讲义给的理由分两层。一层是负载的行为本来就不同：不同应用不同，同一应用的不同阶段不同，同一应用在不同时刻也可能不同。另一层是对称设计的本质困难：一个尺寸要套住所有负载与所有指标。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">为什么要不对称：因为负载的需求差得很远</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">对称设计是「一刀切」，而一刀切套不住</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">负载的差异</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">应用之间、阶段之间、时刻之间都不同</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">设计的困难</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">一个尺寸要同时满足所有负载与指标</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义点出这条困难适用于很多部件：核、缓存、内存、控制器、互连、磁盘、服务器</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">所以它不是多核特有的问题，只是多核上最显眼</text>
</svg>
