<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-1-title fig-parallelism-heterogeneity-1-desc">
  <title id="fig-parallelism-heterogeneity-1-title">异构就是专门化</title>
  <desc id="fig-parallelism-heterogeneity-1-desc">讲义先把术语对齐：异构与不对称是同一个意思，与同构和对称相对。它的想法是不要把所有部件做成一样的，而是让其中一些不一样，各自擅长不同的活。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">异构就是专门化</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">不要把资源都做成一样的</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">同构的做法</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">所有实例都一样</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">异构的做法</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">让一些实例不一样，各擅长一类活</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义说这是一个很一般的系统设计概念，连生活里也到处是</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而这一讲要展开的是它在多核上的那一面</text>
</svg>
