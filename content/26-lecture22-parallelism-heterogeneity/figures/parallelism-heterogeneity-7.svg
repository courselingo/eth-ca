<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-7-title fig-parallelism-heterogeneity-7-desc">
  <title id="fig-parallelism-heterogeneity-7-title">而今天它已经到处都是</title>
  <desc id="fig-parallelism-heterogeneity-7-desc">讲义列了商用系统里的例子：集成 CPU 与 GPU 的系统、手机里的 CPU 加一堆硬件加速器、异构多核（ARM 的大小核、IBM 的 Cell）、以及 CPU 加 FPGA 的系统。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而今天它已经到处都是</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">商用系统里的不对称</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">两种形态</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">CPU 与 GPU 集成、CPU 加一批加速器</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">两种组合</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">大小核异构多核、CPU 加 FPGA</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义还区分了一件事：CPU 与 GPU 的差异在**执行模型与指令集**上</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而不只是微架构上的差异，所以那一类比大小核更深一层</text>
</svg>
