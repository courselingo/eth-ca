<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 836 312.0" width="836" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-10-title fig-parallelism-heterogeneity-10-desc">
  <title id="fig-parallelism-heterogeneity-10-title">大核与小核：两种设计取向</title>
  <desc id="fig-parallelism-heterogeneity-10-desc">讲义把两类核的差别列成了一条对照。大核乱序、取指宽、流水线深、分支预测强、功能单元多；小核顺序、取指窄、流水线浅、预测简单、单元少。而大核的面积效率低：两倍性能要四倍面积。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="836" height="312.0" fill="#ffffff"/>

  <text x="420.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">大核与小核：两种设计取向</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">大核与小核的取向，以及大核的面积效率</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">大核</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">乱序、宽取指、深流水；两倍性能四倍面积</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">小核</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">顺序、窄取指、浅流水；面积小</text>
  <rect x="25" y="234" width="790" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="420.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「两倍性能四倍面积」这一条是后面所有算术的起点</text>
  <text x="420.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它说明大核的价格不是线性的，所以不能靠加大核来解决问题</text>
</svg>
