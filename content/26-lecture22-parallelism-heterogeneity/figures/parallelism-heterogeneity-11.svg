<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-11-title fig-parallelism-heterogeneity-11-desc">
  <title id="fig-parallelism-heterogeneity-11-title">两头都不对，于是把它们拼在一起</title>
  <desc id="fig-parallelism-heterogeneity-11-desc">讲义先算了两笔账：都赛大核，单线程与串行段快，但并行段的吞吐低；都赛小核，并行段吞吐高，但单线程很差。于是它的想法是在同一个芯片上两种都放。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两头都不对，于是把它们拼在一起</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">赛大核与赛小核各缺一头，于是两者并存</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">都赛大核</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">串行段快，并行段吞吐低</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">都赛小核</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">并行段吞吐高，单线程差</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义给的方案是一个大核加很多小核，也就是不对称多核</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它的算术也很直白：串行段交给大核，并行段用小核加大核一起跑</text>
</svg>
