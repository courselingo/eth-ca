<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-6-title fig-parallelism-heterogeneity-6-desc">
  <title id="fig-parallelism-heterogeneity-6-title">代价落在哪：设计、管理与切换</title>
  <desc id="fig-parallelism-heterogeneity-6-desc">讲义把优势与代价并排列出。优势是能同时优化多个指标、能适应负载行为、还能在通用的可用性下拿到专用的好处。代价是设计与验证更复杂、调度到不对称部件上更麻烦、以及在部件之间切换本身有开销。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">代价落在哪：设计、管理与切换</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">不对称换来的与付出的</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">拿到什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">多指标可优化、能适应、专用加通用</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">付出什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">设计验证更难、调度更难、切换有开销</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">最后那条最容易被忽略：切换不是免费的，而切换得多会抵消掉收益</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这与前面讲预取时那条「侵略性太强反而更差」是同一形状的顾虑</text>
</svg>
