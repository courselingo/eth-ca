<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-3-title fig-parallelism-heterogeneity-3-desc">
  <title id="fig-parallelism-heterogeneity-3-title">不对称把「定制」变成可能</title>
  <desc id="fig-parallelism-heterogeneity-3-desc">讲义把两种做法的后果分开：同构的做法在不同负载下要么费电要么不够快；异构的做法让处理需求与资源对上，把代码放到最合适的部件上跑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">不对称把「定制」变成可能</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">把代码放到最合适的部件上</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">同构的后果</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">对不同的负载行为都不最优</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">异构的后果</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">可以定制，也可以随负载调整</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「最合适」在这里是有两面的：能耗最低，同时性能够用</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这两个要求同时写出来，说明它不是一个纯性能的优化</text>
</svg>
