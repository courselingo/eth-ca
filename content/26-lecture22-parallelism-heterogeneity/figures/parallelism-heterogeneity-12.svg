<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-12-title fig-parallelism-heterogeneity-12-desc">
  <title id="fig-parallelism-heterogeneity-12-title">把阿姆达尔定律改一改</title>
  <desc id="fig-parallelism-heterogeneity-12-desc">讲义给了一个针对不对称多核的简化式子：串行部分由大核执行，并行部分由小核与大核一起执行。式子里的参数分别是可并行比例、大核数量、小核数量、以及大核相对小核的加速比。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把阿姆达尔定律改一改</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">串行部分交给大核，并行部分两者一起跑</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">式子的三个假设</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">串行走大核、并行两者都上</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">它带来的新问题</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">大核该给串行还是给并行</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第四行的那个问题正是后面那些机制要回答的</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而它之所以成为问题，是因为「串行段」不止一种，而且随时间变</text>
</svg>
