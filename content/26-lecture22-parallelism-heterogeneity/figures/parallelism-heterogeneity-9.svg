<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-9-title fig-parallelism-heterogeneity-9-desc">
  <title id="fig-parallelism-heterogeneity-9-title">而被串行化的不只是串行段</title>
  <desc id="fig-parallelism-heterogeneity-9-desc">讲义把「被串行化的代码段」的来源列全了：阿姆达尔意义上的串行部分、临界区、屏障、以及流水线程序里的限速级。它们都减少性能、限制扩展、还浪费能量。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而被串行化的不只是串行段</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">四种被串行化的代码段</text>
  <rect x="25" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="110.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">串行部分</text>
  <text x="110.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">阿姆达尔的那一段</text>
  <rect x="223" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="308.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">临界区</text>
  <text x="308.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">互斥导致的排队</text>
  <rect x="421" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="506.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">屏障</text>
  <text x="506.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">等最慢的那个到达</text>
  <rect x="619" y="138" width="170" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="704.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">限速级</text>
  <text x="704.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">流水线里最慢的一级</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一页很重要，因为后面那些机制正是按这四类分头治的</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">尤其是后三类：它们不是「程序本来就不能并行」，而是并行结构自身带来的</text>
</svg>
