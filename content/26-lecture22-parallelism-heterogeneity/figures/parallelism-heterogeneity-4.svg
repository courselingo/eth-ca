<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 776 312.0" width="776" height="312.0"
     role="img" aria-labelledby="fig-parallelism-heterogeneity-4-title fig-parallelism-heterogeneity-4-desc">
  <title id="fig-parallelism-heterogeneity-4-title">而前面几讲里其实到处都是它</title>
  <desc id="fig-parallelism-heterogeneity-4-desc">讲义列了一串此前已经见过的异构例子。它们分布在很不同的层次上，从流水线里的标量与向量，一直到内存里的不同刷新率。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="776" height="312.0" fill="#ffffff"/>

  <text x="390.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而前面几讲里其实到处都是它</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一个想法，散在前面好几讲里</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">处理器侧的例子</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">标量与向量流水线、通用指令与单指令多数据</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">内存侧的例子</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">按线程簇分政策、按行定刷新率、分层延迟、混合内存</text>
  <rect x="25" y="234" width="730" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="390.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这份清单的作用是说明：异构不是一个新点子，而是一条一直存在的做法</text>
  <text x="390.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一讲要问的是它在多核上会变成什么样</text>
</svg>
