<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 373" width="700" height="373"
     role="img" aria-labelledby="fig-upmem-8-title fig-upmem-8-desc">
  <title id="fig-upmem-8-title">能算什么：算术吞吐的一处硬边界</title>
  <desc id="fig-upmem-8-desc">第一行是微基准的设置：在 WRAM 里做读-改-写，tasklet 从 1 到 24，覆盖四种数据类型与四种运算；中间两栏是 32 位加/减 6 条指令得 58.33 MOPS、64 位 7 条得 50.00 MOPS；第三行给出吞吐等于频率除以指令数，所以 32 位快 17%；第四行是两条观察：11 个 tasklet 饱和，以及乘除与浮点没有原生支持。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="373" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">能算什么：算术吞吐的一处硬边界</text>

  <rect x="23" y="56" width="654" height="54.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350.0" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">微基准：在 WRAM 里流式做读-改-写，tasklet 从 1 到 24</text>
  <text x="350.0" y="96.2" font-size="12" fill="#1e40af" text-anchor="middle">数据类型有 int32、int64、float、double，运算是加、减、乘、除</text>

  <rect x="23" y="136" width="313" height="54.0" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="179.5" y="158.2" font-size="12" fill="#1e40af" text-anchor="middle">32 位加/减：6 条指令</text>
  <text x="179.5" y="176.2" font-size="12" fill="#1e40af" text-anchor="middle">350 MHz 上算得 58.33 MOPS</text>

  <rect x="364" y="136" width="313" height="54.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520.5" y="158.2" font-size="12" fill="#b45309" text-anchor="middle">64 位加/减：7 条指令</text>
  <text x="520.5" y="176.2" font-size="12" fill="#b45309" text-anchor="middle">同样频率上只有 50.00 MOPS</text>

  <rect x="23" y="216" width="654" height="54.0" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle">第 79 页给了这两个数怎么来的：流水线填满时每个周期退休一条指令</text>
  <text x="350.0" y="256.2" font-size="12" fill="#166534" text-anchor="middle">吞吐 = 频率 ÷ 指令数，所以 32 位比 64 位快 17%</text>

  <rect x="23" y="296" width="654" height="54.0" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="350.0" y="318.2" font-size="12" fill="#9d174d" text-anchor="middle">观察 1：算术吞吐在 11 个或更多 tasklet 上饱和</text>
  <text x="350.0" y="336.2" font-size="12" fill="#9d174d" text-anchor="middle">观察 2：整数加减有原生硬件支持，乘除与浮点没有，要靠运行库模拟</text>
</svg>
