<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 311" width="700" height="311"
     role="img" aria-labelledby="fig-upmem-3-title fig-upmem-3-desc">
  <title id="fig-upmem-3-title">它按加速器的方式被用</title>
  <desc id="fig-upmem-3-desc">第一行说集成方式是加速器模型，与普通 DDR4 内存条共存；中间两栏对比，左栏是和 GPU 一样的三步，右栏是计算就做在数据待着的那颗芯片里；最后一行说它像 GPU 计算，差别在数据要不要离开那颗芯片。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="311" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它按加速器的方式被用</text>

  <rect x="23" y="56" width="654" height="54.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350.0" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">源讲义把集成方式叫「加速器模型」</text>
  <text x="350.0" y="96.2" font-size="12" fill="#1e40af" text-anchor="middle">与普通 DDR4 内存条共存，是一个松耦合加速器</text>

  <rect x="23" y="136" width="313" height="72.0" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="179.5" y="158.2" font-size="12" fill="#1e40af" text-anchor="middle">和 GPU 一样的地方</text>
  <text x="179.5" y="176.2" font-size="12" fill="#1e40af" text-anchor="middle">数据显式搬运、kernel 显式发射</text>
  <text x="179.5" y="194.2" font-size="12" fill="#1e40af" text-anchor="middle">三步是：搬进去、跑 kernel、搬出来</text>

  <rect x="364" y="136" width="313" height="72.0" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="520.5" y="158.2" font-size="12" fill="#9d174d" text-anchor="middle">不一样的地方</text>
  <text x="520.5" y="176.2" font-size="12" fill="#9d174d" text-anchor="middle">计算做在数据待着的那颗芯片里</text>
  <text x="520.5" y="194.2" font-size="12" fill="#9d174d" text-anchor="middle">省掉的正是「搬一趟」这件事</text>

  <rect x="23" y="234" width="654" height="54.0" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350.0" y="256.2" font-size="12" fill="#166534" text-anchor="middle">源讲义在这一页直接写它 resembles GPU computing</text>
  <text x="350.0" y="274.2" font-size="12" fill="#166534" text-anchor="middle">差别不在接口像不像，而在数据要不要离开它所在的那颗芯片</text>
</svg>
