<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 282" width="700" height="282"
     role="img" aria-labelledby="fig-l8a-8-title fig-l8a-8-desc">
  <title id="fig-l8a-8-title">HARP：两条路同时走，各管一类</title>
  <desc id="fig-l8a-8-desc">主动一侧走旁路把片上纠错暂时绕开，快速找出直接错误；被动一侧不绕，用至少和片上纠错一样强的二级纠错安全地找出间接错误。两条路同时走，不是先后两步。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="282" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">HARP：两条路同时走，各管一类</text>

  <rect x="23" y="56" width="654" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="33" y="72" font-size="11" fill="#64748b" text-anchor="start">主动一侧：走旁路，把片上纠错暂时绕开</text>
  <rect x="43" y="88" width="614" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="114.2" font-size="12" fill="#1e40af" text-anchor="middle">用已有的刻画方法，快速找出直接错误</text>

  <rect x="23" y="170" width="654" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="33" y="186" font-size="11" fill="#64748b" text-anchor="start">被动一侧：不绕，接一个更强的二级纠错</text>
  <rect x="43" y="202" width="614" height="44" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="350" y="228.2" font-size="12" fill="#6b21a8" text-anchor="middle">安全地找出间接错误</text>
</svg>
