<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 223" width="700" height="223"
     role="img" aria-labelledby="fig-l8a-7-title fig-l8a-7-desc">
  <title id="fig-l8a-7-title">同一次读失败，有两种来路</title>
  <desc id="fig-l8a-7-desc">直接错误来自存储单元本身，间接错误来自片上纠错算法解码时自己产生的假象，两类混在一起就没法解释现象。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="223" fill="#ffffff"/>

  <text x="350" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一次读失败，有两种来路</text>

  <rect x="250" y="54" width="200" height="44" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="350" y="80.2" font-size="12" fill="#6b21a8" text-anchor="middle">读出来是错的</text>

  <rect x="23" y="128" width="313" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="179.5" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle">直接错误</text>
  <text x="179.5" y="168.2" font-size="12" fill="#1e40af" text-anchor="middle">来自存储单元本身</text>
  <text x="179.5" y="186.2" font-size="12" fill="#1e40af" text-anchor="middle">这才是真正该担心的</text>

  <rect x="364" y="128" width="313" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520.5" y="150.2" font-size="12" fill="#b45309" text-anchor="middle">间接错误</text>
  <text x="520.5" y="168.2" font-size="12" fill="#b45309" text-anchor="middle">来自片上纠错算法</text>
  <text x="520.5" y="186.2" font-size="12" fill="#b45309" text-anchor="middle">数量被纠错能力的上界卡住</text>

  <path d="M250,103 L250,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,103 L450,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
