<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-3-title fig-vliw-systolic-3-desc">
  <title id="fig-vliw-systolic-3-title">VLIW 与超标量的区别，就在「谁来查依赖」</title>
  <desc id="fig-vliw-systolic-3-desc">讲义把两者并排对照：超标量由硬件取下多条指令并检查它们之间的依赖；VLIW 由编译器把独立指令打包成一个更大的包，硬件取下并并行执行它们。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">VLIW 与超标量的区别，就在「谁来查依赖」</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">同一个目标，依赖检查的责任不同</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">超标量</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">硬件取下多条，硬件查依赖</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">VLIW</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">编译器打包，硬件不查依赖</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个区别决定了后面所有的取舍</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">硬件少做一件事，就必然有别的角色多做一件事</text>
</svg>
