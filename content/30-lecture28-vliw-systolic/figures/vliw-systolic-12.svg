<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-12-title fig-vliw-systolic-12-desc">
  <title id="fig-vliw-systolic-12-title">它擅长的活：卷积，以及把矩阵乘铺在阵列上</title>
  <desc id="fig-vliw-systolic-12-desc">讲义用卷积做例子，因为它是滤波、模式匹配、相关、多项式求值这些活的基本形状，也是卷积网络里成百上千层在做的事。而二维的情形是把两个矩阵相乘，结果留在各单元的累加器里。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它擅长的活：卷积，以及把矩阵乘铺在阵列上</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">卷积与矩阵乘，都可以铺在阵列上</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">为什么是卷积</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">同一个权重滑过很多个位置</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">二维的情形</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">矩阵相乘，结果留在累加器</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">卷积那个形状正好对上阵列：权重不动，数据流过</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而这也解释了为什么这类阵列后来在机器学习硬件上活了过来</text>
</svg>
