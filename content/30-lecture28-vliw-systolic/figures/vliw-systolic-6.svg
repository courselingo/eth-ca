<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-6-title fig-vliw-systolic-6-desc">
  <title id="fig-vliw-systolic-6-title">它的哲学：聪明的编译器，笨的机器</title>
  <desc id="fig-vliw-systolic-6-desc">讲义把它归到与精简指令集同一支哲学上：让编译器做那些难的工作，硬件只做很少的翻译与译码。差别在于 VLIW 还要编译器负责找出并行并排好。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它的哲学：聪明的编译器，笨的机器</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">把难的工作交给编译器</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">精简指令集那一支</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">编译器把高层语言翻成简单指令并重排</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">VLIW 多加的一件</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">编译器还要找出足够多的并行并排进一个包</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「笨的机器」在这里不是贬义，而是一个明确的分工主张</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而这条主张能不能成立，取决于编译器能不能真的找到那么多并行</text>
</svg>
