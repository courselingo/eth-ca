<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 846 312.0" width="846" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-11-title fig-vliw-systolic-11-desc">
  <title id="fig-vliw-systolic-11-title">它和流水线差在哪</title>
  <desc id="fig-vliw-systolic-11-desc">讲义专门列了几条区别：这里的一个单元是一个完整的处理单元，而不是一个流水级；阵列结构可以是非线性的、多维的；连接可以是多方向的、速度也可以不同；单元还可以带本地存储并执行一个内核。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="846" height="312.0" fill="#ffffff"/>

  <text x="425.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它和流水线差在哪</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">与流水的四点差别</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">结构上</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">可以是多维的、非线性的</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">单元上</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">每个是完整单元，可带本地存储、执行内核</text>
  <rect x="25" y="234" width="800" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="425.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第一点与第二点合起来说明：它的「空间」是真的二维空间</text>
  <text x="425.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这一点让它超出了「把一条流水线加深」的范围</text>
</svg>
