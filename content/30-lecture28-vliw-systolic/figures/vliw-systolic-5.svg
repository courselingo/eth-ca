<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-5-title fig-vliw-systolic-5-desc">
  <title id="fig-vliw-systolic-5-title">锁步执行：一个卡住，全都卡住</title>
  <desc id="fig-vliw-systolic-5-desc">讲义给了一条很硬的性质：长指令里的任何一个操作停顿，所有并行操作都跟着停顿。在真正的 VLIW 机器里，依赖相关的停顿全部由编译器处理，硬件不做依赖检查。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">锁步执行：一个卡住，全都卡住</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">锁步：bundle 里一个停，全部都停</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">编译器负责</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">把所有依赖相关的停顿安排好</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">硬件不负责</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">不查依赖，也不处理可变延迟</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义在这一页留了两个问号：可变延迟的操作怎么办，访存停顿怎么办</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">这两个问号就是 VLIW 后来最大的麻烦</text>
</svg>
