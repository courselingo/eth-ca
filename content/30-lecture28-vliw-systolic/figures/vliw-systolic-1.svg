<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-1-title fig-vliw-systolic-1-desc">
  <title id="fig-vliw-systolic-1-title">这一讲把上一讲那个对偶的两端各推到极致</title>
  <desc id="fig-vliw-systolic-1-desc">上一讲给了时空对偶：阵列用空间，向量用时间。这一讲的两半正好落在那两端，而且各自都推到了极端。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲把上一讲那个对偶的两端各推到极致</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">时空对偶的两端，各推到一个极端</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">用时间那一端</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">一条长指令里打包多条独立操作</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">用空间那一端</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">规则的单元阵列，数据流过它们</text>
  <rect x="25" y="234" width="700" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="375.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">两端看起来很不一样，而它们有同一个共同点</text>
  <text x="375.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">都把复杂度从硬件挪到别处；而都只擅长规则的并行</text>
</svg>
