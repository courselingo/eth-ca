<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-8-title fig-vliw-systolic-8-desc">
  <title id="fig-vliw-systolic-8-title">而它其余的麻烦都来自「静态」这两个字</title>
  <desc id="fig-vliw-systolic-8-desc">讲义把 VLIW 的短板列了一串，而它们可以归到一个根上：调度是编译期定死的，所以它与那一代的微架构绑得很紧。换一代机器，为上一代优化的代码就会变差，而且必须重编译。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而它其余的麻烦都来自「静态」这两个字</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">静态调度带来的三条麻烦</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">绑死微架构</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">为一代优化的代码在下一代变差</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">换机器要重编译</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">而二进制兼容是商用机器很难绕过的要求</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">还有一条藏在锁步里：对可变延迟与长延迟操作没有容忍</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而访存恰恰就是长延迟，所以这条直接打在它最需要的地方</text>
</svg>
