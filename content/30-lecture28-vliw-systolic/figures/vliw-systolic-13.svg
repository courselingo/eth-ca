<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-13-title fig-vliw-systolic-13-desc">
  <title id="fig-vliw-systolic-13-title">它的优点与代价，其实是同一条性质的两面</title>
  <desc id="fig-vliw-systolic-13-desc">优点是每个数据被多次使用、并发高、设计规则、把计算与访存带宽平衡起来。缺点是它比较专用：计算必须能对上单元的组织与功能，而且不擅长不规则的并行。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它的优点与代价，其实是同一条性质的两面</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">规则带来效率，也带来专用</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">规则换来的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">数据被多次用、并发高、带宽用得省</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">规则锁住的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">计算必须适配阵列，不规则并行做不了</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「每个数据被多次使用」这一条是它省带宽的根本原因</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而它同时也意味着：数据必须在阵列里待得够久才划算</text>
</svg>
