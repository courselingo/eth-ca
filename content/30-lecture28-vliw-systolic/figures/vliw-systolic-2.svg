<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-vliw-systolic-2-title fig-vliw-systolic-2-desc">
  <title id="fig-vliw-systolic-2-title">先看这一讲在「找指令级并发」这件事里的位置</title>
  <desc id="fig-vliw-systolic-2-desc">讲义先列了一串办法：流水线、细粒度多线程、乱序执行、数据流、超标量、VLIW、脉动阵列、解耦访存执行、以及单指令多数据。这一讲讲的是其中两条。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">先看这一讲在「找指令级并发」这件事里的位置</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">一串找并发的办法，这一讲占两条</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">前面讲过的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">流水线、乱序、超标量、细粒度多线程</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">这一讲的</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">把并行交给编译器的 VLIW、与阵列化的脉动阵列</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">把这一串摆在一起看，能看出一条共同的走向：谁来做「找并行」这件事</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">有的交硬件、有的交编译器、有的在设计时就定死</text>
</svg>
