<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 856 312.0" width="856" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-12-title fig-virtual-memory-12-desc">
  <title id="fig-virtual-memory-12-title">第二个功能：保护与隔离</title>
  <desc id="fig-virtual-memory-12-desc">同一套机制还顺带解决了保护问题。每个进程有自己的页表，于是它只能访问映射在自己页表里的物理页，也就无法改写别的进程的内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="856" height="312.0" fill="#ffffff"/>

  <text x="430.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第二个功能：保护与隔离</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">每个进程一张页表，于是互相看不见</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">保护怎么来的</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">进程只能访问自己页表里映射的页</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">还能更细</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">页级访问控制，按页决定谁能读谁能写</text>
  <rect x="25" y="234" width="810" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="430.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义指出这是虚拟内存的第二个功能，而且它和容量那个功能用的是同一套机制</text>
  <text x="430.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">换句话说：一个机制同时解决了两个看起来无关的问题</text>
</svg>
