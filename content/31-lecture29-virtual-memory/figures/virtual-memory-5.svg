<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 786 312.0" width="786" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-5-title fig-virtual-memory-5-desc">
  <title id="fig-virtual-memory-5-title">页与帧，以及一句话把问题换个说法</title>
  <desc id="fig-virtual-memory-5-desc">虚拟地址空间被切成页，物理地址空间被切成帧。一个虚拟页要么映到一个物理帧，要么落在磁盘上。而讲义给了一句很好用的话：物理内存就是磁盘的缓存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="786" height="312.0" fill="#ffffff"/>

  <text x="395.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">页与帧，以及一句话把问题换个说法</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">页映到帧，或者落在磁盘上</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">如果页在内存里</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">映到一个物理帧</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">如果不在</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">落在磁盘上，访问就触发缺页</text>
  <rect x="25" y="234" width="740" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="395.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「物理内存是磁盘的缓存」这句话把问题整个换了个说法</text>
  <text x="395.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">于是前面几讲讲缓存用过的全部工具，都可以搬过来</text>
</svg>
