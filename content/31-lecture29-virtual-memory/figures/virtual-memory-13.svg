<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 866 312.0" width="866" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-13-title fig-virtual-memory-13-desc">
  <title id="fig-virtual-memory-13-title">而它更大的价值在于它划出了一条软硬件边界</title>
  <desc id="fig-virtual-memory-13-desc">讲义在收尾时把虚拟内存称作最成功的例子之一：它是「为程序员提供架构支持」的范例，是「软硬件如何分工」的范例，也是「软硬件协作」的范例。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="866" height="312.0" fill="#ffffff"/>

  <text x="435.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">而它更大的价值在于它划出了一条软硬件边界</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">它示范了三件事</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">架构层面</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">为程序员提供支持的一个范例</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">工程层面</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">软硬件分工与协作的一个范例</text>
  <rect x="25" y="234" width="820" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="435.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">讲义接着问：这套东西往后怎么扩展</text>
  <text x="435.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">它列的四个趋势是物理内存越来越大、内存变成混合的、还有别的几条</text>
</svg>
