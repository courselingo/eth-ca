<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 758 312.0" width="758" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-2-title fig-virtual-memory-2-desc">
  <title id="fig-virtual-memory-2-title">如果直接用物理地址，会难在哪</title>
  <desc id="fig-virtual-memory-2-desc">讲义列了三条：程序员要自己管理物理内存空间；代码与数据很难重定位，因为地址直接写在程序里；以及多进程很难支持，包括它们之间的保护、隔离与共享。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="758" height="312.0" fill="#ffffff"/>

  <text x="381.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">如果直接用物理地址，会难在哪</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">直接物理寻址的三条困难</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">写程序时</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">要自己管物理内存，地址写死在程序里</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">跑多个进程时</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">保护、隔离与共享都很难做</text>
  <rect x="25" y="234" width="710" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">第三条值得留意：它把「容量」问题与「保护」问题接在了一起</text>
  <text x="380.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而这两件事最后是由同一个机制一起解决的</text>
</svg>
