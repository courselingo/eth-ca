<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 766 312.0" width="766" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-3-title fig-virtual-memory-3-desc">
  <title id="fig-virtual-memory-3-title">做法：给每个程序一个「很大」的地址空间</title>
  <desc id="fig-virtual-memory-3-desc">讲义给的想法是：让每个程序看到一个很大的地址空间，而背后是小得多的物理内存。程序员不必操心物理内存怎么管，硬件与系统软件协作、自动地把这件事办掉。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="766" height="312.0" fill="#ffffff"/>

  <text x="385.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">做法：给每个程序一个「很大」的地址空间</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">造一个「地址空间很大」的错觉</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">谁来做</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">硬件与系统软件协作</text>
  <rect x="393" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">对程序员</text>
  <text x="563.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">透明，不必操心物理内存</text>
  <rect x="25" y="234" width="720" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="385.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">「透明」这个词在这里是成本，也是收益</text>
  <text x="385.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">收益是程序好写；成本是这份自动管理本身要花硬件与时间</text>
</svg>
