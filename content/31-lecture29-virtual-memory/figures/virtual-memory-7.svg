<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 806 312.0" width="806" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-7-title fig-virtual-memory-7-desc">
  <title id="fig-virtual-memory-7-title">第一个麻烦：那张映射表太大了</title>
  <desc id="fig-virtual-memory-7-desc">讲义先算了一笔账：六十四位虚拟地址配四十位物理地址、页大小四字节千字节的情形下，光是页表就要二百多字节的二次方这么多条，而且这只是**一个进程**，而进程往往还用不满整个空间。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="806" height="312.0" fill="#ffffff"/>

  <text x="405.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第一个麻烦：那张映射表太大了</text>
  <rect x="25" y="70" width="712" height="42" fill="#fce7f3" stroke="#ec4899"/>
  <text x="381.0" y="95.9" font-size="14" fill="#9d174d" text-anchor="middle">页表太大，而且每个进程一张</text>
  <rect x="25" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="195.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">大在哪</text>
  <text x="195.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">位数一多，条目数就爆炸</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">而且</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">每个进程都要一张，还常常用不满</text>
  <rect x="25" y="234" width="760" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="405.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这个麻烦的解法用了两级思路：把表也分层，让它按需存在</text>
  <text x="405.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">注意这与前面几讲处理缓存元数据的思路是同一个方向</text>
</svg>
