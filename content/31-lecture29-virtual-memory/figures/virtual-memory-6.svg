<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 796 312.0" width="796" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-6-title fig-virtual-memory-6-desc">
  <title id="fig-virtual-memory-6-title">两者逐项对应，于是前面几讲的东西可以直接搬</title>
  <desc id="fig-virtual-memory-6-desc">讲义列了一张对照表：缓存的块对应虚拟内存的页，块大小对应页大小，块内偏移对应页内偏移，未命中对应缺页，索引对应虚拟页号，标记存储对应页表，数据存储对应物理内存。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="796" height="312.0" fill="#ffffff"/>

  <text x="400.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两者逐项对应，于是前面几讲的东西可以直接搬</text>
  <rect x="25" y="70" width="712" height="42" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="381.0" y="95.9" font-size="14" fill="#1e40af" text-anchor="middle">缓存与虚拟内存的逐项对应</text>
  <rect x="25" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="195.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">结构上的对应</text>
  <text x="195.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">块对应页、标记对应页表、数据对应物理内存</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">事件上的对应</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">未命中对应缺页，换出对应替换</text>
  <rect x="25" y="234" width="750" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这张表的意义是它把一整套已经讲过的东西借了过来</text>
  <text x="400.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而它同时说明虚拟内存这层「新」机制，骨子里是一个熟悉的东西</text>
</svg>
