<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 826 312.0" width="826" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-9-title fig-virtual-memory-9-desc">
  <title id="fig-virtual-memory-9-title">解法二：把最近用过的映射缓存起来</title>
  <desc id="fig-virtual-memory-9-desc">讲义给的想法是把页表项缓存在处理器里的一个小结构中。它成立的理由是页表访问本身有局部性：连续的指令与访存很可能落在同一页上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="826" height="312.0" fill="#ffffff"/>

  <text x="415.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">解法二：把最近用过的映射缓存起来</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">把最近用过的映射放进一个小缓存</text>
  <rect x="25" y="138" width="340" height="68" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="195.0" y="167.7" font-size="15" fill="#1e40af" text-anchor="middle">为什么能成立</text>
  <text x="195.0" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">页表访问有时间与空间局部性</text>
  <rect x="393" y="138" width="340" height="68" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.0" y="167.7" font-size="15" fill="#b45309" text-anchor="middle">它有多大</text>
  <text x="563.0" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">很小，约一个周期可访问</text>
  <rect x="25" y="234" width="780" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="415.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">这一页讲义专门说了一句：前面讲缓存与预取时讨论过的所有问题，在这里都适用</text>
  <text x="415.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">包括多级、相联度、替换策略、要不要预取、以及多核之间的一致性</text>
</svg>
