<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 13.0 816 312.0" width="816" height="312.0"
     role="img" aria-labelledby="fig-virtual-memory-8-title fig-virtual-memory-8-desc">
  <title id="fig-virtual-memory-8-title">解法一：把页表也分成多级</title>
  <desc id="fig-virtual-memory-8-desc">讲义给的做法是层次化：让一个很小的第一级页表常驻物理内存，其余的按需挂上去。代价是翻译一次要走多级，也就是要访问多次内存才能找到那一条映射。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="13.0" width="816" height="312.0" fill="#ffffff"/>

  <text x="410.0" y="48" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">解法一：把页表也分成多级</text>
  <rect x="25" y="70" width="712" height="42" fill="#d1fae5" stroke="#22c55e"/>
  <text x="381.0" y="95.9" font-size="14" fill="#166534" text-anchor="middle">多级页表：只有第一级必须常驻</text>
  <rect x="25" y="138" width="340" height="68" fill="#d1fae5" stroke="#22c55e"/>
  <text x="195.0" y="167.7" font-size="15" fill="#166534" text-anchor="middle">换来什么</text>
  <text x="195.0" y="185.7" font-size="12" fill="#166534" text-anchor="middle">常驻的那部分很小</text>
  <rect x="393" y="138" width="340" height="68" fill="#fce7f3" stroke="#ec4899"/>
  <text x="563.0" y="167.7" font-size="15" fill="#9d174d" text-anchor="middle">付出什么</text>
  <text x="563.0" y="185.7" font-size="12" fill="#9d174d" text-anchor="middle">N 级就要访问 N 次才能拿到映射</text>
  <rect x="25" y="234" width="770" height="68" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410.0" y="263.7" font-size="15" fill="#6b21a8" text-anchor="middle">于是「付出什么」那一项直接引出下一个机制</text>
  <text x="410.0" y="281.7" font-size="12" fill="#6b21a8" text-anchor="middle">而那个机制又是前面讲过的老办法：加一层缓存</text>
</svg>
