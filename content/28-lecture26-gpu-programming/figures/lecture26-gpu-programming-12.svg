<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265.5" width="760" height="265.5"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-12-title fig-lecture26-gpu-programming-12-desc">
  <title id="fig-lecture26-gpu-programming-12-title">协作的收益：五个案例</title>
  <desc id="fig-lecture26-gpu-programming-12-desc">上排三格与下排三格是六个案例的数字：Bézier 曲面在 Kaveri 上最多快 47%、在 Jetson TX1 上快 17%；矩阵填充在 Jetson TX1 上快 29%（4000 乘 4000、填充为 1）；流压缩在 Jetson TX1 上快 25%、在 Kaveri 上最多快 82%；广度优先搜索快 15%（小前沿交给 CPU）；单源最短路径最多快 22%；自运动补偿与运动物体检测用 RANSAC，迭代之间独立。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="265.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">协作的收益：五个案例</text>
  <rect x="25" y="64" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="84.35" font-size="11" fill="#166534" text-anchor="middle">Bézier 曲面</text>
  <text x="135" y="100.85" font-size="11" fill="#166534" text-anchor="middle">Kaveri 最多快 47%</text>
  <text x="135" y="117.35" font-size="11" fill="#166534" text-anchor="middle">Jetson TX1 快 17%</text>
  <rect x="270" y="64" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="84.35" font-size="11" fill="#166534" text-anchor="middle">矩阵填充</text>
  <text x="380" y="100.85" font-size="11" fill="#166534" text-anchor="middle">Jetson TX1 快 29%</text>
  <text x="380" y="117.35" font-size="11" fill="#166534" text-anchor="middle">4000 乘 4000，填充为 1</text>
  <rect x="515" y="64" width="220" height="66" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="84.35" font-size="11" fill="#166534" text-anchor="middle">流压缩</text>
  <text x="625" y="100.85" font-size="11" fill="#166534" text-anchor="middle">Jetson TX1 快 25%</text>
  <text x="625" y="117.35" font-size="11" fill="#166534" text-anchor="middle">Kaveri 最多快 82%</text>
  <rect x="25" y="158" width="220" height="82.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">广度优先搜索</text>
  <text x="135" y="194.85" font-size="11" fill="#1e40af" text-anchor="middle">快 15%</text>
  <text x="135" y="211.35" font-size="11" fill="#1e40af" text-anchor="middle">小前沿交给 CPU</text>
  <text x="135" y="227.85" font-size="11" fill="#1e40af" text-anchor="middle">大前沿交给 GPU</text>
  <rect x="270" y="158" width="220" height="82.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="194.85" font-size="11" fill="#1e40af" text-anchor="middle">单源最短路径</text>
  <text x="380" y="211.35" font-size="11" fill="#1e40af" text-anchor="middle">最多快 22%</text>
  <rect x="515" y="158" width="220" height="82.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="178.35" font-size="11" fill="#1e40af" text-anchor="middle">自运动补偿与检测</text>
  <text x="625" y="194.85" font-size="11" fill="#1e40af" text-anchor="middle">RANSAC；迭代之间独立</text>
  <text x="625" y="211.35" font-size="11" fill="#1e40af" text-anchor="middle">一个迭代给一个 CPU 线程</text>
  <text x="625" y="227.85" font-size="11" fill="#1e40af" text-anchor="middle">与一个 GPU 块</text>
</svg>
