<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 293.5" width="760" height="293.5"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-8-title fig-lecture26-gpu-programming-8-desc">
  <title id="fig-lecture26-gpu-programming-8-title">SIMD 利用率：分支发散从哪里来</title>
  <desc id="fig-lecture26-gpu-programming-8-desc">上排两格是成因与发散：GPU 用一条 SIMD 流水线在控制逻辑上省面积，代价是把多个标量线程编成 warp；warp 内线程走到不同路径就发生分支发散。中间一条说明它与条件执行、谓词执行、掩码执行是同一件事。下面两格是两种归约映射：朴素映射的条件是线程编号对两倍步长取模为零，参与线程越来越稀疏；无发散映射把步长从块大小折半，条件是线程编号小于步长，参与线程连续。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="293.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">SIMD 利用率：分支发散从哪里来</text>
  <rect x="25" y="64" width="342.5" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">成因</text>
  <text x="196.25" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">GPU 用一条 SIMD 流水线在控制逻辑上省面积</text>
  <text x="196.25" y="117.35" font-size="11" fill="#b45309" text-anchor="middle">代价是把多个标量线程编成 warp</text>
  <rect x="392.5" y="64" width="342.5" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="92.6" font-size="11" fill="#b45309" text-anchor="middle">发散</text>
  <text x="563.75" y="109.1" font-size="11" fill="#b45309" text-anchor="middle">warp 内线程走到不同路径，就发生分支发散</text>
  <rect x="25" y="158" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="178.35" font-size="11" fill="#1e293b" text-anchor="middle">这与条件执行、谓词执行、掩码执行是同一件事</text>
  <rect x="25" y="219" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="239.35" font-size="11" fill="#1e40af" text-anchor="middle">朴素归约映射</text>
  <text x="196.25" y="255.85" font-size="11" fill="#1e40af" text-anchor="middle">条件是 t 除以 2 倍步长余 0，参与线程越来越稀疏</text>
  <rect x="392.5" y="219" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="239.35" font-size="11" fill="#166534" text-anchor="middle">无发散映射</text>
  <text x="563.75" y="255.85" font-size="11" fill="#166534" text-anchor="middle">步长从块大小折半，条件是 t 小于步长，参与线程连续</text>
</svg>
