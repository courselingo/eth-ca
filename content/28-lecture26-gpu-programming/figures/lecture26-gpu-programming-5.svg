<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-5-title fig-lecture26-gpu-programming-5-desc">
  <title id="fig-lecture26-gpu-programming-5-title">每代的流多处理器数与每核流处理器数</title>
  <desc id="fig-lecture26-gpu-programming-5-desc">上排三格与下排三格是六代产品：Tesla 2007 的 30 乘 8、Fermi 2010 的 16 乘 32、Kepler 2012 的 15 乘 192、Maxwell 2014 的 24 乘 128、Pascal 2016 的 56 乘 64、Volta 2017 的 80 乘 64。下面两条说明这两列各是什么，以及流多处理器与流处理器在别的叫法里对应什么。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">每代的流多处理器数与每核流处理器数</text>
  <rect x="25" y="64" width="220" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">Tesla 2007：30 × 8</text>
  <rect x="270" y="64" width="220" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">Fermi 2010：16 × 32</text>
  <rect x="515" y="64" width="220" height="33" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">Kepler 2012：15 × 192</text>
  <rect x="25" y="125" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="145.35" font-size="11" fill="#166534" text-anchor="middle">Maxwell 2014：24 × 128</text>
  <rect x="270" y="125" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="145.35" font-size="11" fill="#166534" text-anchor="middle">Pascal 2016：56 × 64</text>
  <rect x="515" y="125" width="220" height="33" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="145.35" font-size="11" fill="#166534" text-anchor="middle">Volta 2017：80 × 64</text>
  <rect x="25" y="186" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="206.35" font-size="11" fill="#1e40af" text-anchor="middle">前一个数是流多处理器数，后一个数是每个流多处理器里的流处理器数</text>
  <rect x="25" y="247" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="267.35" font-size="11" fill="#1e293b" text-anchor="middle">流多处理器等于计算单元，里面有 warp 调度器与 SIMD 流水线；流处理器等于 CUDA 核等于向量 lane</text>
</svg>
