<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-9-title fig-lecture26-gpu-programming-9-desc">
  <title id="fig-lecture26-gpu-programming-9-title">原子操作：warp 内冲突度与直方图</title>
  <desc id="fig-lecture26-gpu-programming-9-desc">上排两格是何时需要原子操作（多个线程可能同时更新同一个内存位置，CUDA 的写法是 atomicAdd）与 warp 内冲突度的定义（一个 warp 里有几个线程更新同一位置，取值 1 到 32）。下面两格是两种后果：冲突度为 1 时更新可以并发，大于 1 时只能串行。再下面两条是直方图的投票为什么是原子加，以及私有化这个优化办法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="338" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">原子操作：warp 内冲突度与直方图</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">何时需要原子操作</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">多个线程可能同时更新同一个内存位置；CUDA 写法 atomicAdd</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">warp 内冲突度</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">一个 warp 里有几个线程更新同一位置，取值 1 到 32</text>
  <rect x="25" y="141.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="161.85" font-size="11" fill="#166534" text-anchor="middle">冲突度为 1</text>
  <text x="196.25" y="178.35" font-size="11" fill="#166534" text-anchor="middle">更新可以并发完成</text>
  <rect x="392.5" y="141.5" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="161.85" font-size="11" fill="#b45309" text-anchor="middle">冲突度大于 1</text>
  <text x="563.75" y="178.35" font-size="11" fill="#b45309" text-anchor="middle">更新只能串行</text>
  <rect x="25" y="219" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="239.35" font-size="11" fill="#1e40af" text-anchor="middle">直方图：每个像素对相应区间投一票，这一票就是一次原子加；自然图像里冲突频繁</text>
  <rect x="25" y="280" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="300.35" font-size="11" fill="#6b21a8" text-anchor="middle">优化是私有化：每个块先在共享内存里维护子直方图，最后再合并到全局直方图</text>
</svg>
