<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-6-title fig-lecture26-gpu-programming-6-desc">
  <title id="fig-lecture26-gpu-programming-6-title">访存这一节：占用率、合并访存、布局与复用</title>
  <desc id="fig-lecture26-gpu-programming-6-desc">上排两格是占用率：它等于活跃 warp 的比例；流多处理器的典型资源是 64 个 warp、32 个块、256 KB 寄存器与 64 KB 共享内存。中间一条说占用率由三个量决定：每块线程数、每线程寄存器数、每块共享内存。下面两格是合并访存（同一 warp 的所有线程访问同一条缓存行时带宽利用率达到峰值）与数据布局（CPU 偏好 AoS，GPU 偏好 SoA）。最下面一条是数据复用与分块的做法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="338" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">访存这一节：占用率、合并访存、布局与复用</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">占用率等于活跃 warp 的比例</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">SM 典型资源：64 个 warp、32 个块</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">另外两项资源</text>
  <text x="563.75" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">256 KB 寄存器、64 KB 共享内存</text>
  <rect x="25" y="141.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="161.85" font-size="11" fill="#1e293b" text-anchor="middle">占用率由三个量决定：每块线程数、每线程寄存器数、每块共享内存（p42）</text>
  <rect x="25" y="202.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="222.85" font-size="11" fill="#166534" text-anchor="middle">合并访存</text>
  <text x="196.25" y="239.35" font-size="11" fill="#166534" text-anchor="middle">同一 warp 的所有线程访问同一条缓存行时，带宽利用率达到峰值</text>
  <rect x="392.5" y="202.5" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="222.85" font-size="11" fill="#166534" text-anchor="middle">数据布局</text>
  <text x="563.75" y="239.35" font-size="11" fill="#166534" text-anchor="middle">CPU 偏好 AoS，GPU 偏好 SoA；一个是线性访问，一个带步长</text>
  <rect x="25" y="280" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="300.35" font-size="11" fill="#1e40af" text-anchor="middle">数据复用与分块：把输入切成能放进共享内存的块，装载后 __syncthreads()，再从共享内存取用</text>
</svg>
