<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 363.5" width="760" height="363.5"
     role="img" aria-labelledby="fig-lecture26-gpu-programming-11-title fig-lecture26-gpu-programming-11-desc">
  <title id="fig-lecture26-gpu-programming-11-title">协作计算：从各算各的到真正同时动手</title>
  <desc id="fig-lecture26-gpu-programming-11-desc">上排两格是老做法（CPU 与 GPU 各算一份，最后合并）与新做法（统一内存加系统范围原子操作，直接往同一份结果里写）。中间两格是统一内存与系统范围原子操作各自的写法与来历。下面一条是内核启动异步带来的一件好事：CPU 在等 GPU 时可以继续干活。最后三格是三种协作模式：数据划分、粗粒度任务划分与细粒度任务划分。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="363.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">协作计算：从各算各的到真正同时动手</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e293b" text-anchor="middle">老做法</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e293b" text-anchor="middle">CPU 与 GPU 各算一份，最后再合并</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="84.35" font-size="11" fill="#166534" text-anchor="middle">新做法</text>
  <text x="563.75" y="100.85" font-size="11" fill="#166534" text-anchor="middle">统一内存加系统范围原子操作，直接往同一份结果里写</text>
  <rect x="25" y="141.5" width="342.5" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="160" font-size="10" fill="#1e40af" text-anchor="middle">统一内存</text>
  <text x="196.25" y="175" font-size="10" fill="#1e40af" text-anchor="middle">cudaMallocManaged 取代分配与拷贝</text>
  <text x="196.25" y="190" font-size="10" fill="#1e40af" text-anchor="middle">CUDA 6.0 起有统一内存</text>
  <text x="196.25" y="205" font-size="10" fill="#1e40af" text-anchor="middle">CUDA 8.0 加 Pascal 起有 GPU 缺页</text>
  <rect x="392.5" y="141.5" width="342.5" height="75" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="160" font-size="10" fill="#1e40af" text-anchor="middle">系统范围原子操作</text>
  <text x="563.75" y="175" font-size="10" fill="#1e40af" text-anchor="middle">CUDA 的 atomicAdd_system</text>
  <text x="563.75" y="190" font-size="10" fill="#1e40af" text-anchor="middle">OpenCL 2.0 的共享虚拟内存</text>
  <text x="563.75" y="205" font-size="10" fill="#1e40af" text-anchor="middle">HSA 的平台原子操作</text>
  <rect x="25" y="244.5" width="710" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="264.85" font-size="11" fill="#b45309" text-anchor="middle">内核启动是异步的：CPU 在等 GPU 的时候可以继续干活</text>
  <rect x="25" y="305.5" width="220" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="325.85" font-size="11" fill="#6b21a8" text-anchor="middle">数据划分</text>
  <rect x="270" y="305.5" width="220" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="325.85" font-size="11" fill="#6b21a8" text-anchor="middle">粗粒度任务划分</text>
  <rect x="515" y="305.5" width="220" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="325.85" font-size="11" fill="#6b21a8" text-anchor="middle">细粒度任务划分</text>
</svg>
